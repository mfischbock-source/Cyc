// Interfaz: value y onChange en formato "YYYY-MM" (o "" = sin elegir). Internamente usa <input type="date">
// y recuerda el día elegido para que el calendario no salte al día 1 dentro del mismo mes.
function CalMes({value,onChange,style}){
  var _r=useRef("");
  var _val=(_r.current&&_r.current.slice(0,7)===value)?_r.current:(value?value+"-01":"");
  return <input type="date" value={_val} title="Elegí el mes"
    onChange={function(e){var v=e.target.value;_r.current=v;if(onChange)onChange(v?v.slice(0,7):"");}}
    style={style}/>;
}
// fetch con límite de tiempo: si una llamada tarda más de ms, la aborta para que NO trabe el lote entero.
async function fetchTO(url,opts,ms){var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},ms||120000);try{return await fetch(url,Object.assign({},opts||{},{signal:ctrl.signal}));}finally{clearTimeout(to);}}
// Persistencia de estado entre pestañas: guarda cada estado en un store en memoria (por key)
// y lo restaura al re-montar el componente. Así no se pierde lo cargado al cambiar de sección.
var _persistStore={};
function usePersist(key,initial){
  const [v,setV]=useState(function(){return (key in _persistStore)?_persistStore[key]:initial;});
  useEffect(function(){_persistStore[key]=v;},[v]);
  return [v,setV];
}
// Descarte de una tipificación. La elección manual del supervisor (configuracion/tipificaciones) manda.
// modo="whitelist" (LISTA BLANCA): se analiza SOLO lo marcado "analizar"; todo lo demás se descarta.
// modo por defecto (blacklist): se analiza todo salvo lo marcado "descartar" o lo que el patrón auto sugiere descartar.
// Gemela de normTip() en lib_comun.php: saca lo no-ASCII (acentos y bytes de encoding roto), mayúsculas, colapsa lo no alfanumérico.
function normTip(s){return String(s==null?"":s).replace(/[^\x20-\x7E]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();}
// Regla de una tipificación: primero exacta, si no por texto normalizado (Neotel a veces devuelve los acentos rotos).
var _reglasNorm=new WeakMap();
function reglaDe(reglas,tip){if(!reglas)return "";var k=String(tip||"").toUpperCase().trim();if(reglas[k])return reglas[k];var m=_reglasNorm.get(reglas);if(!m){m={};Object.keys(reglas).forEach(function(r){var n=normTip(r);if(n&&(!m[n]||reglas[r]==="analizar"))m[n]=reglas[r];});_reglasNorm.set(reglas,m);}return m[normTip(tip)]||"";}
function aplicaDescarte(tip,descartarAuto,reglas,modo){var r=reglaDe(reglas,tip);if(r)return r==="descartar";if(modo==="whitelist")return true;return !!descartarAuto;}

// ── Export de auditoría a Excel (SheetJS 0.18.5) ────────────────────────────
// "La hoja de tu auditoría, te sacaste tanta puntuación" (pedido reunión, min 31):
// se presenta al banco en Excel con el puntaje y el detalle por criterio.
function _hojaAuditoriaAOA(c){
  var tel=_telLlamada(c.grabacion,c.id||"");
  var rows=[
    ["DASA — Hoja de Auditoría"],
    [],
    ["Operador", c.gestor||"—"],
    ["Cartera / Cliente", c.cliente||"—"],
    ["Teléfono", tel],
    ["Fecha de la llamada", c.fecha||"—"],
    ["Grabación", c.grabacion||"—"],
    ["Puntaje final", (typeof c.score==="number"?c.score:"—")+"  ("+scoreLabel(typeof c.score==="number"?c.score:0)+")"],
    [],
    ["CRITERIOS EVALUADOS"],
    ["Criterio","Peso %","Puntaje","Comentario"]
  ];
  (c.criterios||[]).forEach(function(cr){
    rows.push([cr.nombre||cr.criterio||"—", (typeof cr.peso==="number"?cr.peso:""), (typeof cr.puntaje==="number"?cr.puntaje:(cr.resultado||cr.estado||"")), cr.comentario||""]);
  });
  rows.push([]);
  if(c.analisis){ rows.push(["Análisis"]); rows.push([c.analisis]); rows.push([]); }
  if(c.recomendacion){ rows.push(["Recomendación"]); rows.push([c.recomendacion]); }
  return rows;
}
function exportarHojaAuditoria(c){
  if(!window.XLSX){ alert("No se pudo cargar el generador de Excel (revisá la conexión)."); return; }
  var ws=window.XLSX.utils.aoa_to_sheet(_hojaAuditoriaAOA(c));
  ws["!cols"]=[{wch:26},{wch:10},{wch:10},{wch:62}];
  var wb=window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb,ws,"Auditoría");
  var tel=_telLlamada(c.grabacion,c.id||"");
  var nom=("Auditoria_"+(c.gestor||"operador")+"_"+(c.fecha||"")+"_"+tel).replace(/[^\w\-]+/g,"_");
  window.XLSX.writeFile(wb,nom+".xlsx");
}
// Reporte por operador: resumen (una fila por llamada) + una hoja de detalle por llamada.
function exportarAuditoriasOperador(gestor,lista){
  if(!window.XLSX){ alert("No se pudo cargar el generador de Excel (revisá la conexión)."); return; }
  if(!lista||!lista.length){ alert("No hay auditorías para exportar en este filtro."); return; }
  var wb=window.XLSX.utils.book_new();
  var prom=Math.round(lista.reduce(function(s,a){return s+(a.score||0);},0)/lista.length);
  var head=[
    ["DASA — Auditorías del operador"],
    ["Operador", gestor||"—"],
    ["Llamadas auditadas", lista.length],
    ["Promedio", prom+"  ("+scoreLabel(prom)+")"],
    [],
    ["Fecha","Teléfono","Grabación","Puntaje","Categoría"]
  ];
  lista.slice().sort(function(a,b){return (a.fecha||"").localeCompare(b.fecha||"");}).forEach(function(a){
    head.push([a.fecha||"", _telLlamada(a.grabacion,a.id||""), a.grabacion||"", (typeof a.score==="number"?a.score:""), scoreLabel(a.score||0)]);
  });
  var wsR=window.XLSX.utils.aoa_to_sheet(head);
  wsR["!cols"]=[{wch:12},{wch:16},{wch:34},{wch:9},{wch:14}];
  window.XLSX.utils.book_append_sheet(wb,wsR,"Resumen");
  // Detalle por llamada (limitado a 25 hojas para que el archivo no explote)
  lista.slice(0,25).forEach(function(a,i){
    var ws=window.XLSX.utils.aoa_to_sheet(_hojaAuditoriaAOA(a));
    ws["!cols"]=[{wch:26},{wch:10},{wch:10},{wch:62}];
    var hoja=(_telLlamada(a.grabacion,a.id||"")+"_"+(a.fecha||"")).replace(/[^\w\-]+/g,"_").slice(0,28)||("Llamada"+(i+1));
    try{ window.XLSX.utils.book_append_sheet(wb,ws,hoja); }catch(e){ window.XLSX.utils.book_append_sheet(wb,ws,"Llamada"+(i+1)); }
  });
  var nom=("Auditorias_"+(gestor||"operador")).replace(/[^\w\-]+/g,"_");
  window.XLSX.writeFile(wb,nom+".xlsx");
}

<script type="text/babel">
// ─── CHART COMPONENTS ─────────────────────────────────────────────────────
function BarChart({id,data,keys,names,colors,yFmt,h=200}){
  const ref=useRef(null),inst=useRef(null);
  useEffect(()=>{
    if(inst.current){inst.current.destroy();inst.current=null;}
    if(!ref.current)return;
    inst.current=new Chart(ref.current,{type:"bar",data:{labels:data.map(d=>d.dia||d.label||""),datasets:keys.map((k,i)=>({label:names[i],data:data.map(d=>d[k]),backgroundColor:colors[i]+"cc",borderRadius:4,borderSkipped:false}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{x:{grid:{color:"#e0eeda"},ticks:{font:{size:11}}},y:{grid:{color:"#e0eeda"},ticks:{font:{size:11},callback:yFmt||(v=>v)}}}}});
    return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[JSON.stringify(data)]);
  return <div style={{position:"relative",height:h}}><canvas ref={ref}/></div>;
}
function AreaChart({id,data,kVal,kObj,nVal,nObj,yFmt,h=200}){
  const ref=useRef(null),inst=useRef(null);
  useEffect(()=>{
    if(inst.current){inst.current.destroy();inst.current=null;}
    if(!ref.current)return;
    inst.current=new Chart(ref.current,{type:"line",data:{labels:data.map(d=>d.dia),datasets:[{label:nVal,data:data.map(d=>d[kVal]),borderColor:C.green,backgroundColor:C.green+"28",fill:true,tension:0.4,borderWidth:2,pointRadius:3},{label:nObj,data:data.map(d=>d[kObj]),borderColor:C.warn,backgroundColor:"transparent",fill:false,tension:0,borderWidth:2,borderDash:[6,3],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{x:{grid:{color:"#e0eeda"},ticks:{font:{size:11}}},y:{grid:{color:"#e0eeda"},ticks:{font:{size:11},callback:yFmt||(v=>v)}}}}});
    return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[JSON.stringify(data)]);
  return <div style={{position:"relative",height:h}}><canvas ref={ref}/></div>;
}

// ─── SCORE GAUGE ─────────────────────────────────────────────────────────
const ScoreGauge=({score,objetivo=85})=>{
  const col=scoreColor(score),circ=2*Math.PI*38,prog=circ*(score/100);
  const lbl=scoreLabel(score);
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"6px 0"}}>

      <circle cx="50" cy="50" r="38" fill="none" stroke={col} strokeWidth="8" strokeDasharray={`${prog} ${circ}`} strokeLinecap="round" transform="rotate(-90 50 50)"/>
      <text x="50" y="44" textAnchor="middle" fontSize="22" fontWeight="700" fill={col}>{score}</text>
      <text x="50" y="58" textAnchor="middle" fontSize="9" fill={C.muted}>/ 100</text>
    </svg>
    <div style={{marginTop:3,background:scoreBg(score),border:`1px solid ${scoreBorder(score)}`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700,color:col}}>{lbl}</div>
  </div>;
};


// ─── SCORE BAR CHART SVG (con etiquetas de categoría) ─────────────────────
// ── Helpers de score mensual (mes completo con días sin análisis en gris) ──
var _MESCORTO=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function mesesConDatos(anArr){
  var set={};
  (anArr||[]).forEach(function(d){var f=d.fecha||"";if(f.length>=7)set[f.slice(0,7)]=1;});
  return Object.keys(set).sort();
}
function mesLabel(k){ if(!k)return "—"; return (_MESCORTO[parseInt(k.slice(5,7),10)]||k.slice(5,7))+" "+k.slice(0,4); }
// Excluir de Calidad al Gestor DEMO (legajo G-99) y placeholders de prueba
function esGestorDemo(g){var l=String((g&&g.legajo)||"").toUpperCase().replace(/[^A-Z0-9]/g,"");var n=String((g&&g.name)||"").toLowerCase();return l==="G99"||n.indexOf("demo")>=0||n.indexOf("prueba")>=0;}
// Devuelve los 30/31 días del mes; los días sin análisis quedan con score 0 y sinDatos:true (barra gris)
function mesCompletoDias(anArr,mesKey){
  var y=parseInt(mesKey.slice(0,4),10), m=parseInt(mesKey.slice(5,7),10);
  var ult=new Date(y,m,0).getDate();
  var byDay={};
  (anArr||[]).forEach(function(d){var f=d.fecha||"";if(f.slice(0,7)!==mesKey)return;(byDay[f]=byDay[f]||[]).push(d);});
  var dias=[], suma=0, conDatos=0, mx=0, mn=100;
  for(var i=1;i<=ult;i++){
    var dd=(i<10?"0":"")+i, key=mesKey+"-"+dd, arr=byDay[key];
    if(arr&&arr.length){
      var sc=Math.round(arr.reduce(function(a,x){return a+x.score;},0)/arr.length);
      dias.push({dia:dd,score:sc,audios:arr.length});
      suma+=sc; conDatos++; if(sc>mx)mx=sc; if(sc<mn)mn=sc;
    } else { dias.push({dia:dd,score:0,sinDatos:true}); }
  }
  return {dias:dias,prom:conDatos?Math.round(suma/conDatos):0,conDatos:conDatos,max:conDatos?mx:0,min:conDatos?mn:0,label:mesLabel(mesKey)};
}

function ScoreBarSVG({data,objetivo=85}){
  const H=230,pL=32,pB=52,pT=24,pR=12,n=data.length;
  const minSlot=46, many=n>13, W=many?Math.max(580,n*minSlot):580;   // ancho dinámico: con muchos días crece y hace scroll (no se aplasta)
  const iH=H-pB-pT,iW=W-pL-pR;
  const slot=iW/n;
  const bW=Math.min(slot*0.55,38);
  const sy=v=>pT+iH-(v/100)*iH;
  const cx=i=>pL+i*slot+slot/2;

  return <div style={{overflowX:"auto",width:"100%"}}><svg viewBox={`0 0 ${W} ${H}`} style={{width:many?W+"px":"100%",height:H,display:"block",maxWidth:"none"}}>
    {/* zone bands (background) */}
    <rect x={pL} y={sy(70)+1}  width={iW} height={sy(0)-sy(70)-1}   fill="#fce8e8" opacity="0.5" rx="2"/>
    <rect x={pL} y={sy(85)+1}  width={iW} height={sy(70)-sy(85)}    fill="#fff8e1" opacity="0.55" rx="2"/>
    <rect x={pL} y={sy(99)+1}  width={iW} height={sy(85)-sy(99)}    fill={C.pale}  opacity="0.5" rx="2"/>
    <rect x={pL} y={sy(100)}   width={iW} height={sy(99)-sy(100)+1} fill="#fff8e0" opacity="0.6" rx="2"/>

    {/* threshold lines */}
    {[70,85,100].map(v=><g key={v}>
      <line x1={pL} y1={sy(v)} x2={W-pR} y2={sy(v)} stroke={v===70?C.danger:v===85?C.warn:C.light} strokeOpacity=".4" strokeWidth=".8" strokeDasharray="4 3"/>
      <text x={pL-4} y={sy(v)+3.5} textAnchor="end" fontSize="9" fill={C.muted}>{v}</text>
    </g>)}

    {/* objetivo line */}
    {objetivo>0&&objetivo!==70&&objetivo!==85&&objetivo!==100&&<g>
      <line x1={pL} y1={sy(objetivo)} x2={W-pR} y2={sy(objetivo)} stroke={C.info} strokeDasharray="7 3" strokeWidth="1.5"/>
      <rect x={pL} y={sy(objetivo)-9} width={38} height={13} fill={C.info} rx="3" opacity=".12"/>
      <text x={pL+19} y={sy(objetivo)+1} textAnchor="middle" fontSize="9" fontWeight="700" fill={C.info}>Obj.{objetivo}</text>
    </g>}

    {/* bars */}
    {data.map((d,i)=>{
      if(d.sinDatos){const gx=cx(i)-bW/2;return <g key={i}>
        <rect x={gx} y={sy(0)-4} width={bW} height={4} fill={C.border} rx="2" opacity=".7"/>
        <text x={cx(i)} y={H-pB+15} textAnchor="middle" fontSize="10" fill={C.border}>{d.dia}</text>
      </g>;}
      const col=scoreColor(d.score),bh=Math.max((d.score/100)*iH,2),by=sy(d.score),x=cx(i)-bW/2;
      const lbl=scoreLabel(d.score).split(" ")[0]; // first word only: No/Bueno/Muy/Sobresar.
      const shortLbl=d.score>=90?"E":d.score>=80?"MB":d.score>=70?"B":"R";
      return <g key={i}>
        {/* bar shadow */}
        <rect x={x+1} y={by+2} width={bW} height={bh} fill={col} rx="4" opacity=".15"/>
        {/* bar */}
        <rect x={x} y={by} width={bW} height={bh} fill={col} rx="4" opacity=".88"/>
        {/* score value ABOVE bar — with enough clearance */}
        <text x={cx(i)} y={by-9} textAnchor="middle" fontSize="12" fontWeight="800" fill={col}>{d.score}</text>
        {/* category badge ABOVE score */}
        <text x={cx(i)} y={by-20} textAnchor="middle" fontSize="8.5" fontWeight="600" fill={col} opacity=".8">{shortLbl}</text>
        {/* day label BELOW */}
        <text x={cx(i)} y={H-pB+15} textAnchor="middle" fontSize="10" fill={C.muted}>{d.dia}</text>
      </g>;
    })}

    {/* legend bottom */}
    {(()=>{
      const items=[{l:"Regular <70",c:C.danger},{l:"Bueno 70-79",c:C.warn},{l:"Muy bueno 80-89",c:C.light},{l:"Excelente ≥90",c:C.green}];
      const lW=130, startX=(W-(items.length*lW))/2;
      return items.map((it,i)=><g key={i}>
        <rect x={startX+i*lW} y={H-15} width={8} height={8} fill={it.c} rx="2"/>
        <text x={startX+i*lW+11} y={H-8} fontSize="9" fill={C.muted}>{it.l}</text>
      </g>);
    })()}
  </svg></div>;
}

// ─── AUDIOS PANEL (reutilizable) ──────────────────────────────────────────
function AudiosPanel({audios,sel,setSel}){
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    {audios.map(a=>{
      const open=sel===a.id,col=scoreColor(a.score);
      return <div key={a.id} style={{border:`1px solid ${open?col+"66":C.border}`,borderRadius:10,background:open?`${col}08`:C.white}}>
        <div onClick={()=>setSel(open?null:a.id)} style={{display:"flex",alignItems:"center",padding:"11px 14px",cursor:"pointer",gap:12}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0,gap:3}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:`${col}18`,border:`2px solid ${col}55`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:16,fontWeight:700,color:col}}>{a.score}</span>
            </div>
            <span style={{fontSize:10,fontWeight:600,color:col,background:`${col}15`,borderRadius:10,padding:"1px 6px",whiteSpace:"nowrap"}}>{scoreLabel(a.score)}</span>
          </div>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:3}}>
              <span style={{fontSize:13,fontWeight:600,color:C.text}}>🎧 {a.id}</span>
              <span style={{fontSize:12,color:C.muted}}>{a.hora}</span>
              <span style={{fontSize:12,color:C.muted}}>⏱ {a.dur||a.duracion}</span>
            </div>
            {a.aspectos&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{a.aspectos.slice(0,3).map((asp,j)=><span key={j} style={{fontSize:11,color:asp.startsWith("✓")?C.green:asp.startsWith("✗")?C.danger:C.warn}}>{asp}</span>)}</div>}
          </div>
          <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
        </div>
        {open&&<div style={{padding:"0 14px 14px",borderTop:`1px solid ${col}22`}}>
          {a.grabacion&&<div style={{background:"#1e3320",borderRadius:8,padding:"9px 12px",margin:"10px 0"}}><div style={{fontSize:10,color:"rgba(255,255,255,0.55)",marginBottom:6}}>🎧 Audio de la llamada</div><audio controls preload="none" src={"/audio.php?file="+encodeURIComponent(a.grabacion)+"&token="} style={{width:"100%"}}/></div>}
          {a.aspectos&&<div style={{display:"flex",gap:6,flexWrap:"wrap",paddingTop:10,marginBottom:10}}>{a.aspectos.map((asp,j)=><span key={j} style={{fontSize:12,background:asp.startsWith("✓")?`${C.light}18`:asp.startsWith("✗")?`${C.danger}18`:`${C.warn}18`,color:asp.startsWith("✓")?C.green:asp.startsWith("✗")?C.danger:C.warn,border:`1px solid ${asp.startsWith("✓")?C.paleB:asp.startsWith("✗")?C.danger+"44":C.warn+"44"}`,borderRadius:20,padding:"3px 10px"}}>{asp}</span>)}</div>}
          {a.criterios&&a.criterios.length>0&&<div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
            {a.criterios.map((c,j)=>(
              <div key={j} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:12,borderBottom:`1px solid ${C.border}`,paddingBottom:4}}>
                <span style={{flex:1,color:C.text}}>{c.nombre} <span style={{color:C.muted}}>({c.peso}%)</span>{c.comentario&&<span style={{display:"block",color:C.muted,fontSize:11,marginTop:1}}>{c.comentario}</span>}</span>
                <span style={{fontWeight:700,color:scoreColor(c.puntaje),flexShrink:0}}>{c.puntaje}</span>
              </div>
            ))}
          </div>}
          <div style={{background:C.bg,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,lineHeight:1.7,marginTop:a.aspectos?0:10}}>
            <strong style={{color:C.muted,fontSize:12,display:"block",marginBottom:3}}>🤖 Análisis IA:</strong>
            {a.analisis}
          </div>
          {a.recomendacion&&<div style={{background:`${C.info}0d`,border:`1px solid ${C.info}33`,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,lineHeight:1.7,marginTop:8}}>
            <strong style={{color:C.info,fontSize:12,display:"block",marginBottom:3}}>💡 Recomendación:</strong>
            {a.recomendacion}
          </div>}
          {a.transcripcion&&<details style={{marginTop:8}}><summary style={{cursor:"pointer",fontSize:12,fontWeight:700,color:C.info}}>📝 Ver transcripción</summary><div style={{fontSize:12,color:C.text,lineHeight:1.6,marginTop:6,background:C.bg,borderRadius:8,padding:"10px 12px",whiteSpace:"pre-wrap",maxHeight:240,overflowY:"auto"}}>{a.transcripcion}</div></details>}
        </div>}
      </div>;
    })}
  </div>;
}

// ─── CALIDAD VIEW (reutilizable gestor+supervisor) ────────────────────────
function CalidadView({user,objetivo=85}){
  const [tab,setTab]=useState("mes");
  const [mesSel,setMesSel]=useState(null);
  const [selAudio,setSelAudio]=useState(null);
  const [selDia,setSelDia]=useState(null);
  const [selHA,setSelHA]=useState(null);
  const [histTab,setHistTab]=useState("diario");

  // ── DATOS REALES del gestor logueado (Firestore analisis_llamadas) ──────────
  const [analisisGestor,setAnalisisGestor]=useState(null);
  useEffect(function(){
    if(!user||!user.neotelId||!window.db){setAnalisisGestor([]);return;}
    window.db.collection("analisis_llamadas").where("neotelId","==",String(user.neotelId)).get()
      .then(function(snap){setAnalisisGestor(snap.docs.map(function(d){return d.data();}));})
      .catch(function(e){console.error("[DASA] análisis gestor:",e);setAnalisisGestor([]);});
  },[user]);
  var _anG=(analisisGestor||[]).filter(function(d){return d.es_valida!==false&&typeof d.score==="number";});
  var _mkAudio=function(d){return {id:d.idLlamada||d.grabacion||"—",hora:d.hora||"",dur:d.dur||"",score:d.score,etiqueta:d.etiqueta||"",aspectos:d.aspectos||[],criterios:d.criterios||[],analisis:d.analisis||"",recomendacion:d.recomendacion||"",grabacion:d.grabacion||"",transcripcion:d.transcripcion||""};};
  var scoreMensualActual=_anG.length?Math.round(_anG.reduce(function(a,d){return a+d.score;},0)/_anG.length):0;
  var _byDay={};
  _anG.forEach(function(d){var f=d.fecha||"";if(!f)return;(_byDay[f]=_byDay[f]||[]).push(d);});
  var _diasK=Object.keys(_byDay).sort();
  var scoresDias=_diasK.length?_diasK.map(function(f){var arr=_byDay[f];return {dia:f.slice(5),score:Math.round(arr.reduce(function(a,d){return a+d.score;},0)/arr.length)};}):[{dia:"—",score:0}];
  var _ultK=_diasK.length?_diasK[_diasK.length-1]:null;
  var audiosHoy=_ultK?_byDay[_ultK].map(_mkAudio):[{id:"—",hora:"",dur:"",score:0,aspectos:[],analisis:"Todavía no hay llamadas tuyas analizadas."}];
  var scoreHoy=_ultK?Math.round(audiosHoy.reduce(function(a,x){return a+x.score;},0)/audiosHoy.length):0;
  var recHoy=_anG.length
    ?("Tu score promedio es "+scoreMensualActual+" sobre "+_anG.length+" llamadas analizadas. Repasá tus llamadas de menor puntaje para reforzar la propuesta de pago y el cierre con confirmación.")
    :"Todavía no hay llamadas tuyas analizadas. Cuando se analicen tus audios vas a ver acá tu score real y las recomendaciones del Agente IA.";
  var historial=_diasK.slice().reverse().map(function(f){var arr=_byDay[f];var sc=Math.round(arr.reduce(function(a,d){return a+d.score;},0)/arr.length);return {dia:f.slice(5),score:sc,audios:arr.length,rec:"Promedio del día "+sc+" sobre "+arr.length+" llamadas analizadas.",detalle:arr.map(_mkAudio)};});
  var _byMes={};
  _anG.forEach(function(d){var f=d.fecha||"";if(f.length<7)return;var k=f.slice(0,7);(_byMes[k]=_byMes[k]||[]).push(d);});
  var _mesesK=Object.keys(_byMes).sort();
  var _MES=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var scoresMensuales=_mesesK.length?_mesesK.map(function(k,i){var arr=_byMes[k];var ss=arr.map(function(d){return d.score;});var prom=Math.round(ss.reduce(function(a,b){return a+b;},0)/ss.length);var dd={};arr.forEach(function(d){dd[d.fecha]=1;});return {mes:(_MES[parseInt(k.slice(5,7),10)]||k.slice(5,7))+" "+k.slice(0,4),dias:Object.keys(dd).length,promedio:prom,max:Math.max.apply(null,ss),min:Math.min.apply(null,ss),enCurso:i===_mesesK.length-1};}):[{mes:"—",dias:0,promedio:0,max:0,min:0,enCurso:true}];

  var _mesesDisp=mesesConDatos(_anG);
  var _mesActivo=(mesSel&&_mesesDisp.indexOf(mesSel)>=0)?mesSel:(_mesesDisp.length?_mesesDisp[_mesesDisp.length-1]:null);
  var _mesData=_mesActivo?mesCompletoDias(_anG,_mesActivo):{dias:[{dia:"—",score:0}],prom:0,conDatos:0,label:"—"};
  const mensualCol=scoreColor(scoreMensualActual);
  const cumple=scoreMensualActual>=objetivo;
  const pctObjetivo=Math.min(100,Math.round(scoreMensualActual/objetivo*100));

  return <div>
    <TabBar
      tabs={[{id:"mes",label:"📊 Este mes"},{id:"historial",label:"📂 Historial"}]}
      active={tab}
      onChange={t=>{setTab(t);setSelAudio(null);setSelDia(null);}}/>

    {/* ═══════════ SOLAPA: ESTE MES ═══════════ */}
    {tab==="mes"&&<div>

      {/* ── BANNER SCORE MENSUAL ── */}
      <div style={{background:cumple?`${C.green}0d`:`${C.warn}0d`,border:`2px solid ${cumple?C.green:C.warn}55`,borderRadius:16,padding:"18px 22px",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          {/* número grande */}
          <div style={{textAlign:"center",minWidth:100}}>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Score mensual</div>
            <div style={{fontSize:52,fontWeight:900,color:mensualCol,lineHeight:1}}>{scoreMensualActual}</div>
            <div style={{marginTop:6,display:"inline-block",background:scoreBg(scoreMensualActual),border:`1px solid ${scoreBorder(scoreMensualActual)}`,borderRadius:20,padding:"3px 14px",fontSize:13,fontWeight:700,color:mensualCol}}>
              {scoreLabel(scoreMensualActual)}
            </div>
          </div>

          <div style={{width:1,height:70,background:C.border,flexShrink:0}}/>

          {/* barra de progreso */}
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:6}}>
              Objetivo mensual: <strong style={{color:scoreColor(objetivo)}}>{objetivo} — {scoreLabel(objetivo)}</strong>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:cumple?C.green:C.warn,marginBottom:8}}>
              {cumple?"✅ Objetivo cumplido este mes":scoresDias.length+" días con evaluación"}
            </div>
            <div style={{height:10,background:C.border,borderRadius:6,overflow:"hidden",maxWidth:280,marginBottom:4}}>
              <div style={{height:"100%",width:`${pctObjetivo}%`,background:mensualCol,borderRadius:6,transition:"width .5s"}}/>
            </div>
            <div style={{fontSize:12,color:C.muted}}>{pctObjetivo}% del objetivo · {scoresDias.length} días evaluados</div>
          </div>

          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Stat label="Días evaluados" value={scoresDias.length} sub="este mes"  color={C.info}   icon="📅"/>
            <Stat label="Mejor día"  value={Math.max(...scoresDias.map(d=>d.score))} sub={scoreLabel(Math.max(...scoresDias.map(d=>d.score)))} color={C.light} icon="🏆"/>
            <Stat label="Peor día"   value={Math.min(...scoresDias.map(d=>d.score))} sub={scoreLabel(Math.min(...scoresDias.map(d=>d.score)))} color={C.danger} icon="⬇️"/>
          </div>
        </div>
      </div>

      {/* ── GRÁFICO DÍAS DEL MES (mes completo + selector de mes) ── */}
      <Card>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:600,color:C.muted}}>Score día a día — <strong style={{color:C.text}}>{_mesData.label}</strong> · promedio del mes <strong style={{color:scoreColor(_mesData.prom)}}>{_mesData.prom}</strong> <span style={{fontWeight:400}}>({_mesData.conDatos} días con análisis)</span></div>
          {_mesesDisp.length>0&&<select value={_mesActivo||""} onChange={e=>setMesSel(e.target.value)} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,color:C.text,fontSize:13,cursor:"pointer"}}>
            {_mesesDisp.slice().reverse().map(k=><option key={k} value={k}>{mesLabel(k)}</option>)}
          </select>}
        </div>
        <ScoreBarSVG data={_mesData.dias} objetivo={objetivo}/>
      </Card>

      {/* ── SEPARADOR "HOY" ── */}
      <div style={{display:"flex",alignItems:"center",gap:14,margin:"24px 0 18px"}}>
        <div style={{flex:1,height:2,background:`linear-gradient(to right,${C.green},${C.green}00)`}}/>
        <div style={{fontSize:20,fontWeight:900,color:C.green,letterSpacing:1,padding:"6px 22px",background:C.pale,border:`2px solid ${C.green}44`,borderRadius:30}}>
          Último día analizado — {scoresDias[scoresDias.length-1].dia}
        </div>
        <div style={{flex:1,height:2,background:`linear-gradient(to left,${C.green},${C.green}00)`}}/>
      </div>

      {/* ── SCORE HOY: gauge + stats ── */}
      <div style={{display:"grid",gridTemplateColumns:"140px 1fr",gap:14,marginBottom:18}}>
        <Card mb={0}><ScoreGauge score={scoreHoy} objetivo={objetivo}/></Card>
        <div style={{display:"flex",gap:10,flex:1,flexDirection:"column",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:10}}>
            <Stat label="Audios evaluados"  value={audiosHoy.length} color={C.green}  icon="🎧"/>
            <Stat label="Score máx."  value={Math.max(...audiosHoy.map(a=>a.score))} sub={scoreLabel(Math.max(...audiosHoy.map(a=>a.score)))} color={C.light}  icon="⬆️"/>
            <Stat label="Score mín."  value={Math.min(...audiosHoy.map(a=>a.score))} sub={scoreLabel(Math.min(...audiosHoy.map(a=>a.score)))} color={C.danger} icon="⬇️"/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Stat label="Excelentes ≥90"  value={audiosHoy.filter(a=>a.score>=90).length}  color={C.light}  icon="🌟"/>
            <Stat label="En riesgo <70"   value={audiosHoy.filter(a=>a.score<70).length}   color={C.danger} icon="⚠️"/>
            <Stat label="Aceptables 70-89" value={audiosHoy.filter(a=>a.score>=70&&a.score<90).length} color={C.warn} icon="✓"/>
          </div>
        </div>
      </div>

      {/* ── AUDIOS DEL DÍA ── */}
      <Card>
        <CardTitle>Audios del día — análisis por llamada</CardTitle>
        <AudiosPanel audios={audiosHoy} sel={selAudio} setSel={setSelAudio}/>
      </Card>

      {/* ── RECOMENDACIÓN IA ── */}
      <Card mb={0}>
        <CardTitle>💡 Recomendación diaria del Agente IA</CardTitle>
        <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{width:44,height:44,borderRadius:"50%",background:`${C.green}18`,border:`2px solid ${C.green}33`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:20}}>🤖</div>
          <div style={{flex:1,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"13px 16px",fontSize:13,color:C.text,lineHeight:1.8}}>{recHoy}</div>
        </div>
      </Card>
    </div>}

    {/* ═══════════ SOLAPA: HISTORIAL ═══════════ */}
    {tab==="historial"&&<div>
      <div style={{display:"flex",gap:8,marginBottom:18,borderBottom:`1px solid ${C.border}`,paddingBottom:10}}>
        {[{id:"diario",label:"📅 Scores diarios"},{id:"mensual",label:"📆 Promedios mensuales"}].map(t=>(
          <button key={t.id} onClick={()=>{setHistTab(t.id);setSelDia(null);}}
            style={{padding:"7px 16px",borderRadius:20,border:`1px solid ${C.border}`,
              background:histTab===t.id?C.green:C.white,color:histTab===t.id?C.white:C.text,
              cursor:"pointer",fontSize:13,fontWeight:histTab===t.id?600:400}}>{t.label}
          </button>
        ))}
      </div>

      {/* SCORES DIARIOS */}
      {histTab==="diario"&&<div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
          {historial.map(h=><button key={h.dia}
            onClick={()=>{setSelDia(selDia===h.dia?null:h.dia);setSelHA(null);}}
            style={{padding:"6px 14px",borderRadius:20,border:`1px solid ${C.border}`,
              background:selDia===h.dia?C.green:C.white,color:selDia===h.dia?C.white:C.text,
              cursor:"pointer",fontSize:12,fontWeight:selDia===h.dia?600:400}}>
            {h.dia} <span style={{opacity:.7}}>· {h.score}</span>
          </button>)}
        </div>
        {!selDia&&<Card mb={0}><CardTitle>Scores diarios — historial</CardTitle>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
              {["Fecha","Audios","Score","Categoría","Recomendación"].map(h=>
                <th key={h} style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>{h}</th>)}
            </tr></thead>
            <tbody>{historial.map((h,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${C.border}`,cursor:"pointer"}} onClick={()=>setSelDia(h.dia)}>
                <td style={{padding:"10px",fontWeight:600,color:C.text}}>{h.dia}</td>
                <td style={{padding:"10px",color:C.muted}}>{h.audios}</td>
                <td style={{padding:"10px",fontWeight:800,color:scoreColor(h.score),fontSize:18}}>{h.score}</td>
                <td style={{padding:"10px"}}><span style={{background:scoreBg(h.score),border:`1px solid ${scoreBorder(h.score)}`,color:scoreColor(h.score),borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600}}>{scoreLabel(h.score)}</span></td>
                <td style={{padding:"10px",color:C.muted,maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.rec.slice(0,60)}…</td>
              </tr>
            ))}</tbody>
          </table>
        </Card>}
        {selDia&&(()=>{const d=historial.find(h=>h.dia===selDia);if(!d)return null;
          return <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontSize:15,fontWeight:700,color:C.text}}>{d.dia}</div>
              <button onClick={()=>setSelDia(null)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${C.border}`,background:C.white,color:C.muted,cursor:"pointer",fontSize:12}}>← Volver</button>
            </div>
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <Stat label="Score del día" value={d.score} sub={scoreLabel(d.score)} color={scoreColor(d.score)} icon="🎯"/>
              <Stat label="Audios" value={d.audios} color={C.green} icon="🎧"/>
              <Stat label="Score máx." value={Math.max(...d.detalle.map(a=>a.score))} color={C.light} icon="⬆️"/>
              <Stat label="Score mín." value={Math.min(...d.detalle.map(a=>a.score))} color={C.danger} icon="⬇️"/>
            </div>
            <Card><AudiosPanel audios={d.detalle} sel={selHA} setSel={setSelHA}/></Card>
            <Card mb={0}><CardTitle>💡 Recomendación — {d.dia}</CardTitle>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{width:42,height:42,borderRadius:"50%",background:`${C.green}18`,border:`2px solid ${C.green}33`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:18}}>🤖</div>
                <div style={{flex:1,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"12px 14px",fontSize:13,color:C.text,lineHeight:1.8}}>{d.rec}</div>
              </div>
            </Card>
          </div>;
        })()}
      </div>}

      {/* PROMEDIOS MENSUALES */}
      {histTab==="mensual"&&<div>
        <div style={{display:"flex",gap:10,marginBottom:20}}>
          <Stat label="Score mensual actual" value={scoreMensualActual} sub={scoreLabel(scoreMensualActual)} color={scoreColor(scoreMensualActual)} icon="📆"/>
          <Stat label="Mejor mes" value={Math.max(...scoresMensuales.map(m=>m.promedio||0))} sub={(scoresMensuales.slice().sort((a,b)=>(b.promedio||0)-(a.promedio||0))[0]||{}).mes||"—"} color={C.light} icon="🏆"/>
          <Stat label="Promedio anual" value={Math.round(scoresMensuales.reduce((a,m)=>a+(m.promedio||0),0)/scoresMensuales.length)} sub="2025" color={C.info} icon="📊"/>
        </div>
        <Card>
          <CardTitle>Score promedio mensual — 2025</CardTitle>
          <ScoreBarSVG data={scoresMensuales.map(m=>({dia:m.mes.split(" ")[0].slice(0,3),score:m.promedio||0}))} objetivo={objetivo}/>
        </Card>
        <Card mb={0}>

          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
              {["Mes","Días eval.","Score prom.","Categoría","Máx.","Mín."].map(h=>
                <th key={h} style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:600}}>{h}</th>)}
            </tr></thead>
            <tbody>{scoresMensuales.map((m,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:m.enCurso?C.pale:C.white}}>
                <td style={{padding:"10px",fontWeight:600,color:C.text}}>
                  {m.mes}
                  {m.enCurso&&<span style={{marginLeft:8,fontSize:11,background:`${C.green}22`,color:C.green,border:`1px solid ${C.paleB}`,borderRadius:20,padding:"1px 8px"}}>En curso</span>}
                </td>
                <td style={{padding:"10px",color:C.muted}}>{m.dias}</td>
                <td style={{padding:"10px",fontWeight:800,color:scoreColor(m.promedio),fontSize:18}}>{m.promedio}</td>
                <td style={{padding:"10px"}}><span style={{background:scoreBg(m.promedio),border:`1px solid ${scoreBorder(m.promedio)}`,color:scoreColor(m.promedio),borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600}}>{scoreLabel(m.promedio)}</span></td>
                <td style={{padding:"10px",color:C.light,fontWeight:600}}>{m.max}</td>
                <td style={{padding:"10px",color:C.danger,fontWeight:600}}>{m.min}</td>
              </tr>
            ))}</tbody>
          </table>
        </Card>
      </div>}
    </div>}
  </div>;
}

        <Stat label="Marcadas" value={loading?"...":totMarcadas} sub="total del mes" color={C.text} icon="📞"/>

        <Stat label="Tasa contactación" value={loading?"...":tasa+"%"} color={tasa>=65?C.green:C.warn} icon="📈"/>
        <Stat label="Días trabajados" value={loading?"...":(prodData?prodData.length:0)} color={C.info} icon="📅"/>
      </div>
      {loading&&<div style={{textAlign:"center",padding:"30px",color:C.info,fontSize:13}}>⏳ Cargando datos de Neotel...</div>}
      {!loading&&prodData&&prodData.length>0&&<Card>

        <BarChart id="pb1" data={prodData.map(function(d){return {dia:d.dia?d.dia.slice(5):"",total:parseInt(d.marcadas)||0,conectadas:parseInt(d.conectadas)||0};})} keys={["total","conectadas"]} names={["Marcadas","Conectadas"]} colors={[C.paleB,C.green]}/>
      </Card>}
      {!loading&&prodData&&prodData.length>0&&<Card mb={0}>
        <CardTitle>Tasa de contactación (%)</CardTitle>
        <BarChart id="pb2" data={prodData.map(function(d){var marc=parseInt(d.marcadas)||0,con=parseInt(d.conectadas)||0;return {dia:d.dia?d.dia.slice(5):"",tasa:marc>0?Math.round(con/marc*100):0};})} keys={["tasa"]} names={["Tasa %"]} colors={[C.green]} h={150} yFmt={v=>`${v}%`}/>
      </Card>}
      {!loading&&prodData&&prodData.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.muted,fontSize:13}}>Sin datos para este período.</div>}
    </div>}
  </div>;
}
function VRecuperoGestor({user}){

    {rows.length>0&&<>
      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        <Stat label="Recupero acum." value={fmtARS(tot)} sub={mes} icon="💰"/>
        <Stat label="Objetivo acum." value={fmtARS(obj)} sub={rows.length+" días"} color={C.muted} icon="🎯"/>
        <Stat label="Alcance objetivo" value={`${pct(tot,obj)}%`} color={pct(tot,obj)>=100?C.light:C.warn} icon="📈"/>
        <Stat label="Promesas de pago" value={totP} color={C.info} icon="🤝"/>
      </div>
      <Card><CardTitle>Recupero vs. Objetivo (${objetivoDiario}k/día)</CardTitle><AreaChart id="rg1" data={serie} kVal="recupero" kObj="objetivo" nVal="Recupero" nObj="Objetivo" yFmt={v=>`$${v}k`}/></Card>
      <Card mb={0}><CardTitle>Promesas de pago por día</CardTitle><BarChart id="rg2" data={serie} keys={["promesas"]} names={["Promesas"]} colors={[C.light]} h={150}/></Card>
    </>}
  </div>;

        {m.url&&<a href={m.url} target="_blank" rel="noopener" style={{padding:"6px 14px",border:`1px solid ${C.green}`,borderRadius:8,background:`${C.green}10`,color:C.green,textDecoration:"none",fontSize:13,fontWeight:600}}>Abrir</a>}

function VMisEvaluaciones({user}){
  const [evals,setEvals]=useState(null);
  const [config,setConfig]=useState(evalConfigInit);
  const [misRes,setMisRes]=useState([]);
  const [taking,setTaking]=useState(null);     // evaluación que se está rindiendo
  const [answers,setAnswers]=useState({});      // qi -> opción elegida
  const [final,setFinal]=useState(null);        // resultado recién enviado (pantalla de cierre)
  const [enviando,setEnviando]=useState(false);

  const cargar=function(){
    if(!window.db){setEvals([]);return;}
    window.db.collection("evaluaciones").get()
      .then(function(snap){var uid=String(user&&user.uid||"");setEvals(snap.docs.map(function(d){return d.data();}).filter(function(e){
        if((e.preguntas||[]).length===0) return false;
        if(e.gestores&&e.gestores.length) return e.gestores.map(String).indexOf(uid)>=0;   // asignada a este operador
        return !e.cartera||e.cartera==="General"||e.cartera===(user&&user.cliente);        // compat: evals viejas por cartera
      }));})
      .catch(function(e){console.error("[DASA] evals gestor:",e);setEvals([]);});
    window.db.collection("configuracion").doc("evaluaciones").get()
      .then(function(doc){if(doc.exists)setConfig(Object.assign({},evalConfigInit,doc.data()));}).catch(function(){});
    if(user&&user.uid) window.db.collection("resultados_evaluaciones").where("gestorId","==",user.uid).get()
      .then(function(snap){setMisRes(snap.docs.map(function(d){return d.data();}));}).catch(function(){});
  };
  useEffect(cargar,[user]);

  const maxIntentos=config.reintentos>=99?Infinity:(1+(parseInt(config.reintentos)||0));
  const resDe=function(evId){return misRes.filter(function(r){return String(r.evalId)===String(evId);});};
  const mejorDe=function(evId){var rs=resDe(evId);if(!rs.length)return null;return rs.reduce(function(a,b){return b.nota>a.nota?b:a;});};

  const enviar=async function(){
    if(!taking)return;
    var qs=taking.preguntas||[];
    var correctas=qs.reduce(function(a,q,qi){return a+(answers[qi]===q.correcta?1:0);},0);
    var nota=Math.round((correctas/qs.length)*100)/10;     // 0-10 con 1 decimal
    var notaMin=(typeof taking.notaMinima==="number"?taking.notaMinima:config.notaMinima)||7;
    var estado=nota>=notaMin?"aprobado":"reprobado";
    var intento=resDe(taking.id).length+1;
    var fecha=new Date().toISOString().slice(0,10);
    var doc={id:String(taking.id)+"__"+user.uid+"__"+intento,evalId:taking.id,evalTitulo:taking.titulo,
      gestorId:user.uid,gestorNombre:user.name,gestorLegajo:user.legajo||"",fecha:fecha,
      nota:nota,correctas:correctas,total:qs.length,estado:estado,intento:intento};
    setEnviando(true);
    if(window.db){try{await window.db.collection("resultados_evaluaciones").doc(doc.id).set(doc);}catch(e){console.error("[DASA] guardar resultado:",e);}}
    setEnviando(false);
    setMisRes(function(p){return p.concat([doc]);});
    setFinal({doc:doc,eval:taking,notaMin:notaMin});
    setTaking(null);setAnswers({});
  };

  // ── Pantalla: rindiendo ────────────────────────────────────────────────────
  if(taking){
    var qs=taking.preguntas||[];
    var respondidas=qs.filter(function(_,qi){return answers[qi]!==undefined;}).length;
    return <div>
      <SecTitle icon="📝">{taking.titulo}</SecTitle>
      <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px"}}>
        {qs.length} preguntas · respondé todas y enviá. Aprobás con {(typeof taking.notaMinima==="number"?taking.notaMinima:config.notaMinima)} o más (sobre 10).
      </div>
      {qs.map(function(q,qi){
        return <Card key={qi}>
          <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:12}}>{qi+1}. {q.preg}</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {q.opciones.map(function(op,oi){
              var sel=answers[qi]===oi;
              return <label key={oi} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`1.5px solid ${sel?C.green:C.border}`,background:sel?C.pale:C.white,cursor:"pointer"}}>
                <input type="radio" name={"q"+qi} checked={sel} onChange={function(){setAnswers(function(p){var n=Object.assign({},p);n[qi]=oi;return n;});}} style={{accentColor:C.green,width:16,height:16}}/>
                <span style={{fontSize:13,color:C.text}}>{op}</span>
              </label>;
            })}
          </div>
        </Card>;
      })}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",bottom:0,background:C.bg,padding:"12px 0"}}>
        <button onClick={function(){setTaking(null);setAnswers({});}} style={{padding:"9px 18px",background:C.white,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:12,color:respondidas===qs.length?C.green:C.muted,fontWeight:600}}>{respondidas}/{qs.length} respondidas</span>
          <button onClick={enviar} disabled={respondidas<qs.length||enviando}
            style={{padding:"10px 24px",background:(respondidas<qs.length||enviando)?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:(respondidas<qs.length||enviando)?"not-allowed":"pointer",fontSize:14,fontWeight:700}}>{enviando?"Enviando…":"Enviar evaluación"}</button>
        </div>
      </div>
    </div>;
  }

  // ── Pantalla: resultado recién enviado ─────────────────────────────────────
  if(final){
    var ap=final.doc.estado==="aprobado";
    return <div>
      <SecTitle icon="📝">Resultado</SecTitle>
      <div style={{background:ap?`${C.green}0d`:`${C.danger}0d`,border:`2px solid ${ap?C.green:C.danger}55`,borderRadius:16,padding:"28px 24px",textAlign:"center",marginBottom:18}}>
        <div style={{fontSize:46,marginBottom:8}}>{ap?"✅":"❌"}</div>
        <div style={{fontSize:22,fontWeight:900,color:ap?C.green:C.danger,marginBottom:4}}>{ap?"Aprobado":"Reprobado"}</div>
        <div style={{fontSize:15,color:C.text,marginBottom:2}}>{final.eval.titulo}</div>
        <div style={{fontSize:40,fontWeight:900,color:ap?C.green:C.danger,margin:"10px 0"}}>{final.doc.nota}<span style={{fontSize:18,color:C.muted}}> / 10</span></div>
        <div style={{fontSize:13,color:C.muted}}>{final.doc.correctas} de {final.doc.total} correctas · nota mínima {final.notaMin} · intento #{final.doc.intento}</div>
        {!ap&&<div style={{fontSize:13,color:C.danger,marginTop:8}}>{resDe(final.eval.id).length<maxIntentos?"Podés volver a intentarlo.":"Sin más intentos disponibles. Hablá con tu supervisor."}</div>}
      </div>
      {config.mostrarRespuestas&&<Card mb={0}><CardTitle>Respuestas correctas</CardTitle>
        {(final.eval.preguntas||[]).map(function(q,qi){return <div key={qi} style={{marginBottom:10,padding:"10px 14px",background:C.bg,borderRadius:8}}>
          <div style={{fontSize:13,fontWeight:600,color:C.text,marginBottom:4}}>{qi+1}. {q.preg}</div>
          <div style={{fontSize:13,color:C.green}}>✓ {q.opciones[q.correcta]}</div>
        </div>;})}
      </Card>}
      <div style={{marginTop:16}}><button onClick={function(){setFinal(null);}} style={{padding:"10px 22px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700}}>← Volver a mis evaluaciones</button></div>
    </div>;
  }

  // ── Pantalla: lista de evaluaciones ────────────────────────────────────────
  return <div>
    <SecTitle icon="📝">Mis evaluaciones</SecTitle>
    {evals===null&&<div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div>}
    {evals!==null&&evals.length===0&&<div style={{background:C.bg,border:`1px dashed ${C.border}`,borderRadius:12,padding:36,textAlign:"center",color:C.muted,fontSize:14}}>Todavía no hay evaluaciones disponibles. Cuando tu supervisor publique una, va a aparecer acá.</div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {(evals||[]).map(function(ev){
        var rs=resDe(ev.id);var mejor=mejorDe(ev.id);
        var aprobado=rs.some(function(r){return r.estado==="aprobado";});
        var intentosUsados=rs.length;
        var puede=!aprobado&&intentosUsados<maxIntentos;
        var notaMin=(typeof ev.notaMinima==="number"?ev.notaMinima:config.notaMinima);
        return <div key={ev.id} style={{background:C.white,border:`1px solid ${aprobado?C.green:C.border}`,borderRadius:12,padding:"16px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:4}}>{ev.titulo}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:12,padding:"1px 8px",borderRadius:20,background:`${C.info}15`,color:C.info,fontWeight:500}}>{ev.cartera||"General"}</span>
                <span style={{fontSize:12,color:C.muted}}>{(ev.preguntas||[]).length} preguntas · nota mín {notaMin}</span>
                {mejor&&<span style={{fontSize:12,color:C.muted}}>· tu mejor nota: <strong style={{color:scoreColor(mejor.nota*10)}}>{mejor.nota}</strong></span>}
                <span style={{fontSize:12,color:C.muted}}>· intentos: {intentosUsados}{maxIntentos===Infinity?"":"/"+maxIntentos}</span>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {aprobado&&<span style={{fontSize:13,fontWeight:700,color:C.green}}>✓ Aprobada</span>}
              {!aprobado&&intentosUsados>0&&<span style={{fontSize:13,fontWeight:700,color:C.danger}}>✗ Reprobada</span>}
              {puede&&<button onClick={function(){setTaking(ev);setAnswers({});}}
                style={{padding:"9px 20px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
                {intentosUsados>0?"Reintentar":"Rendir"}
              </button>}
              {!puede&&!aprobado&&<span style={{fontSize:12,color:C.muted}}>Sin más intentos</span>}
            </div>
          </div>
        </div>;
      })}
    </div>
  </div>;
}
function VLogueos({user}){
  const [fecha,setFecha]=useState(new Date().toISOString().slice(0,10));
  const [logins,setLogins]=useState(null);
  const [loading,setLoading]=useState(false);
  const cargar=function(f){
    var fch=f||fecha;
    if(!user||!user.neotelId){setLogins([]);return;}
    setLoading(true);
    fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"logins",fecha:fch})})
      .then(function(r){return r.json();})
      .then(function(d){setLogins((d.logins||[]).filter(function(l){return String(l.usuario)===String(user.neotelId);}));setLoading(false);})
      .catch(function(){setLogins([]);setLoading(false);});
  };

// ── Importador de Excel/CSV de recupero (un archivo → recupero por operador) ──
function ImportarRecuperoModal({gestores,onClose,onImported}){
  const [fileName,setFileName]=useState("");
  const [headers,setHeaders]=useState([]);
  const [rows,setRows]=useState([]);
  const [error,setError]=useState("");
  const [map,setMap]=useState({operador:"",fecha:"",recupero:"",promesas:"",objetivo:""});
  const [unidad,setUnidad]=useState("pesos");
  const [fechaUnica,setFechaUnica]=useState(new Date().toISOString().slice(0,10));
  const [asign,setAsign]=useState({});   // operadorValue -> gestorId | "__ignore__"
  const [importando,setImportando]=useState(false);

  const norm=function(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();};
  const guess=function(hdrs,keys){return hdrs.find(function(h){var n=norm(h);return keys.some(function(k){return n.indexOf(k)>=0;});})||"";};
  const parseNum=function(v){
    if(typeof v==="number")return v;
    var s=String(v==null?"":v).replace(/[^0-9.,-]/g,"");
    if(s.indexOf(",")>=0&&s.indexOf(".")>=0)s=s.replace(/\./g,"").replace(",",".");
    else if(s.indexOf(",")>=0)s=s.replace(",",".");
    var n=parseFloat(s);return isNaN(n)?0:n;
  };
  const parseFecha=function(v){
    if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
    if(typeof v==="number"){var d=new Date(Math.round((v-25569)*86400000));return isNaN(d)?"":d.toISOString().slice(0,10);}
    var s=String(v||"").trim();if(!s)return "";
    var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){var yy=m[3].length===2?"20"+m[3]:m[3];return yy+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");}
    var m2=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if(m2)return m2[1]+"-"+String(m2[2]).padStart(2,"0")+"-"+String(m2[3]).padStart(2,"0");
    return "";
  };

  const onFile=function(file){
    if(!file)return;
    if(!window.XLSX){setError("No se pudo cargar el lector de Excel (revisá la conexión).");return;}
    setError("");
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=window.XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var arr=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});
        var hi=arr.findIndex(function(r){return r.filter(function(c){return c!==""&&c!=null;}).length>=2;});
        if(hi<0){setError("No encontré una fila de encabezados en el archivo.");return;}
        var hdrs=arr[hi].map(function(c){return String(c).trim();}).filter(function(h){return h!=="";});
        var data=arr.slice(hi+1).filter(function(r){return r.some(function(c){return c!==""&&c!=null;});})
          .map(function(r){var o={};hdrs.forEach(function(h,i){o[h]=r[i];});return o;});
        setHeaders(hdrs);setRows(data);setFileName(file.name);setAsign({});
        setMap({operador:guess(hdrs,["operador","gestor","agente","asesor","usuario","nombre","legajo"]),
                fecha:guess(hdrs,["fecha","mes","dia","día","period"]),
                recupero:guess(hdrs,["recupero","recuperado","monto","importe","cobrado","gestionado","recaudado"]),
                promesas:guess(hdrs,["ppu","promesa","compromiso","ppp"]),
                objetivo:guess(hdrs,["objetivo","meta","target"])});
      }catch(e){setError("Error leyendo el Excel: "+(e&&e.message||e));}
    };
    reader.readAsArrayBuffer(file);
  };

  const esTotal=function(v){return /^\s*total/i.test(String(v||""));};
  const tok=function(s){return norm(s).replace(/,/g," ").split(" ").filter(Boolean);};
  const operadores=Array.from(new Set(rows.map(function(r){return String(r[map.operador]==null?"":r[map.operador]).trim();}).filter(Boolean))).filter(function(op){return !esTotal(op);});
  const matchGestor=function(opVal){
    if(asign[opVal]==="__ignore__")return null;
    if(asign[opVal])return gestores.find(function(g){return g.id===asign[opVal];})||null;
    if(esTotal(opVal))return null;
    var ot=tok(opVal);if(!ot.length)return null;
    var oset=ot.slice().sort().join(" ");
    // 1) mismo conjunto de palabras (maneja "Apellido, Nombre" vs "Nombre Apellido")
    var byTok=gestores.find(function(g){return tok(g.name).slice().sort().join(" ")===oset;});
    if(byTok)return byTok;
    // 2) legajo exacto
    var byLeg=gestores.find(function(g){return g.legajo&&norm(String(g.legajo))===norm(opVal);});
    if(byLeg)return byLeg;
    // 3) todas las palabras del gestor están en el operador (o viceversa)
    return gestores.find(function(g){var gt=tok(g.name);return gt.length>=2&&gt.every(function(t){return ot.indexOf(t)>=0;});})
      ||gestores.find(function(g){var gt=tok(g.name);return ot.length>=2&&ot.every(function(t){return gt.indexOf(t)>=0;});})
      ||null;
  };
  const construir=function(){
    var agg={},sinFecha=0;
    rows.forEach(function(r){
      var opVal=String(r[map.operador]==null?"":r[map.operador]).trim();if(!opVal||esTotal(opVal))return;
      var g=matchGestor(opVal);if(!g)return;
      var fecha=map.fecha?parseFecha(r[map.fecha]):fechaUnica;
      if(!fecha){sinFecha++;return;}
      var rec=parseNum(r[map.recupero]);if(unidad==="pesos")rec=Math.round(rec/1000);
      var prom=map.promesas?Math.round(parseNum(r[map.promesas])):0;
      var obj=map.objetivo?parseNum(r[map.objetivo]):null;if(obj!=null&&unidad==="pesos")obj=Math.round(obj/1000);
      var key=g.id+"__"+fecha;
      if(!agg[key])agg[key]={id:g.id+"__"+fecha,gestorId:g.id,gestorNombre:g.name,neotelId:g.neotelId||"",fecha:fecha,recupero:0,promesas:0,objetivo:0,_tieneObj:false};
      agg[key].recupero+=rec;agg[key].promesas+=prom;
      if(obj!=null){agg[key].objetivo+=obj;agg[key]._tieneObj=true;}
    });
    var sinMatch=operadores.filter(function(op){return !matchGestor(op);}).length;
    var registros=Object.keys(agg).map(function(k){var a=agg[k];var o={id:a.id,gestorId:a.gestorId,gestorNombre:a.gestorNombre,neotelId:a.neotelId,fecha:a.fecha,recupero:a.recupero,promesas:a.promesas};if(a._tieneObj)o.objetivo=a.objetivo;return o;});
    return {registros:registros,sinMatch:sinMatch,sinFecha:sinFecha};
  };
  const res=rows.length&&map.operador&&map.recupero?construir():{registros:[],sinMatch:0,sinFecha:0};
  const listo=res.registros.length>0&&(map.fecha||fechaUnica);

  const importar=async function(){
    setImportando(true);setError("");
    var r=await onImported(res.registros);
    setImportando(false);
    if(r&&r.fail>0){
      setError("Se guardaron "+r.ok+" y fallaron "+r.fail+". "+(/permission/i.test(r.error||"")
        ?"Firebase rechazó el guardado por PERMISOS: hay que habilitar la colección “recupero” en las Reglas de Firestore (ver firestore-REGLAS.txt)."
        :(r.error||"")));
    }
  };

  const selStyle={padding:"7px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,background:C.white};
  const opt=function(h){return <option key={h} value={h}>{h}</option>;};

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:C.white,borderRadius:16,padding:24,width:680,maxWidth:"95vw",maxHeight:"92vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text}}>📤 Importar recupero desde Excel</div>
        <button onClick={onClose} style={{border:"none",background:"transparent",fontSize:20,cursor:"pointer",color:C.muted}}>×</button>
      </div>
      <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Subí el Excel (.xlsx/.xls/.csv) con el recupero ya calculado. Confirmá las columnas y se registra el recupero por operador.</div>

      <label style={{display:"inline-block",padding:"9px 16px",background:C.green,color:"#fff",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,marginBottom:14}}>
        {fileName?"📄 "+fileName:"Elegir archivo…"}
        <input type="file" accept=".xlsx,.xls,.csv" onChange={function(e){onFile(e.target.files[0]);}} style={{display:"none"}}/>
      </label>

      {error&&<div style={{background:"#fce8e8",border:`1px solid ${C.danger}44`,borderRadius:8,padding:"9px 12px",fontSize:13,color:C.danger,marginBottom:12}}>{error}</div>}

      {rows.length>0&&<>
        <div style={{fontSize:12,color:C.muted,marginBottom:10}}>{rows.length} filas leídas. Columnas detectadas: {headers.length}.</div>

        {/* MAPEO */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 14px",marginBottom:14}}>
          <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Operador <span style={{color:C.danger}}>*</span></label>
            <select value={map.operador} onChange={e=>setMap(Object.assign({},map,{operador:e.target.value}))} style={Object.assign({width:"100%"},selStyle)}><option value="">—</option>{headers.map(opt)}</select></div>
          <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Recupero <span style={{color:C.danger}}>*</span></label>
            <select value={map.recupero} onChange={e=>setMap(Object.assign({},map,{recupero:e.target.value}))} style={Object.assign({width:"100%"},selStyle)}><option value="">—</option>{headers.map(opt)}</select></div>
          <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Fecha <span style={{color:C.muted,fontWeight:400}}>(opcional)</span></label>
            <select value={map.fecha} onChange={e=>setMap(Object.assign({},map,{fecha:e.target.value}))} style={Object.assign({width:"100%"},selStyle)}><option value="">Sin columna → fecha única</option>{headers.map(opt)}</select></div>
          <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Promesas <span style={{color:C.muted,fontWeight:400}}>(opcional)</span></label>
            <select value={map.promesas} onChange={e=>setMap(Object.assign({},map,{promesas:e.target.value}))} style={Object.assign({width:"100%"},selStyle)}><option value="">—</option>{headers.map(opt)}</select></div>
          <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Objetivo <span style={{color:C.muted,fontWeight:400}}>(opcional)</span></label>
            <select value={map.objetivo} onChange={e=>setMap(Object.assign({},map,{objetivo:e.target.value}))} style={Object.assign({width:"100%"},selStyle)}><option value="">—</option>{headers.map(opt)}</select></div>
        </div>
        <div style={{display:"flex",gap:18,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}>
            <span style={{color:C.muted}}>El monto está en:</span>
            <label style={{cursor:"pointer"}}><input type="radio" checked={unidad==="pesos"} onChange={()=>setUnidad("pesos")} style={{accentColor:C.green}}/> Pesos ($)</label>
            <label style={{cursor:"pointer"}}><input type="radio" checked={unidad==="miles"} onChange={()=>setUnidad("miles")} style={{accentColor:C.green}}/> Miles (k)</label>
          </div>
          {!map.fecha&&<div style={{display:"flex",alignItems:"center",gap:6,fontSize:13}}>
            <span style={{color:C.muted}}>Fecha para todo el archivo:</span>
            <input type="date" value={fechaUnica} onChange={e=>setFechaUnica(e.target.value)} style={selStyle}/>
          </div>}
        </div>

        {/* MATCH OPERADORES */}
        {map.operador&&<div style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:8}}>Operadores → gestores ({operadores.length})</div>
          <div style={{maxHeight:180,overflowY:"auto",border:`1px solid ${C.border}`,borderRadius:8}}>
            {operadores.map(function(op){
              var g=matchGestor(op);
              return <div key={op} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"7px 12px",borderBottom:`1px solid ${C.border}`,fontSize:13,background:g?C.white:`${C.warn}10`}}>
                <span style={{color:C.text}}>{op}</span>
                <select value={asign[op]!==undefined?asign[op]:(g?g.id:"")} onChange={function(e){setAsign(Object.assign({},asign,{[op]:e.target.value}));}}
                  style={Object.assign({maxWidth:240},selStyle,{borderColor:g?C.border:C.warn})}>
                  <option value="">{g?"(auto) "+g.name:"⚠️ sin asignar"}</option>
                  {gestores.map(function(x){return <option key={x.id} value={x.id}>{x.name}</option>;})}
                  <option value="__ignore__">Ignorar este operador</option>
                </select>
              </div>;
            })}
          </div>
        </div>}

        {/* RESUMEN */}
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
          <div style={{flex:1,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:8,padding:"8px 12px",fontSize:13}}><strong style={{color:C.green,fontSize:18}}>{res.registros.length}</strong><div style={{color:C.muted,fontSize:12}}>registros a importar</div></div>
          {res.sinMatch>0&&<div style={{flex:1,background:`${C.warn}10`,border:`1px solid ${C.warn}44`,borderRadius:8,padding:"8px 12px",fontSize:13}}><strong style={{color:C.warn,fontSize:18}}>{res.sinMatch}</strong><div style={{color:C.muted,fontSize:12}}>operadores sin asignar (se omiten)</div></div>}
          {res.sinFecha>0&&<div style={{flex:1,background:`${C.danger}10`,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"8px 12px",fontSize:13}}><strong style={{color:C.danger,fontSize:18}}>{res.sinFecha}</strong><div style={{color:C.muted,fontSize:12}}>filas con fecha inválida</div></div>}
        </div>

        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{padding:"9px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button onClick={importar} disabled={!listo||importando}
            style={{padding:"9px 22px",background:(!listo||importando)?C.muted:C.green,color:"#fff",border:"none",borderRadius:8,cursor:(!listo||importando)?"not-allowed":"pointer",fontSize:13,fontWeight:700}}>
            {importando?"Importando…":"Importar "+res.registros.length+" registros"}
          </button>
        </div>
      </>}
    </div>
  </div>;
}

function SVRecupero(){
  const [mes,setMes]=useState(new Date().toISOString().slice(0,7));
  const [gestores,setGestores]=useState([]);
  const [docs,setDocs]=useState(null);
  const [objetivoDiario,setObjetivoDiario]=useState(500);
  const [selG,setSelG]=useState(null);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({gestorId:"",fecha:new Date().toISOString().slice(0,10),recupero:"",promesas:""});
  const [guardando,setGuardando]=useState(false);
  const [editObj,setEditObj]=useState(false);
  const [tmpObj,setTmpObj]=useState("500");
  const [showImport,setShowImport]=useState(false);
  const [carteraR,setCarteraR]=useState("Todas");

  useEffect(function(){
    if(!window.db){setDocs([]);return;}
    window.db.collection("usuarios").get()
      .then(function(snap){setGestores(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(u){return (u.role||"gestor")==="gestor";}).map(function(u){return {id:u.id,name:u.name||u.user||"—",neotelId:u.neotelId||"",legajo:u.legajo||"",cliente:u.cliente||""};}));})
      .catch(function(){});
    window.db.collection("recupero").get()
      .then(function(snap){setDocs(snap.docs.map(function(d){return d.data();}));})
      .catch(function(e){console.error("[DASA] recupero:",e);setDocs([]);});
    window.db.collection("configuracion").doc("recupero").get()
      .then(function(d){if(d.exists&&typeof d.data().objetivoDiario==="number"){setObjetivoDiario(d.data().objetivoDiario);setTmpObj(String(d.data().objetivoDiario));}}).catch(function(){});
  },[]);

  var cartsR=Array.from(new Set(gestores.map(function(g){return g.cliente;}).filter(Boolean))).sort().concat(["Todas"]);
  var _gestoresCart=carteraR==="Todas"?gestores:gestores.filter(function(g){return g.cliente===carteraR;});
  var _cartIds={}; _gestoresCart.forEach(function(g){_cartIds[g.id]=1;});
  const delMes=(docs||[]).filter(function(r){return (r.fecha||"").slice(0,7)===mes && (carteraR==="Todas"||_cartIds[r.gestorId]);});
  const totGestor=function(gid){return delMes.filter(function(r){return String(r.gestorId)===String(gid);}).reduce(function(a,r){return a+(r.recupero||0);},0);};
  const promGestor=function(gid){return delMes.filter(function(r){return String(r.gestorId)===String(gid);}).reduce(function(a,r){return a+(r.promesas||0);},0);};
  const diasGestor=function(gid){return delMes.filter(function(r){return String(r.gestorId)===String(gid);}).length;};
  const objDe=function(r){return typeof r.objetivo==="number"?r.objetivo:objetivoDiario;};
  const objGestor=function(gid){return delMes.filter(function(r){return String(r.gestorId)===String(gid);}).reduce(function(a,r){return a+objDe(r);},0);};
  const serieDe=function(filtroGid){
    var by={};
    delMes.forEach(function(r){
      if(filtroGid&&String(r.gestorId)!==String(filtroGid))return;
      var f=r.fecha||"";if(!f)return;
      if(!by[f])by[f]={recupero:0,promesas:0,objetivo:0};
      by[f].recupero+=(r.recupero||0);by[f].promesas+=(r.promesas||0);by[f].objetivo+=objDe(r);
    });
    return Object.keys(by).sort().map(function(f){
      return {dia:f.slice(8),recupero:by[f].recupero,promesas:by[f].promesas,objetivo:by[f].objetivo};
    });
  };
  const serie=serieDe(selG?selG.id:null);
  const totEquipo=delMes.reduce(function(a,r){return a+(r.recupero||0);},0);
  const objEquipo=serie.reduce(function(a,d){return a+d.objetivo;},0);
  const ranking=_gestoresCart.map(function(g){return {g:g,tot:totGestor(g.id)};}).sort(function(a,b){return b.tot-a.tot;});
  const mejor=ranking[0];
  const objMostrar=selG?objGestor(selG.id):objEquipo;
  const totMostrar=selG?totGestor(selG.id):totEquipo;

  const guardar=async function(){
    if(!form.gestorId||form.recupero==="")return;
    var g=gestores.find(function(x){return x.id===form.gestorId;})||{};
    var doc={id:form.gestorId+"__"+form.fecha,gestorId:form.gestorId,gestorNombre:g.name||"",neotelId:g.neotelId||"",
      fecha:form.fecha,recupero:parseInt(form.recupero,10)||0,promesas:parseInt(form.promesas,10)||0};
    setGuardando(true);
    if(window.db){try{await window.db.collection("recupero").doc(doc.id).set(doc);}catch(e){console.error("[DASA] guardar recupero:",e);}}
    setGuardando(false);
    setDocs(function(p){var others=(p||[]).filter(function(r){return !(String(r.gestorId)===String(doc.gestorId)&&r.fecha===doc.fecha);});return others.concat([doc]);});
    setModal(false);setForm({gestorId:"",fecha:new Date().toISOString().slice(0,10),recupero:"",promesas:""});
  };
  const guardarObj=async function(){
    var v=parseInt(tmpObj,10);if(isNaN(v)||v<0){setEditObj(false);return;}
    setObjetivoDiario(v);setEditObj(false);
    if(window.db){try{await window.db.collection("configuracion").doc("recupero").set({objetivoDiario:v});}catch(e){console.error(e);}}
  };
  const importarRegistros=async function(registros){
    var oks=[],fail=0,lastErr="";
    if(window.db){
      for(var i=0;i<registros.length;i++){
        try{await window.db.collection("recupero").doc(registros[i].id).set(registros[i]);oks.push(registros[i]);}
        catch(e){fail++;lastErr=(e&&e.message)||String(e);console.error("[DASA] importar recupero:",e);}
      }
    }
    if(oks.length) setDocs(function(p){
      var byId={};(p||[]).forEach(function(r){byId[r.id||(r.gestorId+"__"+r.fecha)]=r;});
      oks.forEach(function(r){byId[r.id]=r;});
      return Object.keys(byId).map(function(k){return byId[k];});
    });
    if(fail===0) setShowImport(false);
    return {ok:oks.length,fail:fail,error:lastErr};
  };

  return <div>
    <SecTitle icon="💹">Recupero — Supervisión{carteraR!=="Todas"?" · "+carteraR:""}</SecTitle>
    {cartsR.length>1&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
      {cartsR.map(function(ct){var on=carteraR===ct;return <button key={ct} onClick={function(){setCarteraR(ct);setSelG(null);}} style={{padding:"7px 16px",borderRadius:20,border:`2px solid ${on?C.green:C.border}`,background:on?C.green:C.white,color:on?C.white:C.text,cursor:"pointer",fontSize:13,fontWeight:on?700:500}}>{ct==="Todas"?"🏦 Todas":ct}</button>;})}
    </div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted}}>Mes:</span>
        <CalMes value={mes} onChange={setMes} style={{padding:"5px 8px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
        <span style={{fontSize:12,color:C.muted,marginLeft:10}}>Objetivo diario/gestor:</span>
        {editObj
          ?<span style={{display:"flex",alignItems:"center",gap:4}}>$<input type="number" value={tmpObj} onChange={e=>setTmpObj(e.target.value)} style={{width:70,padding:"4px 6px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13}}/>k
             <button onClick={guardarObj} style={{padding:"3px 10px",background:C.green,color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:12}}>OK</button></span>
          :<span onClick={()=>{setTmpObj(String(objetivoDiario));setEditObj(true);}} style={{fontSize:13,fontWeight:700,color:C.green,cursor:"pointer"}}>${objetivoDiario}k ✎</span>}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setShowImport(true)} style={{padding:"8px 16px",background:C.white,color:C.green,border:`1.5px solid ${C.green}`,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>📤 Importar Excel</button>
        <button onClick={()=>setModal(true)} style={{padding:"8px 16px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>+ Cargar manual</button>
      </div>
    </div>

    {showImport&&<ImportarRecuperoModal gestores={gestores} onClose={()=>setShowImport(false)} onImported={importarRegistros}/>}

    <GestorSelector sel={selG} setSel={setSelG} todos lista={gestores}/>

    {docs===null&&<div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div>}
    {docs!==null&&delMes.length===0&&<div style={{background:C.bg,border:`1px dashed ${C.border}`,borderRadius:12,padding:36,textAlign:"center",color:C.muted,fontSize:14}}>Sin recupero cargado para {mes}. Usá “+ Cargar recupero”.</div>}
    {delMes.length>0&&<>
      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        {selG
          ?<><Stat label="Recupero" value={fmtARS(totMostrar)} sub={selG.name} icon="💰"/><Stat label="Objetivo" value={fmtARS(objMostrar)} color={C.muted} icon="🎯"/><Stat label="Alcance" value={`${pct(totMostrar,objMostrar)}%`} color={pct(totMostrar,objMostrar)>=100?C.light:C.warn} icon="📈"/><Stat label="Promesas" value={promGestor(selG.id)} color={C.info} icon="🤝"/></>
          :<><Stat label="Total equipo" value={fmtARS(totEquipo)} sub={mes} icon="💰"/><Stat label="Objetivo período" value={fmtARS(objEquipo)} color={C.muted} icon="🎯"/><Stat label="Cumplimiento" value={`${pct(totEquipo,objEquipo)}%`} color={pct(totEquipo,objEquipo)>=100?C.light:C.warn} icon="📈"/>{mejor&&mejor.tot>0&&<Stat label="Mejor gestor" value={mejor.g.name} sub={fmtARS(mejor.tot)} color={C.info} icon="🏆"/>}</>}
      </div>
      <Card><CardTitle>Recupero vs. Objetivo — {selG?selG.name:"Equipo"}</CardTitle><AreaChart id="sr1" data={serie} kVal="recupero" kObj="objetivo" nVal="Recupero" nObj="Objetivo" yFmt={v=>`$${v}k`}/></Card>
      <Card mb={0}><CardTitle>Por gestor — {mes}</CardTitle>{ranking.map(function(it){return <div key={it.g.id} style={{marginBottom:10,opacity:selG&&selG.id!==it.g.id?.4:1}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13}}><span style={{color:C.text}}>{it.g.name}</span><span style={{color:C.green,fontWeight:600}}>{fmtARS(it.tot)}</span></div><ProgBar value={it.tot} max={Math.max(1,objGestor(it.g.id))}/></div>;})}</Card>
    </>}

    {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.white,borderRadius:16,padding:26,width:440,maxWidth:"94vw"}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:16}}>💰 Cargar recupero del día</div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Gestor</label>
          <select value={form.gestorId} onChange={e=>setForm(Object.assign({},form,{gestorId:e.target.value}))} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
            <option value="">Seleccionar…</option>
            {gestores.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Fecha</label>
          <input type="date" value={form.fecha} onChange={e=>setForm(Object.assign({},form,{fecha:e.target.value}))} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,boxSizing:"border-box"}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Recupero (en miles $)</label>
            <input type="number" value={form.recupero} onChange={e=>setForm(Object.assign({},form,{recupero:e.target.value}))} placeholder="320" style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:16,fontWeight:700,textAlign:"center",color:C.green,boxSizing:"border-box"}}/>
            {form.recupero!==""&&<div style={{fontSize:11,color:C.muted,marginTop:4,textAlign:"center"}}>{fmtARS(parseInt(form.recupero,10)||0)}</div>}
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Promesas de pago</label>
            <input type="number" value={form.promesas} onChange={e=>setForm(Object.assign({},form,{promesas:e.target.value}))} placeholder="8" style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:16,fontWeight:700,textAlign:"center",color:C.info,boxSizing:"border-box"}}/>
          </div>
        </div>
        <div style={{background:`${C.info}10`,border:`1px solid ${C.info}33`,borderRadius:8,padding:"9px 12px",fontSize:12,color:C.muted,marginBottom:18,lineHeight:1.6}}>💡 “Recupero en miles”: 320 = $320.000. Una carga por gestor por día (si recargás la misma fecha, se actualiza).</div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setModal(false)} style={{padding:"9px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button onClick={guardar} disabled={guardando||!form.gestorId||form.recupero===""} style={{padding:"9px 20px",background:(guardando||!form.gestorId||form.recupero==="")?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>{guardando?"Guardando…":"Guardar"}</button>
        </div>
      </div>
    </div>}
  </div>;
}
function SVLogueos(){
  const [fecha,setFecha]=useState(new Date().toISOString().slice(0,10));
  const [logins,setLogins]=useState(null);
  const [loading,setLoading]=useState(false);
  const [gestoresMap,setGestoresMap]=useState({});

  // Cargar mapa neotelId → nombre desde Firestore
  useEffect(function(){
    if(!window.firebaseConfigured) return;
    window.db.collection("usuarios").get().then(function(snap){
      var map={};
      snap.docs.forEach(function(d){
        var u=d.data();
        if(u.neotelId) map[String(u.neotelId)]={name:u.name||u.user,legajo:u.legajo||""};
      });
      setGestoresMap(map);
    }).catch(function(){});
  },[]);

  function cargar(f){
    var fch=f||fecha;
    setLoading(true); setLogins(null);
    fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},
      body:JSON.stringify({action:"logins",fecha:fch})})
    .then(function(r){return r.json();})
    .then(function(d){
      setLogins(d.logins||[]);
      setLoading(false);
    }).catch(function(){setLoading(false);});
  }

  useEffect(function(){cargar(fecha);},[fecha]);

  function esActivo(salida){return !salida||salida.startsWith("2000-01-01");}
  function fmtDur(min){
    if(min<0||!min) return "—";
    if(min<60) return min+"min";
    return Math.floor(min/60)+"h "+( min%60)+"min";
  }

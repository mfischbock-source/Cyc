        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
          {[
            {l:"Título",f:"titulo",span:2,ph:"Nombre del material"},
          ].map(fi=><div key={fi.f} style={{marginBottom:12,gridColumn:`span ${fi.span||1}`}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>{fi.l}</label>
            <input value={nuevoContenido[fi.f]||""} onChange={e=>setNuevoContenido({...nuevoContenido,[fi.f]:e.target.value})} placeholder={fi.ph}
              style={{width:"100%",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
          </div>)}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Tipo de archivo</label>
            <select value={nuevoContenido.tipo} onChange={e=>setNuevoContenido({...nuevoContenido,tipo:e.target.value})}
              style={{width:"100%",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
              <option value="pdf">📄 PDF / Presentación</option>
              <option value="video">🎬 Video</option>
              <option value="audio">🎧 Audio</option>
              <option value="ppt">📊 PowerPoint</option>
            </select>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Módulo</label>
            <select value={nuevoContenido.modulo} onChange={e=>setNuevoContenido({...nuevoContenido,modulo:e.target.value})}
              style={{width:"100%",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
              <option value="">Seleccionar módulo…</option>
              {modulos.map(m=><option key={m.id} value={m.id}>{m.nombre}</option>)}
            </select>
          </div>
          <div style={{marginBottom:12,gridColumn:"span 2"}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Cartera</label>
            <select value={nuevoContenido.cartera} onChange={e=>setNuevoContenido({...nuevoContenido,cartera:e.target.value})}
              style={{width:"100%",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
              <option value="General">🌐 General (todos los gestores)</option>
              {carteras.map(ct=><option key={ct.id} value={ct.nombre}>{ct.nombre}</option>)}
            </select>
          </div>
          <div style={{marginBottom:12,gridColumn:"span 2"}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Revisar cada (días) — para avisar “Vence pronto”</label>
            <input type="number" min="0" value={nuevoContenido.revisarCadaDias||""} onChange={e=>setNuevoContenido({...nuevoContenido,revisarCadaDias:e.target.value})} placeholder="Ej: 90 (dejar vacío = sin control de vencimiento)"
              style={{width:"100%",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,boxSizing:"border-box"}}/>
          </div>
          <div style={{marginBottom:16,gridColumn:"span 2"}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Archivo</label>
            <input type="file" ref={fileRef} style={{display:"none"}}
              accept=".pdf,.ppt,.pptx,.mp4,.mp3,.wav,.m4a,application/pdf,video/*,audio/*"
              onChange={e=>{setArchivo(e.target.files[0]||null);setErrorUp("");}}/>
            <div onClick={()=>fileRef.current&&fileRef.current.click()}
              onDragOver={e=>e.preventDefault()}
              onDrop={e=>{e.preventDefault();if(e.dataTransfer.files[0]){setArchivo(e.dataTransfer.files[0]);setErrorUp("");}}}
              style={{border:`2px dashed ${archivo?C.green:C.border}`,borderRadius:10,padding:"20px",textAlign:"center",background:archivo?`${C.green}08`:C.bg,cursor:"pointer"}}>
              <div style={{fontSize:24,marginBottom:6}}>{archivo?"✅":"📁"}</div>
              <div style={{fontSize:13,color:archivo?C.text:C.muted,fontWeight:archivo?600:400,wordBreak:"break-all"}}>{archivo?archivo.name:"Arrastrá el archivo o hacé clic para seleccionar"}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4}}>{archivo?fmtTam(archivo.size):"PDF, Video (MP4), Audio (MP3/WAV), PowerPoint — máx. 500MB"}</div>
            </div>
          </div>
        </div>
        {subiendo&&<div style={{marginBottom:12}}>
          <div style={{height:8,background:C.border,borderRadius:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:progreso+"%",background:C.green,transition:"width .2s"}}/>
          </div>
          <div style={{fontSize:12,color:C.muted,marginTop:4,textAlign:"center"}}>Subiendo… {progreso}%</div>
        </div>}
        {errorUp&&<div style={{background:`${C.danger}10`,border:`1px solid ${C.danger}40`,color:C.danger,borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:12}}>{errorUp}</div>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button disabled={subiendo} onClick={()=>setUploadModal(false)} style={{padding:"9px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:subiendo?"not-allowed":"pointer",fontSize:13,color:C.muted,opacity:subiendo?0.6:1}}>Cancelar</button>
          <button disabled={subiendo} onClick={subirContenido} style={{padding:"9px 20px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:subiendo?"not-allowed":"pointer",fontSize:13,fontWeight:700,opacity:subiendo?0.7:1}}>{subiendo?`Subiendo… ${progreso}%`:"Guardar"}</button>
        </div>
      </div>
    </div>}

    {/* MODAL MÓDULOS */}
    {moduloModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.white,borderRadius:16,padding:28,width:520,maxWidth:"92vw",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:6}}>⚙️ Gestionar módulos</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Los módulos organizan el contenido, los cursos y las evaluaciones. Las carteras se administran en “Agentes IA”.</div>
        {modulos.map(m=>(
          <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,background:C.bg}}>
            <span style={{fontSize:14,color:C.text}}>{m.nombre}</span>
            <button onClick={()=>{ if(window.confirm("¿Borrar el módulo “"+m.nombre+"”?")) delModulo(m.id); }} style={{padding:"3px 10px",border:`1px solid ${C.danger}33`,borderRadius:6,background:`${C.danger}08`,cursor:"pointer",fontSize:12,color:C.danger}}>Eliminar</button>
          </div>
        ))}
        <div style={{border:`2px dashed ${C.green}55`,borderRadius:10,padding:"14px",marginTop:8,marginBottom:16,background:`${C.green}05`}}>
          <div style={{fontSize:13,fontWeight:600,color:C.green,marginBottom:8}}>+ Nuevo módulo</div>
          <div style={{display:"flex",gap:8}}>
            <input value={nuevoModulo} onChange={e=>setNuevoModulo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addModulo();}} placeholder="Nombre del módulo (ej: Módulo 6 – Cobranza Digital)"
              style={{flex:1,padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
            <button onClick={addModulo} disabled={!nuevoModulo.trim()} style={{padding:"8px 16px",background:nuevoModulo.trim()?C.green:C.muted,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>Agregar</button>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>setModuloModal(false)} style={{padding:"9px 20px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>Listo</button>
        </div>
      </div>
    </div>}
  </div>;
}

</script>
<script type="text/babel">

// ── EVALUACIONES ──────────────────────────────────────────────────────────
const evalConfigInit={notaMinima:7,unidad:"decimal",reintentos:2,mostrarRespuestas:true,tiempoLimite:30};
const evalInit=[
  {id:1,titulo:"Evaluación Módulo 1 – Introducción",modulo:1,preguntas:[
    {preg:"¿Cuál es la misión principal de DASA?",opciones:["Maximizar recupero","Brindar servicio bancario","Gestionar cobranzas extrajudiciales","Asesorar a deudores"],correcta:2},
    {preg:"¿Qué significan las siglas DASA?",opciones:["Deuda Argentina S.A.","Distressed Assets S.A.","Departamento de Asesoría","Data Assets SRL"],correcta:1},
    {preg:"¿Cuál es la actitud correcta ante un deudor agresivo?",opciones:["Cortar la llamada","Responder con firmeza","Mantener calma y aplicar protocolo","Transferir al supervisor"],correcta:2},
  ],notaMinima:7,cartera:"General"},
  {id:2,titulo:"Evaluación Módulo 3 – Script BG",modulo:3,preguntas:[
    {preg:"¿Cuántas cuotas máximas ofrece Banco Galicia para mora temprana?",opciones:["3","6","12","24"],correcta:1},
    {preg:"¿Qué dato se debe confirmar al cerrar una promesa de pago?",opciones:["Solo el monto","Monto y fecha","Monto, fecha y canal","Solo el CBU"],correcta:2},
  ],notaMinima:7,cartera:"Banco Galicia"},
];
const histEvalInit=[
  {id:1,gestor:"Juan García",  eval:"Evaluación Módulo 1",fecha:"10/03/2025",nota:8.5,intento:1,estado:"aprobado"},
  {id:2,gestor:"María López",  eval:"Evaluación Módulo 1",fecha:"10/03/2025",nota:9.0,intento:1,estado:"aprobado"},
  {id:3,gestor:"Carlos Ruiz",  eval:"Evaluación Módulo 1",fecha:"11/03/2025",nota:5.5,intento:1,estado:"reprobado"},
  {id:4,gestor:"Carlos Ruiz",  eval:"Evaluación Módulo 1",fecha:"12/03/2025",nota:7.5,intento:2,estado:"aprobado"},
  {id:5,gestor:"Juan García",  eval:"Evaluación Módulo 3 – Script BG",fecha:"15/03/2025",nota:8.0,intento:1,estado:"aprobado"},
  {id:6,gestor:"Ana Martínez", eval:"Evaluación Módulo 1",fecha:"10/03/2025",nota:6.0,intento:1,estado:"reprobado"},
  {id:7,gestor:"Ana Martínez", eval:"Evaluación Módulo 1",fecha:"11/03/2025",nota:8.0,intento:2,estado:"aprobado"},
];

function SVEvaluaciones(){
  const {carteras,modulos,gestores}=useCatalogos();
  const [tab,setTab]=useState("lista");
  const [evals,setEvals]=useState([]);
  const [config,setConfig]=useState(evalConfigInit);
  const [historial,setHistorial]=useState([]);
  const [modal,setModal]=useState(null);
  const [selEval,setSelEval]=useState(null);
  const [form,setForm]=useState({titulo:"",modulo:"",notaMinima:7,cartera:"General",preguntas:[]});
  const [configSaved,setConfigSaved]=useState(false);

  // Evaluaciones + configuración + resultados (historial) — todo de Firestore.
  useEffect(function(){
    if(!window.db)return;
    window.db.collection("evaluaciones").get()
      .then(function(snap){setEvals(snap.docs.map(function(d){return d.data();}));})
      .catch(function(e){console.error("[DASA] evaluaciones:",e);});
    window.db.collection("configuracion").doc("evaluaciones").get()
      .then(function(doc){if(doc.exists)setConfig(Object.assign({},evalConfigInit,doc.data()));})
      .catch(function(){});
    window.db.collection("resultados_evaluaciones").get()
      .then(function(snap){
        var rows=snap.docs.map(function(d){var x=d.data();return {id:d.id,gestor:x.gestorNombre||x.gestor||"—",eval:x.evalTitulo||x.eval||"—",fecha:x.fecha||"",nota:x.nota,intento:x.intento||1,estado:x.estado||"reprobado"};});
        rows.sort(function(a,b){return (b.fecha||"").localeCompare(a.fecha||"");});
        setHistorial(rows);
      })
      .catch(function(e){console.error("[DASA] resultados:",e);});
  },[]);
  const persistEval=function(ev){ if(window.db) window.db.collection("evaluaciones").doc(String(ev.id)).set(ev).catch(function(e){console.error("[DASA] guardar eval:",e);}); };
  const guardarConfig=function(){ if(window.db) window.db.collection("configuracion").doc("evaluaciones").set(config).catch(function(e){console.error("[DASA] guardar config eval:",e);}); setConfigSaved(true);setTimeout(function(){setConfigSaved(false);},2500); };

  // ── Constructor de preguntas del cuestionario ──────────────────────────────
  const [editEval,setEditEval]=useState(null);
  const [pregForm,setPregForm]=useState({preg:"",opciones:["",""],correcta:0});
  const addPregunta=function(){
    var ops=pregForm.opciones.map(function(o){return o.trim();}).filter(function(o){return o;});
    if(!editEval||!pregForm.preg.trim()||ops.length<2)return;
    var correcta=Math.min(pregForm.correcta,ops.length-1);
    var nq={preg:pregForm.preg.trim(),opciones:ops,correcta:correcta};
    var upd=Object.assign({},editEval,{preguntas:(editEval.preguntas||[]).concat([nq])});
    setEvals(function(p){return p.map(function(e){return e.id===upd.id?upd:e;});});
    setEditEval(upd);persistEval(upd);
    setPregForm({preg:"",opciones:["",""],correcta:0});
  };
  const delPregunta=function(qi){
    var upd=Object.assign({},editEval,{preguntas:(editEval.preguntas||[]).filter(function(_,i){return i!==qi;})});
    setEvals(function(p){return p.map(function(e){return e.id===upd.id?upd:e;});});
    setEditEval(upd);persistEval(upd);
  };

  const modulos2=modulos;

  const estadoStyle=e=>({
    background:e==="aprobado"?`${C.light}22`:e==="reprobado"?`${C.danger}18`:`${C.warn}15`,
    color:e==="aprobado"?C.green:e==="reprobado"?C.danger:C.warn,
    border:`1px solid ${e==="aprobado"?C.paleB:e==="reprobado"?C.danger+"33":C.warn+"44"}`,
    borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600
  });

  return <div>
    <SecTitle icon="📝">Evaluaciones</SecTitle>
    <TabBar tabs={[{id:"lista",label:"📋 Evaluaciones"},{id:"config",label:"⚙️ Configuración"},{id:"historial",label:"📊 Historial"}]} active={tab} onChange={setTab}/>

    {/* LISTA */}
    {tab==="lista"&&<div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
        <button onClick={()=>{setForm({titulo:"",notaMinima:7,asignados:[],preguntas:[]});setModal("nueva");}}
          style={{padding:"8px 18px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
          + Nueva evaluación
        </button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {evals.map(ev=>{
          const mod=modulos2.find(m=>m.id===ev.modulo);
          const aprobados=historial.filter(h=>h.eval===ev.titulo&&h.estado==="aprobado").length;
          const reprobados=historial.filter(h=>h.eval===ev.titulo&&h.estado==="reprobado").length;
          return <div key={ev.id} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>{ev.titulo}</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,padding:"1px 8px",borderRadius:20,background:`${C.info}15`,color:C.info,fontWeight:500}}>{(ev.gestores&&ev.gestores.length)?("👤 "+ev.gestores.length+" operador"+(ev.gestores.length>1?"es":"")):"sin asignar"}</span>
                  <span style={{fontSize:12,color:C.muted}}>{ev.preguntas.length} preguntas · Nota mín: <strong style={{color:C.green}}>{ev.notaMinima}</strong></span>
                </div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:12,color:C.green,fontWeight:600}}>✅ {aprobados} aprobados</span>
                <span style={{fontSize:12,color:C.danger,fontWeight:600}}>✗ {reprobados} reprobados</span>
                <button onClick={()=>setEditEval(ev)}
                  style={{padding:"5px 12px",border:`1px solid ${C.green}`,borderRadius:6,background:`${C.green}10`,cursor:"pointer",fontSize:12,color:C.green,fontWeight:600}}>
                  ✏️ Editar preguntas
                </button>
                <button onClick={()=>setSelEval(selEval?.id===ev.id?null:ev)}
                  style={{padding:"5px 12px",border:`1px solid ${C.border}`,borderRadius:6,background:C.white,cursor:"pointer",fontSize:12,color:C.muted}}>
                  {selEval?.id===ev.id?"▲ Cerrar":"▼ Ver preguntas"}
                </button>
              </div>
            </div>
            {selEval?.id===ev.id&&<div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
              {ev.preguntas.map((q,qi)=>(
                <div key={qi} style={{marginBottom:12,padding:"10px 14px",background:C.bg,borderRadius:8}}>
                  <div style={{fontSize:13,fontWeight:600,color:C.text,marginBottom:8}}>{qi+1}. {q.preg}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                    {q.opciones.map((op,oi)=>(
                      <div key={oi} style={{padding:"5px 10px",borderRadius:6,background:oi===q.correcta?`${C.light}22`:C.white,border:`1px solid ${oi===q.correcta?C.light:C.border}`,fontSize:12,color:oi===q.correcta?C.green:C.muted}}>
                        {oi===q.correcta?"✓ ":""}{op}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>}
          </div>;
        })}
      </div>
    </div>}

    {/* CONFIG */}
    {tab==="config"&&<div>
      <Card>
        <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:18}}>Configuración de evaluaciones</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>Nota mínima para aprobar</label>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <input type="number" min="1" max="10" step="0.5" value={config.notaMinima} onChange={e=>setConfig({...config,notaMinima:parseFloat(e.target.value)})}
                style={{width:80,padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:18,fontWeight:700,textAlign:"center",color:C.green}}/>
              <span style={{fontSize:13,color:C.muted}}>sobre 10</span>
            </div>
            <div style={{marginTop:8,padding:"8px 12px",background:`${C.danger}10`,border:`1px solid ${C.danger}33`,borderRadius:8,fontSize:12,color:C.danger}}>
              Por debajo de {config.notaMinima} → el gestor debe repetir la evaluación
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>Unidad de puntuación</label>
            <select value={config.unidad} onChange={e=>setConfig({...config,unidad:e.target.value})}
              style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
              <option value="decimal">Decimal (ej: 7.5 / 10)</option>
              <option value="porcentaje">Porcentaje (ej: 75%)</option>
              <option value="concepto">Conceptual (Insuf. / Aprob. / Sobres.)</option>
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>Reintentos permitidos</label>
            <select value={config.reintentos} onChange={e=>setConfig({...config,reintentos:parseInt(e.target.value)})}
              style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
              <option value={1}>1 reintento</option>
              <option value={2}>2 reintentos</option>
              <option value={3}>3 reintentos</option>
              <option value={99}>Ilimitados</option>
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>Tiempo límite por evaluación</label>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="number" min="5" max="120" value={config.tiempoLimite} onChange={e=>setConfig({...config,tiempoLimite:parseInt(e.target.value)})}
                style={{width:80,padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:14,textAlign:"center"}}/>
              <span style={{fontSize:13,color:C.muted}}>minutos</span>
            </div>
          </div>
        </div>
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,marginBottom:20}}>
          <input type="checkbox" checked={config.mostrarRespuestas} onChange={e=>setConfig({...config,mostrarRespuestas:e.target.checked})} style={{accentColor:C.green,width:16,height:16}}/>
          Mostrar respuestas correctas al finalizar la evaluación
        </label>
        <div style={{background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"12px 16px",marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:600,color:C.green,marginBottom:6}}>Escala de resultados</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:13}}>
            <div style={{padding:"6px 12px",background:C.white,borderRadius:8,border:`1px solid ${C.danger}33`,color:C.danger}}>
              &lt; {config.notaMinima} → <strong>Reprobado</strong> (debe repetir)
            </div>
            <div style={{padding:"6px 12px",background:C.white,borderRadius:8,border:`1px solid ${C.warn}44`,color:C.warn}}>
              {config.notaMinima} – 7.9 → <strong>Aprobado</strong>
            </div>
            <div style={{padding:"6px 12px",background:C.white,borderRadius:8,border:`1px solid ${C.light}`,color:C.green}}>
              8.0 – 9.4 → <strong>Bueno</strong>
            </div>
            <div style={{padding:"6px 12px",background:C.white,borderRadius:8,border:`1px solid #c8960c44`,color:"#c8960c"}}>
              9.5 – 10 → <strong>Sobresaliente</strong>
            </div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",gap:10,alignItems:"center"}}>
          {configSaved&&<span style={{color:C.green,fontWeight:600,fontSize:13}}>✓ Guardado</span>}
          <button onClick={guardarConfig}
            style={{padding:"9px 22px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
            Guardar configuración
          </button>
        </div>
      </Card>
    </div>}

    {/* HISTORIAL */}
    {tab==="historial"&&<div>
      <div style={{display:"flex",gap:10,marginBottom:18}}>
        <Stat label="Total evaluaciones" value={historial.length} color={C.info} icon="📝"/>
        <Stat label="Aprobados" value={historial.filter(h=>h.estado==="aprobado").length} color={C.green} icon="✅"/>
        <Stat label="Reprobados" value={historial.filter(h=>h.estado==="reprobado").length} color={C.danger} icon="✗"/>
        <Stat label="Tasa de aprobación" value={historial.length?`${Math.round(historial.filter(h=>h.estado==="aprobado").length/historial.length*100)}%`:"—"} color={C.light} icon="📊"/>
      </div>
      <Card mb={0}><CardTitle>Historial de evaluaciones — todos los gestores</CardTitle>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
              {["Gestor","Evaluación","Fecha","Nota","Intento","Estado"].map(h=>(
                <th key={h} style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{historial.map((h,i)=>(
              <tr key={h.id} style={{borderBottom:`1px solid ${C.border}`,background:h.estado==="reprobado"&&h.intento===1?"#fce8e8":i%2===0?C.bg:C.white}}>
                <td style={{padding:"9px 10px",fontWeight:600,color:C.text}}>{h.gestor}</td>
                <td style={{padding:"9px 10px",color:C.muted,fontSize:12}}>{h.eval}</td>
                <td style={{padding:"9px 10px",color:C.muted}}>{h.fecha}</td>
                <td style={{padding:"9px 10px",fontWeight:800,color:h.nota>=7?C.green:C.danger,fontSize:16}}>{h.nota}</td>
                <td style={{padding:"9px 10px",color:C.muted}}>#{h.intento}</td>
                <td style={{padding:"9px 10px"}}><span style={estadoStyle(h.estado)}>{h.estado==="aprobado"?"✓ Aprobado":"✗ Reprobado"}</span></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </Card>
    </div>}

    {/* MODAL EDITAR PREGUNTAS */}
    {editEval&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"24px 16px",overflowY:"auto"}}>
      <div style={{width:640,maxWidth:"96vw"}}>
        {/* Encabezado tipo Google Form (barra de color arriba) */}
        <div style={{background:C.white,borderRadius:"10px 10px 8px 8px",borderTop:`8px solid ${C.green}`,padding:"20px 24px",marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.15)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{fontSize:22,fontWeight:700,color:C.text}}>{editEval.titulo}</div>
            <button onClick={()=>{setEditEval(null);setPregForm({preg:"",opciones:["",""],correcta:0});}} style={{border:"none",background:"transparent",fontSize:24,cursor:"pointer",color:C.muted,lineHeight:1}}>×</button>
          </div>
          <div style={{fontSize:13,color:C.muted,marginTop:4}}>Cuestionario · {(editEval.preguntas||[]).length} pregunta(s) · se guarda solo · aprobás con {editEval.notaMinima||7}/10</div>
        </div>

        {/* Preguntas ya cargadas (tarjetas tipo formulario) */}
        {(editEval.preguntas||[]).map((q,qi)=>(
          <div key={qi} style={{background:C.white,borderRadius:8,padding:"18px 24px",marginBottom:12,boxShadow:"0 1px 3px rgba(0,0,0,.12)"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10,marginBottom:14}}>
              <div style={{fontSize:15,fontWeight:600,color:C.text}}><span style={{color:C.muted,fontWeight:400}}>{qi+1}.</span> {q.preg}</div>
              <button onClick={()=>delPregunta(qi)} title="Eliminar pregunta" style={{border:"none",background:"transparent",color:C.muted,borderRadius:6,cursor:"pointer",fontSize:16,flexShrink:0}}>🗑</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {q.opciones.map((op,oi)=>{var ok=oi===q.correcta;return (
                <div key={oi} style={{display:"flex",alignItems:"center",gap:12}}>
                  <span style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${ok?C.green:C.border}`,background:ok?C.green:C.white,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{ok&&<span style={{width:7,height:7,borderRadius:"50%",background:C.white}}/>}</span>
                  <span style={{fontSize:14,color:ok?C.green:C.text,fontWeight:ok?600:400}}>{op}</span>
                  {ok&&<span style={{fontSize:11,color:C.green,background:`${C.green}15`,borderRadius:20,padding:"1px 8px"}}>✓ correcta</span>}
                </div>
              );})}
            </div>
          </div>
        ))}

        {/* Nueva pregunta — editor tipo Google Form */}
        <div style={{background:C.white,borderRadius:8,borderLeft:`6px solid ${C.green}`,padding:"18px 24px",marginBottom:16,boxShadow:"0 1px 3px rgba(0,0,0,.12)"}}>
          <input value={pregForm.preg} onChange={e=>setPregForm(Object.assign({},pregForm,{preg:e.target.value}))} placeholder="Escribí la pregunta"
            style={{width:"100%",padding:"8px 4px",border:"none",borderBottom:`2px solid ${C.border}`,fontSize:16,color:C.text,outline:"none",marginBottom:18,background:"transparent",boxSizing:"border-box"}}/>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {pregForm.opciones.map((op,oi)=>(
              <div key={oi} style={{display:"flex",alignItems:"center",gap:12}}>
                <input type="radio" name="correcta" checked={pregForm.correcta===oi} onChange={()=>setPregForm(Object.assign({},pregForm,{correcta:oi}))} style={{accentColor:C.green,width:18,height:18,flexShrink:0}} title="Marcar como respuesta correcta"/>
                <input value={op} onChange={e=>setPregForm(function(p){var o=p.opciones.slice();o[oi]=e.target.value;return Object.assign({},p,{opciones:o});})} placeholder={`Opción ${oi+1}`}
                  style={{flex:1,padding:"6px 4px",border:"none",borderBottom:`1px solid ${C.border}`,fontSize:14,outline:"none",background:"transparent"}}/>
                {pregForm.correcta===oi&&<span style={{fontSize:11,color:C.green,whiteSpace:"nowrap"}}>correcta</span>}
                {pregForm.opciones.length>2&&<button onClick={()=>setPregForm(function(p){if(p.opciones.length<=2)return p;var o=p.opciones.filter(function(_,i){return i!==oi;});return Object.assign({},p,{opciones:o,correcta:Math.min(p.correcta,o.length-1)});})} style={{border:"none",background:"transparent",color:C.muted,cursor:"pointer",fontSize:18,flexShrink:0}}>×</button>}
              </div>
            ))}
            {pregForm.opciones.length<6&&<div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${C.border}`,flexShrink:0}}/>
              <button onClick={()=>setPregForm(Object.assign({},pregForm,{opciones:pregForm.opciones.concat([""])}))} style={{border:"none",background:"transparent",color:C.info,cursor:"pointer",fontSize:14,padding:"4px 0"}}>Agregar opción</button>
            </div>}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",borderTop:`1px solid ${C.border}`,marginTop:16,paddingTop:14}}>
            <button onClick={addPregunta} disabled={!pregForm.preg.trim()||pregForm.opciones.filter(o=>o.trim()).length<2}
              style={{padding:"9px 22px",background:(!pregForm.preg.trim()||pregForm.opciones.filter(o=>o.trim()).length<2)?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>+ Agregar pregunta</button>
          </div>
        </div>

        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>{setEditEval(null);setPregForm({preg:"",opciones:["",""],correcta:0});}} style={{padding:"10px 26px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700,boxShadow:"0 2px 6px rgba(0,0,0,.15)"}}>Listo</button>
        </div>
      </div>
    </div>}

    {/* MODAL NUEVA EVAL */}
    {modal==="nueva"&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.white,borderRadius:16,padding:28,width:520,maxWidth:"92vw",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:18}}>📝 Nueva evaluación</div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Título</label>
          <input value={form.titulo} onChange={e=>setForm({...form,titulo:e.target.value})} placeholder="Ej: Evaluación Módulo 2 – Negociación"
            style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6}}>¿A qué operador(es) se le toma? <span style={{color:C.muted}}>(ya tienen su cartera asignada)</span></label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",maxHeight:150,overflowY:"auto"}}>
            {(gestores||[]).map(function(g){var on=(form.asignados||[]).indexOf(g.id)>=0;return <label key={g.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",padding:"5px 12px",borderRadius:20,border:`1px solid ${on?C.green:C.border}`,background:on?C.pale:C.white}}><input type="checkbox" checked={on} onChange={function(){setForm(function(p){var a=(p.asignados||[]).slice();var i=a.indexOf(g.id);if(i>=0)a.splice(i,1);else a.push(g.id);return Object.assign({},p,{asignados:a});});}} style={{accentColor:C.green}}/>{g.name}</label>;})}
            {!(gestores||[]).length&&<span style={{fontSize:12,color:C.muted}}>No hay operadores cargados.</span>}
          </div>
        </div>
        <div style={{marginBottom:16,padding:"10px 14px",background:`${C.green}08`,border:`1px solid ${C.paleB}`,borderRadius:8,fontSize:13,color:C.muted}}>
          💡 Las preguntas se agregan una vez creada la evaluación, desde el listado. Le aparece en “Mis evaluaciones” a cada operador asignado.
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setModal(null)} style={{padding:"8px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button onClick={()=>{if(form.titulo){const ne={id:"ev"+Date.now(),titulo:form.titulo,notaMinima:form.notaMinima||7,preguntas:[],gestores:form.asignados||[],cartera:"General"};setEvals(p=>[...p,ne]);persistEval(ne);setModal(null);}}}
            style={{padding:"8px 18px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
            Crear evaluación
          </button>
        </div>
      </div>
    </div>}
  </div>;
}



</script>

<script type="text/babel">
// ── CURSOS ────────────────────────────────────────────────────────────────
const cursosInit=[
  {id:1,nombre:"Capacitación Inicial DASA",desc:"Programa completo de onboarding para nuevos gestores",modulos:[1,2,5],cartera:"General",   activo:true, gestores:[1,2,3,4,5]},
  {id:2,nombre:"Especialización Banco Galicia",desc:"Formación específica para la cartera de Banco Galicia",modulos:[1,3],cartera:"Banco Galicia",activo:true, gestores:[1,2]},
  {id:3,nombre:"Actualización Santander Q2/25",desc:"Actualización de protocolos y scripts Q2 2025",modulos:[4],cartera:"Banco Santander",activo:false,gestores:[3]},
];

function SVCursos(){
  const {gestores}=useCatalogos();
  const [cursos,setCursos]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [modal,setModal]=useState(false);
  const [sel,setSel]=useState(null);
  // asistente
  const [nombre,setNombre]=useState("");
  const [desc,setDesc]=useState("");
  const [materiales,setMateriales]=useState([]);   // ya subidos (al re-editar) — en alta arranca vacío
  const [archivos,setArchivos]=useState([]);        // File[] pendientes de subir
  const [preguntas,setPreguntas]=useState([]);
  const [notaMin,setNotaMin]=useState(6);
  const [asig,setAsig]=useState([]);
  const [destino,setDestino]=useState("refuerzo");   // "refuerzo" (gestores) | "induccion" (gestores nuevos)
  const [pForm,setPForm]=useState({preg:"",opciones:["",""],correcta:0});
  const [subiendo,setSubiendo]=useState(false);
  const [err,setErr]=useState("");
  const fileRef=useRef(null);

  useEffect(function(){
    if(!window.db){setCargando(false);return;}
    window.db.collection("cursos").get()
      .then(function(s){var arr=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});arr.sort(function(a,b){return ((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0);});setCursos(arr);setCargando(false);})
      .catch(function(e){console.error("[DASA] cursos:",e);setCargando(false);});
  },[]);
  const persist=function(c){ if(window.db) window.db.collection("cursos").doc(String(c.id)).set(c).catch(function(e){console.error("[DASA] curso:",e);}); };
  const borrar=function(id,nom){ if(!window.confirm("¿Borrar el curso \""+nom+"\"?"))return; setCursos(function(p){return p.filter(function(c){return c.id!==id;});}); if(window.db) window.db.collection("cursos").doc(String(id)).delete().catch(function(){}); };

  const reset=function(){setNombre("");setDesc("");setMateriales([]);setArchivos([]);setPreguntas([]);setNotaMin(6);setAsig([]);setDestino("refuerzo");setPForm({preg:"",opciones:["",""],correcta:0});setErr("");};
  const addPreg=function(){var ops=pForm.opciones.map(function(o){return o.trim();}).filter(Boolean);if(!pForm.preg.trim()||ops.length<2){setErr("La pregunta necesita enunciado y al menos 2 opciones.");return;}setPreguntas(function(p){return p.concat([{preg:pForm.preg.trim(),opciones:ops,correcta:Math.min(pForm.correcta,ops.length-1)}]);});setPForm({preg:"",opciones:["",""],correcta:0});setErr("");};
  const delPreg=function(i){setPreguntas(function(p){return p.filter(function(_,j){return j!==i;});});};
  const toggleAsig=function(uid){setAsig(function(p){return p.indexOf(uid)>=0?p.filter(function(x){return x!==uid;}):p.concat([uid]);});};
  const setOpc=function(i,v){setPForm(function(p){var o=p.opciones.slice();o[i]=v;return Object.assign({},p,{opciones:o});});};

  const fmtTam=function(b){if(!b)return "";if(b>1048576)return (b/1048576).toFixed(1)+" MB";return Math.max(1,Math.round(b/1024))+" KB";};
  const tipoDe=function(name){var e=(name.split(".").pop()||"").toLowerCase();if(["mp4","webm","mov","avi","mkv"].indexOf(e)>=0)return "video";if(["mp3","wav","m4a","ogg"].indexOf(e)>=0)return "audio";if(["ppt","pptx"].indexOf(e)>=0)return "ppt";return "pdf";};

  const guardar=async function(){
    setErr("");
    if(!nombre.trim()){setErr("Poné un nombre al curso.");return;}
    if(destino==="refuerzo"&&!asig.length){setErr("Asigná el curso a al menos un gestor.");return;}
    if(!window.db){setErr("Firebase no disponible.");return;}
    setSubiendo(true);
    try{
      var mats=materiales.slice();
      for(var i=0;i<archivos.length;i++){
        var f=archivos[i];
        var fd=new FormData(); fd.append("file",f); fd.append("subtipo","refuerzo"); fd.append("cartera","Refuerzo");
        var resp=await new Promise(function(res,rej){var xhr=new XMLHttpRequest();xhr.open("POST",window.UPLOAD_PROXY||"/upload.php");xhr.setRequestHeader("X-DASA-Token",window.NEOTEL_TOKEN||"");xhr.onload=function(){try{var j=JSON.parse(xhr.responseText);(xhr.status>=200&&xhr.status<300&&j.ok)?res(j):rej(new Error(j.error||("HTTP "+xhr.status)));}catch(_){rej(new Error("Respuesta inválida del server (HTTP "+xhr.status+")"));}};xhr.onerror=function(){rej(new Error("Error de red al subir el archivo"));};xhr.send(fd);});
        mats.push({titulo:f.name,tipo:tipoDe(f.name),url:resp.url,tamanio:fmtTam(resp.size),actualizadoEn:new Date().toISOString().slice(0,10)});
      }
      var id="cur"+Date.now();
      var doc={id:id,nombre:nombre.trim(),desc:desc.trim(),tipo:destino,materiales:mats,examen:{preguntas:preguntas,notaMinima:parseInt(notaMin)||6},gestores:destino==="refuerzo"?asig:[],activo:true,actualizadoEn:new Date().toISOString().slice(0,10),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      persist(doc);
      setCursos(function(p){return [Object.assign({},doc,{createdAt:{seconds:Math.floor(Date.now()/1000)}})].concat(p);});
      setSubiendo(false); setModal(false); reset();
    }catch(e){ setSubiendo(false); setErr("Error al guardar: "+((e&&e.message)||e)); }
  };

  const nombreDe=function(uid){var g=(gestores||[]).find(function(x){return String(x.id)===String(uid);});return g?g.name:uid;};

  if(cargando) return <div><SecTitle icon="🎓">Cursos</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div></Card></div>;

  return <div>
    <SecTitle icon="🎓">Cursos</SecTitle>
    <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.6}}>
      Armá un curso en un solo paso: nombre, material (PPT/video/PDF) y examen. Elegí si es para GESTORES (refuerzo, asignás a quién) o para GESTORES NUEVOS (inducción, lo ven todos los ingresos).
    </div>
    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
      <button onClick={function(){reset();setModal(true);}} style={{padding:"9px 20px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>+ Crear curso</button>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {cursos.length===0&&<Card mb={0}><div style={{padding:22,textAlign:"center",color:C.muted,fontSize:13}}>Todavía no hay cursos. Tocá “Crear curso”.</div></Card>}
      {cursos.map(function(c){
        var open=sel===c.id;
        return <div key={c.id} style={{background:C.white,border:`1px solid ${open?C.green:C.border}`,borderRadius:14,overflow:"hidden"}}>
          <div style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={function(){setSel(open?null:c.id);}}>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:3,display:"flex",alignItems:"center",gap:8}}>{c.nombre}
                <span style={{fontSize:11,fontWeight:700,padding:"1px 9px",borderRadius:20,background:c.tipo==="induccion"?"rgba(200,150,12,0.15)":`${C.info}15`,color:c.tipo==="induccion"?"#c8960c":C.info}}>{c.tipo==="induccion"?"Inducción · gestores nuevos":"Refuerzo · gestores"}</span>
              </div>
              <div style={{fontSize:12,color:C.muted}}>{(c.materiales||[]).length} material(es) · {((c.examen&&c.examen.preguntas)||[]).length} preguntas{c.tipo==="induccion"?" · lo ven todos los gestores nuevos":" · "+(c.gestores||[]).length+" gestores asignados"}</div>
            </div>
            <span style={{fontSize:11,padding:"2px 10px",borderRadius:20,background:c.activo!==false?`${C.light}22`:`${C.muted}15`,color:c.activo!==false?C.green:C.muted,border:`1px solid ${c.activo!==false?C.paleB:C.border}`,fontWeight:600}}>{c.activo!==false?"● Activo":"Inactivo"}</span>
            <button onClick={function(e){e.stopPropagation();var upd=Object.assign({},c,{activo:c.activo===false});setCursos(function(p){return p.map(function(x){return x.id===c.id?upd:x;});});persist(upd);}} style={{padding:"5px 12px",border:`1px solid ${C.border}`,borderRadius:6,background:C.white,cursor:"pointer",fontSize:12,color:C.muted}}>{c.activo!==false?"Desactivar":"Activar"}</button>
            <button onClick={function(e){e.stopPropagation();borrar(c.id,c.nombre);}} style={{padding:"5px 10px",border:`1px solid ${C.danger}33`,borderRadius:6,background:`${C.danger}08`,cursor:"pointer",fontSize:12,color:C.danger}}>🗑</button>
            <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
          </div>
          {open&&<div style={{padding:"0 18px 16px",borderTop:`1px solid ${C.border}`}}>
            {c.desc&&<div style={{fontSize:13,color:C.text,margin:"12px 0"}}>{c.desc}</div>}
            <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.5,margin:"12px 0 6px"}}>Material</div>
            {((c.materiales||[]).length?c.materiales:[]).map(function(m,i){return <div key={i} style={{fontSize:13,color:C.text,padding:"6px 0"}}>• {m.titulo} <span style={{color:C.muted,fontSize:12}}>({m.tipo}{m.tamanio?" · "+m.tamanio:""})</span></div>;})}
            {!(c.materiales||[]).length&&<div style={{fontSize:12,color:C.muted}}>Sin material.</div>}
            <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.5,margin:"12px 0 6px"}}>Asignado a</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{(c.gestores||[]).map(function(u){return <span key={u} style={{fontSize:12,background:C.bg,border:`1px solid ${C.border}`,borderRadius:20,padding:"3px 10px"}}>{nombreDe(u)}</span>;})}</div>
          </div>}
        </div>;
      })}
    </div>

    {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.white,borderRadius:16,padding:26,width:640,maxWidth:"96vw",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{fontSize:17,fontWeight:800,color:C.text,marginBottom:4}}>🎓 Crear curso</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Todo en un paso. El examen es opcional.</div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6,fontWeight:600}}>¿Para quién es el curso?</label>
          <div style={{display:"flex",gap:8}}>
            {[{v:"refuerzo",l:"Gestores (refuerzo)",d:"Se asigna a los que elijas"},{v:"induccion",l:"Gestores nuevos (inducción)",d:"Lo ven todos los ingresos"}].map(function(o){var on=destino===o.v;return <button key={o.v} onClick={function(){setDestino(o.v);}} style={{flex:1,textAlign:"left",padding:"10px 14px",borderRadius:10,border:`2px solid ${on?C.green:C.border}`,background:on?C.pale:C.white,cursor:"pointer"}}><div style={{fontSize:13,fontWeight:700,color:on?C.green:C.text}}>{o.l}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{o.d}</div></button>;})}
          </div>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4,fontWeight:600}}>1 · Nombre del curso</label>
          <input value={nombre} onChange={function(e){setNombre(e.target.value);}} placeholder="Ej: Refuerzo — Manejo de objeciones difíciles" style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,boxSizing:"border-box"}}/>
          <textarea value={desc} onChange={function(e){setDesc(e.target.value);}} rows={2} placeholder="Descripción (opcional)" style={{width:"100%",marginTop:8,padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,resize:"none",boxSizing:"border-box"}}/>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4,fontWeight:600}}>2 · Material (PPT, video, PDF…)</label>
          <input ref={fileRef} type="file" multiple onChange={function(e){var fs=Array.prototype.slice.call(e.target.files||[]);setArchivos(function(p){return p.concat(fs);});if(fileRef.current)fileRef.current.value="";}} style={{fontSize:13}}/>
          {archivos.length>0&&<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:5}}>
            {archivos.map(function(f,i){return <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.bg,borderRadius:8,padding:"6px 10px",fontSize:12}}><span>📎 {f.name}</span><button onClick={function(){setArchivos(function(p){return p.filter(function(_,j){return j!==i;});});}} style={{border:"none",background:"transparent",color:C.danger,cursor:"pointer",fontSize:13}}>✕</button></div>;})}
          </div>}
        </div>

        <div style={{marginBottom:14}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6,fontWeight:600}}>3 · Examen (opcional)</label>
          {preguntas.length>0&&<div style={{marginBottom:8,display:"flex",flexDirection:"column",gap:5}}>
            {preguntas.map(function(q,i){return <div key={i} style={{background:C.bg,borderRadius:8,padding:"8px 10px",fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}><span><strong>{i+1}.</strong> {q.preg} <span style={{color:C.green}}>(✓ {q.opciones[q.correcta]})</span></span><button onClick={function(){delPreg(i);}} style={{border:"none",background:"transparent",color:C.danger,cursor:"pointer"}}>✕</button></div>;})}
          </div>}
          <div style={{border:`1px dashed ${C.border}`,borderRadius:10,padding:12}}>
            <input value={pForm.preg} onChange={function(e){setPForm(Object.assign({},pForm,{preg:e.target.value}));}} placeholder="Pregunta…" style={{width:"100%",padding:"7px 10px",border:`1px solid ${C.border}`,borderRadius:7,fontSize:13,marginBottom:6,boxSizing:"border-box"}}/>
            {pForm.opciones.map(function(op,oi){return <div key={oi} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
              <input type="radio" name="pf_corr" checked={pForm.correcta===oi} onChange={function(){setPForm(Object.assign({},pForm,{correcta:oi}));}} style={{accentColor:C.green}} title="Marcar como correcta"/>
              <input value={op} onChange={function(e){setOpc(oi,e.target.value);}} placeholder={"Opción "+(oi+1)+(oi===pForm.correcta?" (correcta)":"")} style={{flex:1,padding:"6px 10px",border:`1px solid ${oi===pForm.correcta?C.green:C.border}`,borderRadius:7,fontSize:13,boxSizing:"border-box"}}/>
              {pForm.opciones.length>2&&<button onClick={function(){setPForm(function(p){return Object.assign({},p,{opciones:p.opciones.filter(function(_,j){return j!==oi;}),correcta:0});});}} style={{border:"none",background:"transparent",color:C.danger,cursor:"pointer"}}>✕</button>}
            </div>;})}
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button onClick={function(){setPForm(function(p){return Object.assign({},p,{opciones:p.opciones.concat([""])});});}} style={{padding:"5px 12px",border:`1px solid ${C.border}`,borderRadius:6,background:C.white,cursor:"pointer",fontSize:12,color:C.muted}}>+ opción</button>
              <button onClick={addPreg} style={{padding:"5px 14px",border:`1px solid ${C.green}`,borderRadius:6,background:`${C.green}12`,cursor:"pointer",fontSize:12,color:C.green,fontWeight:600}}>+ Agregar pregunta</button>
            </div>
          </div>
          {preguntas.length>0&&<div style={{marginTop:8,fontSize:12,color:C.muted,display:"flex",alignItems:"center",gap:8}}>Nota mínima para aprobar (0-10): <input type="number" min="0" max="10" value={notaMin} onChange={function(e){setNotaMin(e.target.value);}} style={{width:60,padding:"5px 8px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13}}/></div>}
        </div>

        {destino==="refuerzo"
          ?<div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:6,fontWeight:600}}>4 · Asignar a gestores</label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",maxHeight:160,overflowY:"auto"}}>
              {(gestores||[]).map(function(g){var on=asig.indexOf(g.id)>=0;return <label key={g.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",padding:"5px 12px",borderRadius:20,border:`1px solid ${on?C.green:C.border}`,background:on?C.pale:C.white}}><input type="checkbox" checked={on} onChange={function(){toggleAsig(g.id);}} style={{accentColor:C.green}}/>{g.name}</label>;})}
              {!(gestores||[]).length&&<span style={{fontSize:12,color:C.muted}}>No hay gestores cargados.</span>}
            </div>
          </div>
          :<div style={{marginBottom:16,fontSize:12,color:C.muted,background:C.bg,borderRadius:10,padding:"10px 14px"}}>Este curso lo van a ver <strong>todos los gestores nuevos</strong> automáticamente. No hace falta asignarlo.</div>}

        {err&&<div style={{background:`${C.danger}12`,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"8px 12px",fontSize:12,color:C.danger,marginBottom:12}}>{err}</div>}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button disabled={subiendo} onClick={function(){setModal(false);}} style={{padding:"9px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button disabled={subiendo} onClick={guardar} style={{padding:"9px 22px",background:subiendo?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:subiendo?"not-allowed":"pointer",fontSize:13,fontWeight:700}}>{subiendo?"Guardando…":"Crear curso"}</button>
        </div>
      </div>
    </div>}
  </div>;
}


</script>
<script type="text/babel">

// GESTOR (empleado actual): solo sus llamadas + su capacitación (cartera + refuerzo asignado).
const navG=[
  {id:"calidadg",    label:"Mis llamadas",     icon:"🎯"},
  {id:"capacitg",    label:"Capacitación",     icon:"🎓"},
];
// GESTOR NUEVO (empleado nuevo): su inducción + sus evaluaciones asignadas. Nada más.
const navI=[
  {id:"capacitg",label:"Mi capacitación", icon:"🎓"},
];
const navS=[
  {id:"s_auditoria",  label:"Audios para auditorías externas",icon:"🎧"},
  {id:"s_calidad_uni",label:"Calidad de gestión",         icon:"🎯"},
  {id:"s_llamadas",   label:"Llamadas",                   icon:"📋"},
  {id:"s_prod",       label:"Productividad",              icon:"📞"},
  {id:"s_recupero",   label:"Recupero",                   icon:"💹"},
  {id:"s_capac",      label:"Capacitación",               icon:"🎓"},
  {id:"s_tipif",      label:"Tipificaciones (qué se analiza)",icon:"🏷️"},
  {id:"cfg_group",    label:"Configuración",              icon:"⚙️", sub:[
    {id:"configsys",  label:"General",                    icon:"⚙️"},
    {id:"s_logueos",  label:"Logueos",                    icon:"🔐"},
    {id:"agentesia",  label:"Agentes IA Speech Analytics",icon:"🤖"},
    {id:"admingest",  label:"Administración de gestores", icon:"👥"},
    {id:"configmsg",  label:"Configuración de mensajes",  icon:"💬"},
    {id:"apineotel",  label:"Conexión Neotel",            icon:"📡"},
  ]},
];

function SVTipificaciones({setActive}={}){
  // Abrir las llamadas de una tipificación en la pestaña Llamadas (para escuchar y verificar si estuvo bien marcada).
  var verLlamadasDe=function(tip){ window._verTipif=tip; if(setActive)setActive("s_llamadas"); };
  const [subs,setSubs]=useState(null);        // [{tipif, descartarAuto}]
  const [reglas,setReglas]=useState({});       // {TIPIF_MAYUS: "descartar"|"analizar"}
  const [modo,setModo]=useState("blacklist");  // "whitelist" = solo se analiza lo marcado (pago)
  const [q,setQ]=useState(""),[filtro,setFiltro]=useState("todas");
  const [msg,setMsg]=useState(""),[saving,setSaving]=useState(false);
  const [abiertas,setAbiertas]=useState({}); // carteras desplegadas (por defecto CERRADAS; tocás la cartera y se abre)

  useEffect(function(){
    if(window.db)window.db.collection("configuracion").doc("tipificaciones").get().then(function(d){ if(d.exists){ if(d.data().reglas)setReglas(d.data().reglas); setModo(d.data().modo||"blacklist"); } }).catch(function(){});
    fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"subcategorias"})})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.error)setMsg("Error: "+d.error); setSubs((d&&d.tipificaciones)||[]); })
      .catch(function(e){ setMsg("No se pudieron traer las tipificaciones (¿VPN?): "+e.message); setSubs([]); });
  },[]);

  const _estado=function(s){ var r=reglaDe(reglas,s.tipif); if(r)return r; return modo==="whitelist"?"descartar":(s.descartarAuto?"descartar":"analizar"); };
  const _manual=function(s){ return !!reglaDe(reglas,s.tipif); };
  const guardar=async function(nr){ setReglas(nr); if(window.db){ setSaving(true); try{ await window.db.collection("configuracion").doc("tipificaciones").set({reglas:nr},{merge:true}); }catch(e){ setMsg("Error guardando: "+e.message); } setSaving(false); } };
  const toggle=function(s){ var k=s.tipif.toUpperCase().trim(); var nr=Object.assign({},reglas); nr[k]=_estado(s)==="descartar"?"analizar":"descartar"; guardar(nr); };
  const resetAuto=function(s){ var k=s.tipif.toUpperCase().trim(); var nr=Object.assign({},reglas); delete nr[k]; guardar(nr); };

  if(subs===null) return <div><SecTitle icon="🏷️">Tipificaciones — qué se analiza</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando tipificaciones del CRM…</div></Card></div>;

  var lista=subs.filter(function(s){ if(q&&s.tipif.toLowerCase().indexOf(q.toLowerCase())<0)return false; var e=_estado(s); if(filtro==="analizar"&&e!=="analizar")return false; if(filtro==="descartar"&&e!=="descartar")return false; return true; });
  var nAn=subs.filter(function(s){return _estado(s)==="analizar";}).length, nDesc=subs.length-nAn;
  // Agrupar por cartera (una tipificación puede estar en varias carteras → aparece en cada una).
  var porCart={};
  lista.forEach(function(s){ var cs=(s.carteras&&s.carteras.length)?s.carteras:["(sin cartera)"]; cs.forEach(function(c){ (porCart[c]=porCart[c]||[]).push(s); }); });
  var cartKeys=Object.keys(porCart).sort();

  return <div>
    <SecTitle icon="🏷️">Tipificaciones — qué se analiza</SecTitle>
    <div style={{color:C.muted,fontSize:14,marginBottom:14}}>Elegí qué tipificaciones se <strong style={{color:C.green}}>analizan</strong> con IA y cuáles <strong style={{color:C.danger}}>no</strong> (se descartan → no gastan Whisper). El "⚙️ auto" es la sugerencia del sistema; tu elección manda. Aplica a Llamadas, al masivo y al análisis automático.</div>
    {modo==="whitelist"&&<div style={{background:C.pale,border:`1px solid ${C.paleB}`,color:C.text,fontSize:13,borderRadius:10,padding:"10px 14px",marginBottom:14,lineHeight:1.6}}>🎯 <strong>Modo lista blanca (solo pago)</strong>: por defecto <strong>NO se analiza nada</strong>; se analizan <strong style={{color:C.green}}>solo las que marques 🤖</strong>. Ya vienen marcadas las de pago — revisalas acá: sacá las que no correspondan (toque el interruptor) o agregá alguna que falte.</div>}
    {msg&&<div style={{background:"#fff3d6",color:"#a5730a",padding:"9px 13px",borderRadius:9,marginBottom:14,fontSize:13}}>{msg}</div>}
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <Stat label="Se analizan" value={nAn} color={C.green} icon="🤖"/>
      <Stat label="Se descartan" value={nDesc} color={C.danger} icon="🚫"/>
      <Stat label="Total" value={subs.length} color={C.info} icon="🏷️"/>
    </div>
    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:14}}>
      <input value={q} onChange={function(e){setQ(e.target.value);}} placeholder="🔎 Buscar tipificación…" style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:20,fontSize:13,minWidth:230}}/>
      {[["todas","Todas"],["analizar","Se analizan"],["descartar","Se descartan"]].map(function(f){return <button key={f[0]} onClick={function(){setFiltro(f[0]);}} style={{padding:"7px 14px",borderRadius:20,border:`2px solid ${filtro===f[0]?C.green:C.border}`,background:filtro===f[0]?C.green:C.white,color:filtro===f[0]?C.white:C.text,cursor:"pointer",fontSize:13,fontWeight:filtro===f[0]?700:400}}>{f[1]}</button>;})}
      {saving&&<span style={{fontSize:12,color:C.muted}}>Guardando…</span>}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {cartKeys.length===0&&<Card mb={0}><div style={{padding:24,textAlign:"center",color:C.muted,fontSize:13}}>Sin tipificaciones para el filtro.</div></Card>}
      {cartKeys.map(function(cart){
        var arr=porCart[cart]; var open=!!abiertas[cart];
        var anC=arr.filter(function(s){return _estado(s)==="analizar";}).length;
        return <Card key={cart} mb={0} style={{padding:0,overflow:"hidden"}}>
          <div onClick={function(){setAbiertas(function(p){var n=Object.assign({},p);n[cart]=!open;return n;});}} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",cursor:"pointer",background:open?C.pale:C.white}}>
            <span style={{fontSize:12,color:C.muted,width:12}}>{open?"▾":"▸"}</span>
            <span style={{fontSize:15,fontWeight:800,color:C.text}}>🏦 {cart}</span>
            <span style={{fontSize:11,color:C.muted}}>{arr.length} {arr.length===1?"tipificación":"tipificaciones"}</span>
            <span style={{marginLeft:"auto",fontSize:12,fontWeight:700,color:C.green}} title="Se analizan">🤖 {anC}</span>
            <span style={{fontSize:12,fontWeight:700,color:C.danger}} title="Se descartan">🚫 {arr.length-anC}</span>
          </div>
          {open&&arr.map(function(s){var e=_estado(s);var man=_manual(s);var desc=e==="descartar";
            return <div key={cart+"|"+s.tipif} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:`1px solid ${C.border}`}}>
              <div style={{flex:1,minWidth:0}}>
                <span style={{fontWeight:600,fontSize:14}}>{s.tipif}</span>
                {!man&&<span style={{fontSize:11,color:C.muted,marginLeft:8}}>⚙️ auto</span>}
                {man&&<span style={{fontSize:11,color:C.info,marginLeft:8}}>✎ manual · <span onClick={function(){resetAuto(s);}} style={{cursor:"pointer",textDecoration:"underline"}}>volver a auto</span></span>}
              </div>
              <button onClick={function(){verLlamadasDe(s.tipif);}} title="Ver las llamadas de esta tipificación para escuchar y verificar si estuvo bien marcada" style={{padding:"4px 10px",border:`1px solid ${C.info}`,borderRadius:8,background:"#fff",color:C.info,cursor:"pointer",fontSize:11,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>🎧 Ver llamadas</button>
              <span style={{fontSize:12,fontWeight:700,color:desc?C.danger:C.green,whiteSpace:"nowrap"}}>{desc?"🚫 No se analiza":"🤖 Se analiza"}</span>
              <div onClick={function(){toggle(s);}} title="Cambiar" style={{width:44,height:24,borderRadius:12,background:desc?"#c3ccc0":C.green,position:"relative",cursor:"pointer",flexShrink:0,transition:"background .2s"}}>
                <div style={{width:20,height:20,borderRadius:"50%",background:"#fff",position:"absolute",top:2,left:desc?2:22,transition:"left .2s",boxShadow:"0 1px 2px rgba(0,0,0,0.3)"}}/>
              </div>
            </div>;
          })}
        </Card>;
      })}
    </div>
  </div>;
}

function Sidebar({user,active,setActive,onLogout,objetivo,setObjetivo}){
  const nav=user.role==="supervisor"?navS:user.role==="ingreso"?navI:navG;
  const defSub=null;   // ningún grupo del menú abierto por defecto (Configuración arranca cerrado)
  const [openSub,setOpenSub]=useState(defSub);
  const [editObj,setEditObj]=useState(false);
  const [tmpObj,setTmpObj]=useState(String(objetivo));
  const isA=id=>active===id;
  const hasSub=item=>item.sub&&item.sub.some(s=>isA(s.id));
  const objLabel=o=>o>=90?"Excelente":o>=80?"Muy bueno":o>=70?"Bueno":"Regular";
  const objColor=o=>o>=90?C.green:o>=80?C.light:o>=70?C.warn:C.danger;
  const saveObj=()=>{const v=parseInt(tmpObj);if(!isNaN(v)&&v>=0&&v<=100){setObjetivo(v);}setEditObj(false);};

  return <div style={{width:250,minHeight:"100vh",background:C.dark,display:"flex",flexDirection:"column",flexShrink:0}}>
    <div style={{padding:"22px 18px 0",borderBottom:"1px solid rgba(255,255,255,0.1)"}}>
      <img src="https://dasaargentina.com/wp-content/uploads/2022/06/Logo-Dasa.png" alt="DASA" style={{height:34,objectFit:"contain",filter:"brightness(0) invert(1)",display:"block"}}/>
      <div style={{fontSize:10,color:"rgba(112,198,87,0.6)",marginTop:6,letterSpacing:2,textTransform:"uppercase",marginBottom:16}}>{user.role==="supervisor"?"Supervisor":user.role==="ingreso"?"Gestor nuevo":"Centro de Calidad"}</div>
      
    </div>
    <div style={{padding:"8px",flex:1,overflowY:"auto"}}>
      {nav.map(item=>{
        const open=openSub===item.id||hasSub(item),pa=isA(item.id)||hasSub(item);
        return <div key={item.id}>
          <button onClick={()=>item.sub?setOpenSub(open&&!hasSub(item)?null:item.id):setActive(item.id)}
            style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"9px 10px",borderRadius:9,border:"none",cursor:"pointer",marginBottom:2,textAlign:"left",background:pa&&!item.sub?C.green:pa?"rgba(67,117,64,0.28)":"transparent",color:pa?"#fff":"rgba(168,200,160,0.9)",fontWeight:pa?700:400,fontSize:12,justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>{item.icon}</span><span style={{lineHeight:1.3}}>{item.label}</span></div>
            {item.sub&&<span style={{fontSize:10,opacity:.7}}>{open?"▾":"▸"}</span>}
          </button>
          {item.sub&&open&&<div style={{marginLeft:12,marginBottom:2}}>
            {item.sub.map(s=><button key={s.id} onClick={()=>setActive(s.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:6,padding:"7px 10px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:1,textAlign:"left",background:isA(s.id)?C.green:"transparent",color:isA(s.id)?"#fff":"rgba(168,200,160,0.75)",fontWeight:isA(s.id)?600:400,fontSize:11}}><span style={{opacity:.5}}>└</span>{s.label}</button>)}
          </div>}
        </div>;
      })}
    </div>
    <div style={{padding:14,borderTop:"1px solid rgba(255,255,255,0.1)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:C.green,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:13,fontWeight:700,color:C.white}}>{user.name.split(" ").map(n=>n[0]).join("").slice(0,2)}</div>
        <div><div style={{fontSize:13,fontWeight:600,color:C.white}}>{user.name}</div><div style={{fontSize:11,color:"rgba(168,200,160,0.8)"}}>{user.legajo}</div></div>
      </div>
      <button onClick={onLogout} style={{width:"100%",padding:"6px 0",background:"transparent",border:"1px solid rgba(255,255,255,0.2)",borderRadius:7,color:"rgba(168,200,160,0.8)",cursor:"pointer",fontSize:12}}>Cerrar sesión</button>
    </div>
  </div>;
}

function Login({onLogin}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState("");
  const [loginLoading,setLoginLoading]=useState(false);
  const go=async()=>{
    setLoginLoading(true); setErr("");
    if(window.firebaseConfigured){
      try{
        // Acepta usuario corto (juan.garcia) o email completo
        const email=u.includes("@")?u.trim():`${u.trim()}@dasaargentina.com`;
        const cred=await window.auth.signInWithEmailAndPassword(email,p);
        const doc=await window.db.collection("usuarios").doc(cred.user.uid).get();
        if(doc.exists){ onLogin({...doc.data(),uid:cred.user.uid,email:cred.user.email}); }
        else { setErr("Usuario sin perfil en el sistema. Contactá al administrador."); await window.auth.signOut(); }
      }catch(e){
        setErr(e.code==="auth/wrong-password"||e.code==="auth/user-not-found"
          ?"Usuario o contraseña incorrectos."
          :"Error de conexión. Intentá nuevamente.");
      }
    } else {
      // Modo demo (sin Firebase configurado)
      const f=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?USERS.find(x=>x.user===u.trim()):null;   // demo: solo en localhost
      f?(setErr(""),onLogin(f)):setErr("No se pudo conectar con el login. Recargá la página.");
    }
    setLoginLoading(false);
  };
  return <div style={{minHeight:"100vh",background:C.dark,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{width:380,background:C.white,borderRadius:20,overflow:"hidden",boxShadow:"0 16px 48px rgba(0,0,0,0.4)"}}>
      <div style={{background:C.green,padding:"30px 32px 26px",textAlign:"center"}}>
        <img src="https://dasaargentina.com/wp-content/uploads/2022/06/Logo-Dasa.png" alt="DASA" style={{height:42,objectFit:"contain",filter:"brightness(0) invert(1)"}}/>
        <div style={{color:"rgba(255,255,255,0.7)",fontSize:13,marginTop:8,letterSpacing:2}}>CALIDAD · CAPACITACIÓN</div>
      </div>
      <div style={{padding:"26px 30px 30px"}}>
        <div style={{fontSize:18,fontWeight:700,color:C.text,marginBottom:20}}>Ingresá a tu cuenta</div>
        <label style={{fontSize:13,color:C.muted,display:"block",marginBottom:5}}>Usuario</label>
        <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="ej: juan.garcia" style={{width:"100%",padding:"10px 13px",border:`1px solid ${err?C.danger:C.border}`,borderRadius:10,fontSize:14,color:C.text,outline:"none",marginBottom:13}}/>
        <label style={{fontSize:13,color:C.muted,display:"block",marginBottom:5}}>Contraseña</label>
        <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••" style={{width:"100%",padding:"10px 13px",border:`1px solid ${err?C.danger:C.border}`,borderRadius:10,fontSize:14,color:C.text,outline:"none",marginBottom:err?12:18}}/>
        {err&&<div style={{background:"#fce8e8",border:`1px solid ${C.danger}44`,borderRadius:8,padding:"8px 12px",fontSize:13,color:C.danger,marginBottom:14}}>{err}</div>}
        <button onClick={go} disabled={loginLoading} style={{width:"100%",padding:"12px",background:loginLoading?C.muted:C.green,color:C.white,border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:loginLoading?"not-allowed":"pointer",transition:"background .2s"}}>{loginLoading?"Verificando…":"Ingresar"}</button>
        {!window.firebaseConfigured&&<div style={{marginTop:18,padding:"11px 14px",background:"#fff8e1",border:`1px solid ${C.warn}44`,borderRadius:10,fontSize:12,color:C.muted,lineHeight:2}}>
          <strong style={{color:C.warn}}>⚠️ Modo demo</strong> (Firebase no configurado)<br/>
          👷 Gestor: <code style={{background:"#ddd",padding:"1px 5px",borderRadius:3}}>juan.garcia</code> / <code style={{background:"#ddd",padding:"1px 5px",borderRadius:3}}>1234</code><br/>
          🎯 Supervisor: <code style={{background:"#ddd",padding:"1px 5px",borderRadius:3}}>vanesa.suarez</code> / <code style={{background:"#ddd",padding:"1px 5px",borderRadius:3}}>1234</code>
        </div>}
        {window.firebaseConfigured&&<div style={{marginTop:18,padding:"8px 14px",background:`${C.green}10`,border:`1px solid ${C.green}33`,borderRadius:10,fontSize:12,color:C.green,fontWeight:500}}>
          🔒 Autenticación segura activa
        </div>}
      </div>
    </div>
  </div>;
}

// Capacitación integrada: embebe capacitacion.html (sistema nuevo, Curso→Material→Examen). Misma sesión (mismo origen).
function CapacEmbed(){
  return <iframe src="/capacitacion.html" title="Capacitación" style={{width:"100%",height:"calc(100vh - 64px)",border:"none",borderRadius:10,display:"block",background:C.bg}}/>;
}

function Dashboard({user,onLogout}){
  const [active,setActive]=useState(user.role==="supervisor"?"s_calidad_uni":user.role==="ingreso"?"capacitg":"calidadg");
  const [objetivo,setObjetivoState]=useState(85);
  // Objetivo persistido en Firestore (configuracion/objetivo) — mismo para todos los supervisores.
  useEffect(function(){ if(window.db){ window.db.collection("configuracion").doc("objetivo").get().then(function(d){ if(d.exists&&typeof d.data().score==="number") setObjetivoState(d.data().score); }).catch(function(){}); } },[]);
  const setObjetivo=function(v){ setObjetivoState(v); if(window.db){ window.db.collection("configuracion").doc("objetivo").set({score:v}).catch(function(){}); } };
  const inicio=user.role==="supervisor"?"s_calidad_uni":user.role==="ingreso"?"capacitg":"calidadg";
  // Operador seleccionado en Calidad de gestión (subido acá para que el botón Inicio pueda volver a la lista).
  const [selGCal,setSelGCal]=useState(null);
  useEffect(function(){ if(active!=="s_calidad_uni"&&selGCal) setSelGCal(null); },[active]);
  const render=()=>{
    if(user.role==="ingreso"){
      // Gestor nuevo: su capacitación (sistema nuevo embebido). Nada más.
      return <CapacEmbed/>;
    }
    if(user.role==="gestor"){
      if(active==="capacitg")    return <CapacEmbed/>;
      // por defecto y cualquier id ajeno → Mis llamadas (lockdown)
      return <VCalidadGestion user={user}/>;
    }
    if(user.role==="supervisor"){
      if(active==="s_evolucion")   return <SVEvolucionCalidad/>;
      if(active==="s_auditoria")   return <SVAuditoriaExterna user={user}/>;
      if(active==="s_calidad_uni") return <SVCalidadUnificada objetivo={objetivo} setObjetivo={setObjetivo} selG={selGCal} setSelG={setSelGCal}/>;
      if(active==="estadisticas")  return <EstadisticasIA/>;
      if(active==="s_llamadas")    return <SVLlamadas user={user}/>;
      if(active==="s_prod")        return <SVProductividad/>;
      if(active==="s_recupero")    return <SVRecupero/>;
      if(active==="s_seguimiento") return <VSeguimientoCap/>;
      if(active==="s_ruta")        return <VRutaInicial isSuper/>;
      if(active==="s_cartera")     return <VPorCartera isSuper/>;
      if(active==="s_logueos")     return <SVLogueos/>;
      if(active==="agentesia")     return <SVAgentesIA/>;
      if(active==="configsys")     return <SVConfiguracion/>;
      if(active==="admingest")     return <SVAdminGestores/>;
      if(active==="configmsg")     return <SVConfigMensajes/>;
      if(active==="apineotel")     return <SVApiNeotel/>;
      if(active==="s_tipif")       return <SVTipificaciones setActive={setActive}/>;
      if(active==="s_capac")       return <CapacEmbed/>;
    }
  };
  return <div style={{display:"flex",minHeight:"100vh",background:C.bg}}>
    {(active!==inicio||selGCal)&&<button onClick={()=>{setSelGCal(null);setActive(inicio);}} title="Volver al inicio"
      style={{position:"fixed",top:14,left:"calc(50% + 125px)",transform:"translateX(-50%)",zIndex:900,display:"flex",alignItems:"center",gap:7,padding:"9px 20px",background:C.green,color:"#fff",border:"none",borderRadius:24,cursor:"pointer",fontSize:13,fontWeight:700,boxShadow:"0 4px 16px rgba(30,51,32,0.30)"}}>
      🏠 Inicio
    </button>}
    <Sidebar user={user} active={active} setActive={setActive} onLogout={onLogout} objetivo={objetivo} setObjetivo={setObjetivo}/>
    <div style={{flex:1,padding:28,overflowY:"auto",minWidth:0}}>
      <div style={{maxWidth:900}}>{render()}</div>
    </div>
    {user.role==="supervisor"&&<BatchBanner/>}
  </div>;
}

function App(){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    if(window.firebaseConfigured){
      // Firebase Auth: detecta sesión activa automáticamente
      const unsub=window.auth.onAuthStateChanged(async firebaseUser=>{
        if(firebaseUser){
          try{
            const doc=await window.db.collection("usuarios").doc(firebaseUser.uid).get();
            if(doc.exists){
              setUser({...doc.data(),uid:firebaseUser.uid,email:firebaseUser.email});
            } else {
              // Usuario en Auth pero sin perfil en Firestore — crear perfil básico
              console.warn("[DASA] Usuario sin perfil en Firestore:", firebaseUser.email);
              await window.auth.signOut();
              setUser(null);
            }
          }catch(e){ console.error("[DASA] Error leyendo perfil:", e); setUser(null); }
        } else { setUser(null); }
        setLoading(false);
      });
      return ()=>unsub();
    } else {
      // Modo demo: sin Firebase
      setLoading(false);
    }
  },[]);

  const handleLogout=async()=>{
    if(window.firebaseConfigured){ await window.auth.signOut(); }
    setUser(null);
  };

  if(loading) return <div style={{minHeight:"100vh",background:"#1e3320",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center",color:"rgba(255,255,255,0.7)"}}>
      <img src="https://dasaargentina.com/wp-content/uploads/2022/06/Logo-Dasa.png" alt="DASA" style={{height:44,filter:"brightness(0) invert(1)",marginBottom:20,display:"block",margin:"0 auto 20px"}}/>
      <div style={{fontSize:14,letterSpacing:1}}>Cargando…</div>
    </div>
  </div>;

  return user
    ?<Dashboard user={user} onLogout={handleLogout}/>
    :<Login onLogin={setUser}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>

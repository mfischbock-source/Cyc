<script type="text/babel">

// ── EVOLUCIÓN MENSUAL DE CALIDAD POR CLIENTE ─────────────────────────────

function SVEvolucionCalidad(){
  const COLORS=["#437540","#0033a0","#ec0000","#006633","#c8960c","#2080c8","#7b2d8b","#e8a020"];
  const [clientes,setClientes]=useState(null);          // carteras guardadas (o null = derivar de los análisis)
  const [externos,setExternos]=useState({});            // "<cliId>||<YYYY-MM>" -> score externo (manual)
  const [analisisAll,setAnalisisAll]=useState(null);    // todos los análisis (para el interno real)
  const [gestMap,setGestMap]=useState({});              // neotelId -> banco asignado (Administración)
  const [selId,setSelId]=useState(null);
  const [modal,setModal]=useState(false);
  const [nuevoReg,setNuevoReg]=useState({mesKey:"",externo:""});
  const [addClienteModal,setAddClienteModal]=useState(false);
  const [nuevoCliente,setNuevoCliente]=useState({nombre:"",color:"#437540"});
  const [guardando,setGuardando]=useState(false);

  // Carga: TODOS los análisis (interno real) + config de carteras/externos (manual).
  useEffect(function(){
    if(!window.db){setClientes([]);setAnalisisAll([]);return;}
    window.db.collection("analisis_llamadas").get()
      .then(function(snap){setAnalisisAll(snap.docs.map(function(d){return d.data();}));})
      .catch(function(){setAnalisisAll([]);});
    window.db.collection("configuracion").doc("evolucion").get()
      .then(function(doc){var v=doc.exists?doc.data():{};setExternos(v.externos||{});setClientes(v.clientes||null);})
      .catch(function(){setClientes(null);});
    window.db.collection("usuarios").get()
      .then(function(snap){var m={};snap.docs.forEach(function(d){var u=d.data();if(u.neotelId&&u.cliente)m[String(u.neotelId).trim()]=u.cliente;});setGestMap(m);})
      .catch(function(){});
  },[]);

  const _MES=["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const _label=function(k){return (_MES[parseInt(k.slice(5,7),10)]||k.slice(5,7))+" "+k.slice(0,4);};
  const _match=function(campana,nombre){if(!campana||!nombre)return false;var a=String(campana).toLowerCase(),b=String(nombre).toLowerCase();return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0;};
  // Cliente del análisis: el banco asignado al operador (Administración) o, si no, lo guardado.
  const _cliDe=function(d){return gestMap[String(d.neotelId||"").trim()]||d.cliente;};

  // Carteras: las guardadas, o derivadas del banco asignado a los operadores de los análisis.
  const carteras=((clientes&&clientes.length)?clientes:Array.from(new Set((analisisAll||[]).map(_cliDe)
      .filter(function(c){return c&&c!=="—"&&c!=="General";}))).map(function(n,i){return {id:"c"+i,nombre:n,color:COLORS[i%COLORS.length]};}))
      .filter(function(c){return c&&c.nombre&&!/campa/i.test(c.nombre);});   // saca "CAMPAÑA"/"CAMPAÃ‘A" (basura)
  const selCliente=carteras.find(function(c){return c.id===selId;})||carteras[0]||null;

  // interno REAL por mes (promedio de scores IA de esa cartera) + externo manual superpuesto.
  const _curK=new Date().toISOString().slice(0,7);
  const regs=(function(){
    if(!selCliente) return [];
    var byM={};
    (analisisAll||[]).forEach(function(d){
      if(d.es_valida===false||typeof d.score!=="number")return;
      if(!_match(_cliDe(d),selCliente.nombre))return;
      var f=d.fecha||"";if(f.length<7)return;var k=f.slice(0,7);
      (byM[k]=byM[k]||[]).push(d.score);
    });
    return Object.keys(byM).sort().map(function(k){
      var arr=byM[k];var interno=Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length);
      var ext=externos[selCliente.id+"||"+k];
      return {mesKey:k,mes:_label(k),interno:interno,externo:(typeof ext==="number"?ext:null),enCurso:k===_curK,n:arr.length};
    });
  })();
  const conExterno=regs.filter(function(r){return r.externo!==null;});
  const diffPromedio=conExterno.length?Math.round(conExterno.reduce(function(a,r){return a+(r.interno-r.externo);},0)/conExterno.length):null;
  const cargando=analisisAll===null;

  const persistir=function(lista,exts){
    if(!window.db)return Promise.resolve();
    return window.db.collection("configuracion").doc("evolucion").set({clientes:lista,externos:exts});
  };
  const addRegistro=async function(){
    if(!nuevoReg.mesKey||nuevoReg.externo===""||!selCliente)return;
    var nx=Object.assign({},externos);nx[selCliente.id+"||"+nuevoReg.mesKey]=parseInt(nuevoReg.externo,10);
    setGuardando(true);
    try{await persistir(carteras,nx);setExternos(nx);if(!clientes)setClientes(carteras);}catch(e){console.error("[DASA] evolución:",e);}
    setGuardando(false);setModal(false);setNuevoReg({mesKey:"",externo:""});
  };
  const addCliente=async function(){
    if(!nuevoCliente.nombre)return;
    var nc={id:"c"+Date.now(),nombre:nuevoCliente.nombre,color:nuevoCliente.color};
    var lista=carteras.concat([nc]);
    setGuardando(true);
    try{await persistir(lista,externos);setClientes(lista);setSelId(nc.id);}catch(e){console.error("[DASA] evolución:",e);}
    setGuardando(false);setAddClienteModal(false);setNuevoCliente({nombre:"",color:"#437540"});
  };

  // Mini SVG chart for evolution
  const ChartEvo=({data,color})=>{
    if(data.length<2)return <div style={{padding:"20px",textAlign:"center",color:C.muted,fontSize:13}}>Se necesitan al menos 2 registros para ver el gráfico.</div>;
    const W=560,H=160,pL=36,pB=30,pT=20,pR=12;
    const iH=H-pB-pT,iW=W-pL-pR;
    const allVals=[...data.map(d=>d.interno),...data.filter(d=>d.externo).map(d=>d.externo)];
    const minV=Math.max(0,Math.min(...allVals)-5),maxV=Math.min(100,Math.max(...allVals)+5);
    const sy=v=>pT+iH-((v-minV)/(maxV-minV))*iH;
    const sx=i=>pL+i*(iW/(data.length-1));
    const intPts=data.map((d,i)=>`${sx(i)},${sy(d.interno)}`).join(" ");
    const extPts=data.filter(d=>d.externo).map((d,i)=>{
      const idx=data.findIndex(r=>r.mes===d.mes);
      return `${sx(idx)},${sy(d.externo)}`;
    }).join(" ");
    return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}>
      {/* Grid */}
      {[minV,Math.round((minV+maxV)/2),maxV].map(v=><g key={v}>
        <line x1={pL} y1={sy(v)} x2={W-pR} y2={sy(v)} stroke={C.border} strokeDasharray="3 2"/>
        <text x={pL-4} y={sy(v)+4} textAnchor="end" fontSize="9" fill={C.muted}>{v}</text>
      </g>)}
      {/* Externo line */}
      {extPts&&<polyline points={extPts} fill="none" stroke={C.warn} strokeWidth="2" strokeDasharray="6 3"/>}
      {/* Interno line */}
      <polyline points={intPts} fill="none" stroke={color||C.green} strokeWidth="2.5"/>
      {/* Points + labels */}
      {data.map((d,i)=><g key={i}>
        <circle cx={sx(i)} cy={sy(d.interno)} r="4" fill={color||C.green}/>
        <text x={sx(i)} y={sy(d.interno)-8} textAnchor="middle" fontSize="10" fontWeight="700" fill={color||C.green}>{d.interno}</text>
        {d.externo&&<>
          <circle cx={sx(i)} cy={sy(d.externo)} r="3.5" fill={C.warn}/>
          <text x={sx(i)} y={sy(d.externo)+16} textAnchor="middle" fontSize="10" fill={C.warn}>{d.externo}</text>
        </>}
        <text x={sx(i)} y={H-pB+13} textAnchor="middle" fontSize="9" fill={C.muted}>{d.mes.slice(0,3)}</text>
      </g>)}
      {/* Legend */}
      <circle cx={pL+8} cy={H-5} r="4" fill={color||C.green}/>
      <text x={pL+16} y={H-2} fontSize="9" fill={C.muted}>Score interno</text>
      {extPts&&<><line x1={pL+100} y1={H-5} x2={pL+116} y2={H-5} stroke={C.warn} strokeWidth="2" strokeDasharray="4 2"/>
      <text x={pL+120} y={H-2} fontSize="9" fill={C.muted}>Score externo (cliente)</text></>}
    </svg>;
  };

  return <div>
    <SecTitle icon="📈">Evolución mensual de Calidad por cliente</SecTitle>
    <div style={{fontSize:13,color:C.muted,marginBottom:20,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.7}}>
      El <strong>score interno</strong> se calcula solo: es el promedio de los análisis IA de las llamadas de esa cartera, mes a mes. El <strong>score externo</strong> (la nota que envía el cliente) se carga a mano y se compara contra el interno.
    </div>

    {cargando&&<div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando análisis…</div>}
    {!cargando&&carteras.length===0&&<div style={{background:C.bg,border:`1px dashed ${C.border}`,borderRadius:12,padding:30,textAlign:"center",color:C.muted,fontSize:13}}>Todavía no hay llamadas analizadas con cartera asignada. Analizá audios y/o agregá una cartera para empezar.</div>}

    {/* SELECTOR DE CLIENTES */}
    <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
      {carteras.map(cl=>(
        <button key={cl.id} onClick={()=>setSelId(cl.id)}
          style={{padding:"8px 16px",borderRadius:20,border:`2px solid ${selCliente?.id===cl.id?cl.color:C.border}`,
            background:selCliente?.id===cl.id?cl.color+"18":C.white,
            color:selCliente?.id===cl.id?cl.color:C.text,
            cursor:"pointer",fontSize:13,fontWeight:selCliente?.id===cl.id?700:400,
            display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:cl.color,flexShrink:0}}/>
          {cl.nombre}
        </button>
      ))}
      <button onClick={()=>setAddClienteModal(true)}
        style={{padding:"7px 14px",borderRadius:20,border:`1px dashed ${C.border}`,background:C.white,color:C.muted,cursor:"pointer",fontSize:13}}>
        + Agregar cliente
      </button>
    </div>

    {selCliente&&<div>
      {/* HEADER CLIENTE + ACCIONES */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:14,height:14,borderRadius:"50%",background:selCliente.color}}/>
          <div style={{fontSize:17,fontWeight:800,color:C.text}}>{selCliente.nombre}</div>
        </div>
        <button onClick={()=>setModal(true)} disabled={regs.length===0}
          style={{padding:"8px 18px",background:regs.length===0?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:regs.length===0?"not-allowed":"pointer",fontSize:13,fontWeight:700}}
          title={regs.length===0?"Primero tiene que haber llamadas analizadas de esta cartera":""}>
          + Cargar score externo
        </button>
      </div>

      {/* STATS RÁPIDOS */}
      {regs.length>0&&<div style={{display:"flex",gap:10,marginBottom:20}}>
        <Stat label="Meses registrados" value={regs.length} color={C.info} icon="📅"/>
        <Stat label="Último score interno" value={regs[regs.length-1].interno} sub={regs[regs.length-1].mes} color={scoreColor(regs[regs.length-1].interno)} icon="🏢"/>
        {regs[regs.length-2]&&<Stat label="Tendencia" value={regs[regs.length-1].interno>regs[regs.length-2].interno?"▲ Sube":"▼ Baja"} sub={`${Math.abs(regs[regs.length-1].interno-regs[regs.length-2].interno)} pts`} color={regs[regs.length-1].interno>=regs[regs.length-2].interno?C.green:C.danger} icon="📊"/>}
        {diffPromedio!==null&&<Stat label="Dif. interno vs externo" value={diffPromedio>0?`+${diffPromedio}`:String(diffPromedio)} sub="promedio histórico" color={diffPromedio>=0?C.green:C.warn} icon="🔍"/>}
      </div>}

      {/* GRÁFICO */}
      {regs.length>0
        ?<Card>
          <CardTitle>Evolución de scores — {selCliente.nombre}</CardTitle>
          <ChartEvo data={regs} color={selCliente.color}/>
          <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:8,fontSize:12,color:C.muted}}>
            <span>— Score interno DASA</span>
            <span style={{color:C.warn}}>- - Score externo (enviado por cliente)</span>
          </div>
        </Card>
        :<div style={{background:C.bg,border:`1px dashed ${C.border}`,borderRadius:12,padding:"40px",textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:24,marginBottom:8}}>📊</div>
          <div style={{fontSize:14,color:C.muted}}>Sin llamadas analizadas para {selCliente.nombre} todavía.<br/>Analizá audios de esta cartera y el score interno aparece solo, mes a mes.</div>
        </div>
      }

      {/* TABLA DETALLADA */}
      {regs.length>0&&<Card mb={0}>
        <CardTitle>Detalle mensual — {selCliente.nombre}</CardTitle>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
            {["Mes","Score interno","Categoría interna","Score externo","Diferencia","Estado"].map(h=>(
              <th key={h} style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>{[...regs].reverse().map((r,i)=>{
            const diff=r.externo!==null?r.interno-r.externo:null;
            return <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:r.enCurso?C.pale:C.white}}>
              <td style={{padding:"10px",fontWeight:600,color:C.text}}>
                {r.mes}{r.enCurso&&<span style={{marginLeft:6,fontSize:11,background:`${C.green}22`,color:C.green,border:`1px solid ${C.paleB}`,borderRadius:20,padding:"1px 7px"}}>En curso</span>}
              </td>
              <td style={{padding:"10px",fontWeight:800,color:scoreColor(r.interno),fontSize:18}}>{r.interno}</td>
              <td style={{padding:"10px"}}>
                <span style={{background:scoreBg(r.interno),border:`1px solid ${scoreBorder(r.interno)}`,color:scoreColor(r.interno),borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600}}>{scoreLabel(r.interno)}</span>
              </td>
              <td style={{padding:"10px"}}>
                {r.externo!==null
                  ?<span style={{fontWeight:700,color:scoreColor(r.externo),fontSize:16}}>{r.externo}</span>
                  :<span style={{color:C.muted,fontSize:12}}>Pendiente</span>
                }
              </td>
              <td style={{padding:"10px"}}>
                {diff!==null
                  ?<span style={{fontWeight:700,color:diff>=0?C.green:C.warn,fontSize:14}}>{diff>0?`+${diff}`:diff===0?"=":diff} pts</span>
                  :<span style={{color:C.muted,fontSize:12}}>—</span>
                }
              </td>
              <td style={{padding:"10px"}}>
                {r.externo!==null
                  ?<span style={{background:diff>=0?`${C.light}22`:`${C.warn}18`,color:diff>=0?C.green:C.warn,border:`1px solid ${diff>=0?C.paleB:C.warn+"44"}`,borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:600}}>
                    {diff>=0?"✓ Alineado":"△ Diferencia"}
                  </span>
                  :<span style={{background:`${C.muted}15`,color:C.muted,border:`1px solid ${C.border}`,borderRadius:20,padding:"2px 10px",fontSize:12}}>Sin dato externo</span>
                }
              </td>
            </tr>;
          })}</tbody>
        </table>
      </Card>}
    </div>}

    {/* MODAL CARGAR RESULTADO */}
    {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.white,borderRadius:16,padding:28,width:420,maxWidth:"92vw"}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:6}}>📊 Cargar score externo</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:18}}>{selCliente?.nombre} — la nota que envía el cliente</div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Mes</label>
          <select value={nuevoReg.mesKey} onChange={e=>setNuevoReg({...nuevoReg,mesKey:e.target.value})}
            style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
            <option value="">Seleccionar mes…</option>
            {regs.map(r=><option key={r.mesKey} value={r.mesKey}>{r.mes}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Score interno (IA) <span style={{color:C.muted,fontWeight:400}}>auto</span></label>
            <div style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:18,fontWeight:700,textAlign:"center",color:C.green,background:C.bg,boxSizing:"border-box"}}>
              {nuevoReg.mesKey?((regs.find(r=>r.mesKey===nuevoReg.mesKey)||{}).interno):"—"}
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:4,textAlign:"center"}}>calculado de los análisis</div>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Score externo (cliente) <span style={{color:C.danger}}>*</span></label>
            <input type="number" min="0" max="100" value={nuevoReg.externo} onChange={e=>setNuevoReg({...nuevoReg,externo:e.target.value})} placeholder="Ej: 79"
              style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:18,fontWeight:700,textAlign:"center",color:C.warn,boxSizing:"border-box"}}/>
            {nuevoReg.externo!==""&&<div style={{fontSize:11,color:scoreColor(parseInt(nuevoReg.externo)),marginTop:4,textAlign:"center",fontWeight:600}}>{scoreLabel(parseInt(nuevoReg.externo))}</div>}
          </div>
        </div>
        <div style={{background:`${C.info}10`,border:`1px solid ${C.info}33`,borderRadius:8,padding:"10px 12px",fontSize:12,color:C.muted,marginBottom:20,lineHeight:1.6}}>
          💡 El <strong>interno</strong> lo calcula la IA solo. Acá solo cargás el <strong>externo</strong> (la nota que manda el cliente) para comparar. Se guarda en el servidor.
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>{setModal(false);setNuevoReg({mesKey:"",externo:""}); }} style={{padding:"9px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button onClick={addRegistro} disabled={guardando||!nuevoReg.mesKey||nuevoReg.externo===""} style={{padding:"9px 20px",background:(guardando||!nuevoReg.mesKey||nuevoReg.externo==="")?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>{guardando?"Guardando…":"Guardar"}</button>
        </div>
      </div>
    </div>}

    {/* MODAL NUEVO CLIENTE */}
    {addClienteModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.white,borderRadius:16,padding:28,width:360,maxWidth:"92vw"}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:18}}>➕ Agregar cliente</div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Nombre del cliente</label>
          <input value={nuevoCliente.nombre} onChange={e=>setNuevoCliente({...nuevoCliente,nombre:e.target.value})} placeholder="ej: Banco ICBC"
            style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Color identificador</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {["#437540","#0033a0","#ec0000","#006633","#c8960c","#2080c8","#7b2d8b","#e8a020"].map(color=>(
              <div key={color} onClick={()=>setNuevoCliente({...nuevoCliente,color})}
                style={{width:28,height:28,borderRadius:"50%",background:color,cursor:"pointer",border:`3px solid ${nuevoCliente.color===color?"#333":"transparent"}`}}/>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setAddClienteModal(false)} style={{padding:"8px 18px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
          <button onClick={addCliente} style={{padding:"8px 18px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>Crear</button>
        </div>
      </div>
    </div>}
  </div>;
}

<script type="text/babel">
// Rúbrica genérica de evaluación (se puede personalizar por banco en Agentes IA)
const RUBRICA_DEFAULT="Sos un evaluador de calidad de llamadas de cobranzas/atención. EVALUÁ: 1. Identificación del gestor y empresa — peso 15%. 2. Verificación de identidad del cliente — peso 15%. 3. Escucha y comprensión del motivo — peso 20%. 4. Manejo con empatía y claridad — peso 20%. 5. Propuesta / resolución — peso 20%. 6. Cierre con confirmación y registro — peso 10%. SCORE: promedio ponderado 0-100. RECOMENDACIÓN: fortalezas primero, luego 1-2 mejoras concretas. TONO: profesional, segunda persona (vos).";
const DUR_MINIMA=20; // segundos: por debajo se considera "no atendió / sin conversación"
var _naCache={}; // neotelId -> {fecha,fechaHasta,calls,analisis}: no perder lo cargado al cambiar de solapa
var _llamadasCache={}; // "neotelId_fecha" -> [llamadas]: cache de días cerrados (memoria; se persiste en Firestore "neotel_calls_cache")

function NeotelAudiosPanel({selG,selAudio,setSelAudio,onCambio}){
  const [calls,setCalls]=useState(null);
  const [loading,setLoading]=useState(false);
  const [fecha,setFecha]=useState(new Date().toISOString().slice(0,10));
  const [fechaHasta,setFechaHasta]=useState(new Date().toISOString().slice(0,10));
  const [err,setErr]=useState("");
  const [analisis,setAnalisis]=useState({});      // grabacion -> resultado IA (o {_error})
  const [analizando,setAnalizando]=useState({});  // grabacion -> texto de estado
  const [batch,setBatch]=useState(null);          // {total,hechas} mientras corre "Analizar todas"
  const [verFiltro,setVerFiltro]=useState("todas"); // todas | pend | ok
  // Mientras corre el batch, avisar si intentan cerrar/recargar la pestaña (el análisis corre en el navegador).
  useEffect(function(){
    if(!batch) return;
    var h=function(e){e.preventDefault();e.returnValue="";return "";};
    window.addEventListener("beforeunload",h);
    return function(){window.removeEventListener("beforeunload",h);};
  },[batch]);
  const [rubricas,setRubricas]=useState([]);      // rúbricas por cliente (Agentes IA)
  const [rubricaSel,setRubricaSel]=useState("auto");
  const [sysCfg,setSysCfg]=useState({transcriptor:"",modelo:""});
  const cancelarBatch=useRef(false);
  const autoCargar=useRef(false);

  useEffect(function(){
    if(!window.db)return;
    window.db.collection("agentes_ia").get().then(function(snap){setRubricas(snap.docs.map(function(d){return d.data();}));}).catch(function(){});
    window.db.collection("configuracion").doc("sistema").get().then(function(d){if(d.exists)setSysCfg(d.data());}).catch(function(){});
  },[]);
  // Restaurar/guardar lo cargado por gestor → no se "reinicia a foja 0" al volver de otra solapa.
  useEffect(function(){
    if(!selG||!selG.neotelId)return;
    var c=_naCache[selG.neotelId];
    if(c){setFecha(c.fecha);setFechaHasta(c.fechaHasta);setCalls(c.calls);setAnalisis(c.analisis||{});}
    else{setCalls(null);setAnalisis({});autoCargar.current=true;}   // sin caché → cargar audios solo (auto)
  },[selG&&selG.neotelId]);
  // Carga AUTOMÁTICA de audios al entrar a un gestor (así solo hay que apretar "Analizar").
  useEffect(function(){
    if(autoCargar.current&&selG&&selG.neotelId&&!calls&&!loading){autoCargar.current=false;cargar();}
  });
  useEffect(function(){
    if(selG&&selG.neotelId&&calls) _naCache[selG.neotelId]={fecha:fecha,fechaHasta:fechaHasta,calls:calls,analisis:analisis};
  },[calls,analisis,fecha,fechaHasta]);
  // Elige el prompt: rúbrica seleccionada, o auto-match por campaña, o default.
  const promptActivo=function(campana){
    if(rubricaSel!=="auto"){var r=rubricas.find(function(x){return String(x.id)===String(rubricaSel);});if(r&&r.prompt)return r.prompt;}
    else{var c=String(campana||"").toLowerCase();var m=rubricas.find(function(x){return x.nombre&&c.indexOf(String(x.nombre).toLowerCase())>=0;});if(m&&m.prompt)return m.prompt;}
    return RUBRICA_DEFAULT;
  };
  const diasRango=function(){
    var d1=fecha,d2=(fechaHasta<fecha?fecha:fechaHasta),out=[],g=0;
    var cur=new Date(d1+"T00:00:00"),end=new Date(d2+"T00:00:00");
    while(cur<=end&&g<62){out.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);g++;}
    return out;
  };

  const cargar=async function(){
    if(!selG||!selG.neotelId){setErr("Sin usuario Neotel. Editá el gestor en Administración.");return;}
    var dias=diasRango();
    setLoading(true);setErr("");setCalls(null);
    try{
      var todas=[],totalNeotel=0;
      for(var di=0;di<dias.length;di++){
        var dd=dias[di];
        var res=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"calls",usuario:selG.neotelId,fecha:dd})});
        var data=await res.json();
        if(data.error){setErr("Neotel: "+data.error);setLoading(false);return;}
        totalNeotel+=(data.resumen?data.resumen.total:0);
        // FILTRO capa 1 (barato): atendidas (ANSWER), con grabación, duración >= DUR_MINIMA
        (data.calls||[]).filter(function(x){
          return x.estado==="ANSWER" && x.grabacion && x.grabacion!="NULL" && x.grabacion!="" && (x.duracionSeg||0)>=DUR_MINIMA;
        }).forEach(function(x){
          var s=x.duracionSeg||0;
          todas.push({id:x.idLlamada,hora:x.inicio?x.inicio.slice(11,16):"--",fechaLlamada:dd,durSeg:s,
            dur:Math.floor(s/60)+":"+((s%60)<10?"0":"")+(s%60),campana:x.campana||"",grabacion:x.grabacion,
            audioUrl:"/audio.php?file="+encodeURIComponent(x.grabacion)+"&token="});
        });
      }
      setCalls({list:todas,descartadasNeotel:totalNeotel-todas.length,dias:dias.length});
      // Precargar análisis ya guardados (no se re-paga)
      if(window.db && todas.length){
        var prev={};
        await Promise.all(todas.map(async function(a){
          try{var doc=await window.db.collection("analisis_llamadas").doc(a.grabacion).get(); if(doc.exists) prev[a.grabacion]=doc.data();}catch(e){}
        }));
        if(Object.keys(prev).length) setAnalisis(function(p){return Object.assign({},p,prev);});
      }
    }catch(e){setErr("Error: "+e.message);}
    setLoading(false);
  };

  const analizar=async function(a,modeloOverride,motorOverride){
    setAnalizando(function(p){var n=Object.assign({},p);n[a.grabacion]=(motorOverride==="openai"?"🔬 ":"")+"🎙 Transcribiendo…";return n;});
    try{
      var rt=await fetchTO(window.TRANSCRIBIR_PROXY||"/transcribir.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({file:a.grabacion,motor:(motorOverride||sysCfg.transcriptor||"openai")})},240000);
      var dt=await rt.json();
      if(!dt.ok) throw new Error(dt.error||"Error al transcribir");
      setAnalizando(function(p){var n=Object.assign({},p);n[a.grabacion]="🤖 Analizando…";return n;});
      // La cartera/cliente es el BANCO ASIGNADO al gestor (no la campaña genérica de Neotel).
      var cartera=(selG&&selG.cliente)||a.campana||"";
      var cuerpo={transcripcion:dt.transcripcion,prompt:promptActivo(cartera),cliente:cartera};
      if(modeloOverride) cuerpo.modelo=modeloOverride; else if(sysCfg.modelo) cuerpo.modelo=sysCfg.modelo;
      var ra=await fetchTO(window.ANALIZAR_PROXY||"/analizar.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify(cuerpo)},180000);
      var da=await ra.json();
      if(!da.ok) throw new Error(da.error||"Error al analizar");
      var resultado=Object.assign({},da.analisis,{transcripcion:dt.transcripcion,idLlamada:a.id,grabacion:a.grabacion,fecha:a.fechaLlamada||fecha,neotelId:(selG&&selG.neotelId)||"",gestor:(selG&&(selG.name||selG.nombre))||"",cliente:cartera,campana:a.campana||"",modelo:da.modelo||modeloOverride||""});
      setAnalisis(function(p){var n=Object.assign({},p);n[a.grabacion]=resultado;return n;});
      if(window.db){try{await window.db.collection("analisis_llamadas").doc(a.grabacion).set(Object.assign({},resultado,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));}catch(e){}}
      if(onCambio)onCambio();
    }catch(e){
      var _emsg=(e&&e.name==="AbortError")?"⏱ Tardó demasiado y se salteó. Reintentá.":((e&&e.message)||String(e));
      setAnalisis(function(p){var n=Object.assign({},p);n[a.grabacion]={_error:_emsg};return n;});
    }
    setAnalizando(function(p){var n=Object.assign({},p);delete n[a.grabacion];return n;});
  };

  // Analizar TODAS las pendientes (las ya cacheadas se saltean, no se re-pagan)
  const analizarTodas=async function(){
    if(!calls||!calls.list) return;
    cancelarBatch.current=false;
    var pend=calls.list.filter(function(a){return !analisis[a.grabacion]&&!analizando[a.grabacion];});
    if(!pend.length) return;
    setBatch({total:pend.length,hechas:0});
    // Cartel flotante global: sigue visible y corriendo aunque cambies de sección.
    window.DasaBatch.startGen("Analizando audios"+(selG&&selG.name?" · "+selG.name:""),pend.length,function(){cancelarBatch.current=true;});
    // Hasta 3 en paralelo (transcribe+analiza+guarda con Haiku) → ~3x más rápido.
    var idx=0, CONC=3, done=0;
    async function worker(){
      while(idx<pend.length && !cancelarBatch.current){
        var a=pend[idx++];
        await analizar(a,sysCfg.modelo||"claude-haiku-4-5");
        done++;
        setBatch(function(b){return b?{total:b.total,hechas:b.hechas+1}:null;});
        window.DasaBatch.tickGen(done);
      }
    }
    await Promise.all(Array.from({length:Math.min(CONC,pend.length)},function(){return worker();}));
    setBatch(null);
    window.DasaBatch.endGen();
  };

  // ORDEN + FILTRO capa 2 (IA): sacar las que la IA marcó como no-llamada; ordenar por score
  var visibles=[],descartIA=0,analizadas=0,pendientes=0;
  var _ok=function(a){var an=analisis[a.grabacion];return an&&!an._error&&typeof an.score==="number";};
  if(calls&&calls.list){
    calls.list.forEach(function(a){var an=analisis[a.grabacion];
      if(_ok(a)) analizadas++;
      if(an&&an.es_valida===false){descartIA++;return;}
      if(!_ok(a)) pendientes++;
      visibles.push(a);
    });
    visibles.sort(function(x,y){
      var ax=analisis[x.grabacion],ay=analisis[y.grabacion];
      var sx=ax&&!ax._error&&typeof ax.score==="number"?ax.score:-1;
      var sy=ay&&!ay._error&&typeof ay.score==="number"?ay.score:-1;
      return sx!==sy?sy-sx:y.durSeg-x.durSeg;
    });
    if(verFiltro==="pend") visibles=visibles.filter(function(a){return !_ok(a);});
    else if(verFiltro==="ok") visibles=visibles.filter(_ok);
  }

  return <Card>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
      <CardTitle>🎧 Audios reales — Neotel · IA</CardTitle>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted}}>Desde</span>
        <input type="date" value={fecha} onChange={function(e){var v=e.target.value;setFecha(v);if(fechaHasta<v)setFechaHasta(v);}} style={{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13}}/>
        <span style={{fontSize:12,color:C.muted}}>Hasta</span>
        <input type="date" value={fechaHasta} min={fecha} onChange={function(e){setFechaHasta(e.target.value);}} style={{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13}}/>
        {rubricas.length>0&&<select value={rubricaSel} onChange={function(e){setRubricaSel(e.target.value);}} title="Con qué rúbrica evaluar" style={{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13,background:C.white}}>
          <option value="auto">Rúbrica: auto por campaña</option>
          {rubricas.map(function(r){return <option key={r.id} value={r.id}>Rúbrica: {r.nombre}</option>;})}
        </select>}
        <button onClick={cargar} disabled={loading} style={{padding:"7px 16px",background:loading?C.muted:C.green,color:"#fff",border:"none",borderRadius:8,cursor:loading?"not-allowed":"pointer",fontSize:13,fontWeight:600}}>{loading?"Cargando...":"📥 Cargar audios"}</button>
      </div>
    </div>
    {err&&<div style={{background:"#fce8e8",borderRadius:8,padding:"10px 14px",fontSize:13,color:C.danger,marginBottom:12}}>{err}</div>}
    {!calls&&!loading&&<div style={{textAlign:"center",padding:"20px",color:C.muted,fontSize:13}}>Elegí una fecha (o un rango Desde–Hasta) y hacé clic en "Cargar audios".</div>}
    {loading&&<div style={{textAlign:"center",padding:"20px",color:C.info,fontSize:13}}>⏳ Conectando con Neotel…</div>}
    {calls&&<div>
      <div style={{display:"flex",gap:10,marginBottom:8,flexWrap:"wrap"}}>
        <Stat label="Llamadas reales" value={calls.list.length} sub={calls.dias>1?("atendidas ≥20s · "+calls.dias+" días"):"atendidas ≥20s"} color={C.green} icon="🎧"/>
        <div onClick={function(){setVerFiltro(verFiltro==="ok"?"todas":"ok");}} style={{cursor:"pointer"}}><Stat label="Analizadas IA" value={analizadas} color={C.info} icon="🤖"/></div>
        <div onClick={function(){setVerFiltro(verFiltro==="pend"?"todas":"pend");}} style={{cursor:"pointer"}}><Stat label="Pendientes" value={pendientes} sub={pendientes>0?"falta analizar":"todo listo"} color={pendientes>0?C.warn:C.green} icon="⏳"/></div>
        <Stat label="Descartadas" value={(calls.descartadasNeotel||0)+descartIA} sub="no atendió / no-llamada / no aplica" color={C.muted} icon="🚫"/>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted}}>Ver:</span>
        {[{k:"todas",l:"Todas ("+calls.list.length+")"},{k:"pend",l:"⏳ Pendientes ("+pendientes+")"},{k:"ok",l:"✓ Analizadas ("+analizadas+")"}].map(function(f){var on=verFiltro===f.k;return <button key={f.k} onClick={function(){setVerFiltro(f.k);}} style={{padding:"5px 12px",borderRadius:20,border:"1px solid "+(on?C.green:C.border),background:on?C.green:C.white,color:on?"#fff":C.text,cursor:"pointer",fontSize:12,fontWeight:on?700:400}}>{f.l}</button>;})}
      </div>
      {/* ── ANALIZAR TODAS ── */}
      {(function(){
        var pend=calls.list.filter(function(a){return !analisis[a.grabacion]&&!analizando[a.grabacion];}).length;
        if(batch) return <div style={{marginBottom:12,background:C.info+"0d",border:"1px solid "+C.info+"33",borderRadius:10,padding:"10px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:13,fontWeight:600,color:C.info}}>🤖 Analizando todas (Haiku)… {batch.hechas}/{batch.total}</span>
            <button onClick={function(){cancelarBatch.current=true;}} style={{padding:"4px 12px",border:"1px solid "+C.danger,borderRadius:6,background:"#fff",cursor:"pointer",fontSize:12,color:C.danger}}>Detener</button>
          </div>
          <div style={{height:8,background:C.border,borderRadius:5,overflow:"hidden"}}><div style={{height:"100%",width:Math.round(batch.hechas/batch.total*100)+"%",background:C.info,borderRadius:5,transition:"width .3s"}}/></div>
          <div style={{fontSize:11,color:C.warn,marginTop:6,fontWeight:600}}>⚠️ No cierres ni cambies de sección hasta que termine (el análisis corre en esta pestaña). Si se corta, volvé a tocar "Analizar todas": sigue donde quedó, no re-analiza lo hecho.</div>
        </div>;
        if(pend>0) return <button onClick={analizarTodas} style={{marginBottom:12,padding:"9px 18px",background:C.green,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🤖 Analizar todas ({pend}) · Haiku</button>;
        if(calls.list.length>0) return <div style={{fontSize:12,color:C.green,marginBottom:12,fontWeight:600}}>✓ Todas las llamadas analizadas</div>;
        return null;
      })()}
      <div style={{fontSize:11,color:C.muted,marginBottom:12}}>Ordenadas por score (mejor primero). La IA filtra las que no son conversaciones reales.</div>
      {visibles.length>0
        ?<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {visibles.map(function(a){
            var open=selAudio===a.id, an=analisis[a.grabacion], estado=analizando[a.grabacion];
            var tieneScore=an&&!an._error&&typeof an.score==="number";
            var col=tieneScore?scoreColor(an.score):C.muted;
            return <div key={a.id} style={{border:"1px solid "+(open?col+"66":C.border),borderRadius:12,overflow:"hidden"}}>
              <div onClick={function(){setSelAudio(open?null:a.id);}} style={{display:"flex",alignItems:"center",padding:"11px 14px",cursor:"pointer",gap:12}}>
                <div style={{width:42,height:42,borderRadius:"50%",background:col+"18",border:"2px solid "+col+"55",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:tieneScore?15:18,fontWeight:700,color:col}}>{tieneScore?an.score:"🎧"}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>📞 {_telLlamada(a.grabacion,a.id)} {tieneScore
                    ?<span style={{fontSize:11,fontWeight:600,color:col,background:col+"15",borderRadius:10,padding:"1px 8px",marginLeft:6}}>{an.etiqueta}</span>
                    :estado?null:<span style={{fontSize:11,fontWeight:700,color:C.warn,background:C.warn+"18",border:"1px solid "+C.warn+"44",borderRadius:10,padding:"1px 8px",marginLeft:6}}>⏳ Pendiente</span>}</div>
                  <div style={{display:"flex",gap:8,fontSize:12,color:C.muted,flexWrap:"wrap"}}><span>📞 {a.campana}</span><span>🕐 {a.hora}</span><span>⏱ {a.dur}</span>{estado&&<span style={{color:C.info}}>{estado}</span>}</div>
                </div>
                <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{padding:"0 14px 14px",borderTop:"1px solid "+col+"22"}}>
                <audio controls src={a.audioUrl} style={{width:"100%",marginTop:10,borderRadius:8}} preload="none"/>
                {(function(){var p=String(a.grabacion||"").split("-")[0];return /^\d{7,}$/.test(p)?<div style={{fontSize:12,color:C.text,marginTop:6}}>📞 Teléfono: <strong>{p}</strong></div>:null;})()}
                <div style={{fontSize:10,color:C.muted,marginTop:4}}>Código para cruzar en el CRM (columna “Grabación”):</div>
                <code style={{fontSize:11,color:C.muted,display:"block"}}>{a.grabacion}</code>
                {!an&&!estado&&<div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <button onClick={function(){analizar(a);}} style={{padding:"8px 16px",background:C.green,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>🤖 Analizar</button>
                  <button onClick={function(){analizar(a,"claude-opus-4-8","openai");}} title="Transcribe con OpenAI Whisper y analiza con Opus — máxima calidad, tiene costo" style={{padding:"8px 16px",background:"#fff",color:C.info,border:"1.5px solid "+C.info,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>🔬 Análisis profundo (OpenAI)</button>
                </div>}
                {estado&&<div style={{marginTop:10,fontSize:13,color:C.info}}>{estado} (puede tardar unos segundos)</div>}
                {an&&an._error&&<div style={{marginTop:10,background:"#fce8e8",borderRadius:8,padding:"10px 12px",fontSize:12,color:C.danger}}>Error: {an._error} <button onClick={function(){analizar(a);}} style={{marginLeft:8,padding:"2px 10px",border:"1px solid "+C.danger,borderRadius:6,background:"#fff",cursor:"pointer",fontSize:11,color:C.danger}}>Reintentar</button></div>}
                {tieneScore&&<div style={{marginTop:12}}>
                  {an.es_valida===false&&<div style={{background:C.warn+"15",border:"1px solid "+C.warn+"44",borderRadius:8,padding:"8px 12px",fontSize:12,color:C.warn,marginBottom:10}}>⚠️ La IA detectó que no es una conversación real: {an.motivo_invalida}</div>}
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>{(an.aspectos||[]).map(function(asp,j){return <span key={j} style={{fontSize:12,padding:"3px 10px",borderRadius:14,background:(asp.indexOf("✓")>=0?C.green:C.danger)+"12",color:(asp.indexOf("✓")>=0?C.green:C.danger)}}>{asp}</span>;})}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>{(an.criterios||[]).map(function(c,j){return <div key={j} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}><span style={{flex:1,color:C.text}}>{c.nombre} <span style={{color:C.muted}}>({c.peso}%)</span></span><span style={{fontWeight:700,color:scoreColor(c.puntaje)}}>{c.puntaje}</span></div>;})}</div>
                  <div style={{background:C.pale,border:"1px solid "+C.paleB,borderRadius:8,padding:"10px 12px",fontSize:12,color:C.text,lineHeight:1.6,marginBottom:8}}><strong style={{color:C.muted}}>🤖 Análisis IA:</strong> {an.analisis}</div>
                  <div style={{background:C.info+"0d",border:"1px solid "+C.info+"33",borderRadius:8,padding:"10px 12px",fontSize:12,color:C.text,lineHeight:1.6}}><strong style={{color:C.info}}>💡 Recomendación:</strong> {an.recomendacion}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
                    <span style={{fontSize:11,color:C.muted}}>{an.modelo?("Modelo: "+(String(an.modelo).indexOf("opus")>=0?"Opus (profundo)":String(an.modelo).indexOf("haiku")>=0?"Haiku":an.modelo)):""}</span>
                    {!estado&&<button onClick={function(){analizar(a,"claude-opus-4-8","openai");}} title="Re-analiza con OpenAI Whisper + Opus (máxima calidad, tiene costo)" style={{padding:"4px 12px",background:"#fff",color:C.info,border:"1px solid "+C.info,borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600}}>🔬 Re-analizar profundo</button>}
                  </div>
                </div>}
              </div>}
            </div>;})}
        </div>
        :<div style={{textAlign:"center",padding:"20px",color:C.muted,fontSize:13}}>Sin llamadas atendidas (≥20s) para esta fecha.</div>}
    </div>}
  </Card>;
}
</script>
<script type="text/babel">

// ── ESTADÍSTICAS IA (reales, desde analisis_llamadas en Firestore) ──────────
// ── RUNNER GLOBAL del batch "Analizar todo el equipo" ────────────────────────
// Vive FUERA de React: el batch sigue corriendo aunque el supervisor cambie de
// sección (la app se puede seguir usando). El progreso se publica a los suscriptores
// (panel de Estadísticas IA + cartel global). Es reanudable: cada llamada se cachea
// en Firestore, así reintentar saltea lo ya analizado.
window.DasaBatch = window.DasaBatch || (function(){
  var st={running:false,gIdx:0,gTot:0,gNombre:"",cHechas:0,cTot:0,nuevas:0,fecha:"",error:"",cancelling:false,_cancel:false};
  var subs=[];
  var _ac=null;   // AbortController de la llamada en curso (para detener al instante)
  var gen=null;   // progreso genérico (batch por-gestor u otros) — visible en el cartel flotante
  function snap(){return Object.assign({},st,{gen:gen?Object.assign({},gen):null});}
  function emit(){var s=snap();subs.forEach(function(f){try{f(s);}catch(e){}});}
  function patch(o){Object.assign(st,o);emit();}
  var _guard=function(e){e.preventDefault();e.returnValue="";return "";};
  return {
    get:function(){return snap();},
    isRunning:function(){return st.running;},
    subscribe:function(f){subs.push(f);f(snap());return function(){subs=subs.filter(function(x){return x!==f;});};},
    cancel:function(){st._cancel=true;st.cancelling=true;if(_ac){try{_ac.abort();}catch(e){}}emit();},
    // Progreso genérico: cualquier batch (p.ej. "Analizar todas" por gestor) lo usa
    // para que se vea en el cartel flotante y sobreviva al cambiar de sección.
    startGen:function(label,total,onCancel){gen={label:label,total:total||0,hechas:0,onCancel:onCancel||null};window.addEventListener("beforeunload",_guard);emit();},
    tickGen:function(h){if(gen){gen.hechas=h;emit();}},
    endGen:function(){gen=null;window.removeEventListener("beforeunload",_guard);emit();},
    cancelGen:function(){if(gen&&gen.onCancel){try{gen.onCancel();}catch(e){}}},
    runEquipo:async function(desde,hasta,onDone,forzar){
      if(st.running)return;
      hasta=hasta||desde;
      // Lista de días del rango (máx 93 para no desbordar)
      var fechas=[],cur=new Date(desde+"T00:00:00"),end=new Date(hasta+"T00:00:00"),g0=0;
      if(!isNaN(cur.getTime())&&!isNaN(end.getTime())){while(cur<=end&&g0<93){fechas.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);g0++;}}
      if(!fechas.length)fechas=[desde];
      st={running:true,gIdx:0,gTot:0,gNombre:"",cHechas:0,cTot:0,nuevas:0,fecha:fechas[0],fHasta:fechas[fechas.length-1],fIdx:0,fTot:fechas.length,error:"",cancelling:false,_cancel:false};emit();
      window.addEventListener("beforeunload",_guard);
      try{
        if(!window.db)throw new Error("Firebase no disponible.");
        var snap=await window.db.collection("usuarios").get();
        var gestores=snap.docs.map(function(d){return d.data();}).filter(function(u){return u.neotelId&&String(u.neotelId).trim();});
        if(!gestores.length)throw new Error("No hay gestores con 'Usuario Neotel' cargado. Cargalos en Administración de gestores.");
        var cs=await window.db.collection("analisis_llamadas").get();
        var cache={};if(!forzar)cs.docs.forEach(function(d){cache[d.id]=1;});   // con "forzar" no saltea: reanaliza todo (para aplicar un prompt nuevo)
        var rubSnap=await window.db.collection("agentes_ia").get();
        var rubs=rubSnap.docs.map(function(d){return d.data();});
        var sysSnap=await window.db.collection("configuracion").doc("sistema").get();
        var sysM=(sysSnap.exists?sysSnap.data():{})||{};
        var motorM=sysM.transcriptor||"openai",modeloM=sysM.modelo||"claude-haiku-4-5";
        var _regSnap=await window.db.collection("configuracion").doc("tipificaciones").get();
        var reglasTip=(_regSnap.exists&&_regSnap.data().reglas)||{};   // override manual del descarte por tipificación
        var modoTip=(_regSnap.exists&&_regSnap.data().modo)||"blacklist";   // whitelist = solo pago
        var rubricaDe=function(cart){var c=String(cart||"").toLowerCase();var m=rubs.find(function(x){return x.nombre&&c.indexOf(String(x.nombre).toLowerCase())>=0;});return (m&&m.prompt)||RUBRICA_DEFAULT;};
        // Cruce de tipificaciones del CRM por cartera+fecha (cacheado). Sirve para DESCARTAR antes de transcribir.
        var _tipCache={};
        var tipDe=async function(crm,fd){
          if(!crm||crm<=0)return {map:{},sinCRM:true,error:false};   // llamada sin CRM → no cruzable → no descartar
          var key=crm+"|"+fd; if(_tipCache[key])return _tipCache[key];
          var res={map:{},sinCRM:false,error:false};
          try{ var r=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"tipificaciones",crm:crm,desde:fd,hasta:fd})}); var d=await r.json(); if(d&&d.sinCRM)res.sinCRM=true; else if(d&&d.tipificaciones)res.map=d.tipificaciones; else res.error=true; }catch(e){res.error=true;}
          _tipCache[key]=res; return res;
        };
        var nuevas=0,descartadas=0;
        for(var fi=0;fi<fechas.length;fi++){
          if(st._cancel)break;
          var fd=fechas[fi];
          patch({fecha:fd,fIdx:fi+1,gTot:gestores.length});
          for(var gi=0;gi<gestores.length;gi++){
            if(st._cancel)break;
            var g=gestores[gi],gname=g.name||g.nombre||String(g.neotelId);
            var data={};
            try{var res=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"calls",usuario:g.neotelId,fecha:fd})});data=await res.json();}catch(e){data={};}
            var lista=((data&&data.calls)||[]).filter(function(x){return x.estado==="ANSWER"&&x.grabacion&&x.grabacion!="NULL"&&x.grabacion!=""&&(x.duracionSeg||0)>=20&&!cache[x.grabacion];});
            patch({gIdx:gi+1,gNombre:gname,cHechas:0,cTot:lista.length});
            for(var ci=0;ci<lista.length;ci++){
              if(st._cancel)break;
              var x=lista[ci];
              var cartera=(g&&g.cliente)||x.campana||"";
              // GATE CRM: descartar las no-gestión ANTES de transcribir → NO se paga Whisper por el ~95% que se tira.
              var idll=x.idLlamada||String(x.grabacion||"").split("-")[1]||"";
              var tp=await tipDe(x.crm||0,fd);
              var _desc=false;
              if(!tp.sinCRM&&!tp.error){ _desc = tp.map[idll] ? aplicaDescarte(tp.map[idll].tipif,tp.map[idll].descartar,reglasTip,modoTip) : true; }  // sin tipificación (con CRM ok) = no-gestión → descartar.
              else if(modoTip==="whitelist"){ _desc=true; }  // sin CRM / error de cruce → en modo solo-pago, descartar (no se puede confirmar pago)
              if(_desc){
                try{ await window.db.collection("analisis_llamadas").doc(x.grabacion).set({es_valida:false,score:0,motivo:"descarte CRM",idLlamada:idll,grabacion:x.grabacion,fecha:fd,neotelId:g.neotelId,gestor:gname,cliente:cartera,campana:x.campana||"",origen:"auto-descarte",createdAt:firebase.firestore.FieldValue.serverTimestamp()}); cache[x.grabacion]=1;descartadas++; }catch(e){}
                patch({cHechas:ci+1,nuevas:nuevas}); continue;
              }
              _ac=new AbortController();var _sig=_ac.signal;
              try{
                var rt=await fetch(window.TRANSCRIBIR_PROXY||"/transcribir.php",{method:"POST",signal:_sig,headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({file:x.grabacion,motor:motorM})});
                var dt=await rt.json();
                if(dt.ok){
                  var ra=await fetch(window.ANALIZAR_PROXY||"/analizar.php",{method:"POST",signal:_sig,headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({transcripcion:dt.transcripcion,prompt:rubricaDe(cartera),cliente:cartera,modelo:modeloM})});
                  var da=await ra.json();
                  if(da.ok){
                    var _tp=(tp.map&&tp.map[idll])||{};
                    var r=Object.assign({},da.analisis,{transcripcion:dt.transcripcion,idLlamada:x.idLlamada,grabacion:x.grabacion,fecha:fd,hora:x.hora||"",neotelId:g.neotelId,gestor:gname,cliente:cartera,campana:x.campana||"",dni:_tp.dni||"",tipif:_tp.tipif||"",telefono:_telLlamada(x.grabacion,x.grabacion),durSeg:x.durSeg||0,dur:x.dur||"",modelo:modeloM});
                    await window.db.collection("analisis_llamadas").doc(x.grabacion).set(Object.assign({},r,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
                    cache[x.grabacion]=1;nuevas++;
                  }
                }
              }catch(e){}
              patch({cHechas:ci+1,nuevas:nuevas});
            }
          }
        }
      }catch(e){patch({error:"Error en el batch: "+((e&&e.message)||e)});}
      window.removeEventListener("beforeunload",_guard);
      st.running=false;emit();
      if(onDone)try{onDone();}catch(e){}
    }
  };
})();

function useDasaBatch(){
  const [s,setS]=useState(window.DasaBatch.get());
  useEffect(function(){return window.DasaBatch.subscribe(setS);},[]);
  return s;
}

function EstadisticasIA(){
  const [docs,setDocs]=useState(null);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(true);
  const hoy=new Date().toISOString().slice(0,10);
  const [desde,setDesde]=useState("");
  const [hasta,setHasta]=useState("");
  const [cartera,setCartera]=useState("Todos");
  const [gestMap,setGestMap]=useState({});     // neotelId -> banco asignado
  const [selRank,setSelRank]=useState(null);    // gestor expandido (drill-down)
  const [selCall,setSelCall]=useState(null);    // llamada expandida (análisis completo)
  const [soloRiesgo,setSoloRiesgo]=useState(false);
  const [qRank,setQRank]=useState("");           // buscador de gestor en el ranking
  const [mesSelStats,setMesSelStats]=useState(null); // mes elegido en el gráfico mensual
  const [forzar,setForzar]=useState(false);      // re-analizar ignorando lo ya hecho (para aplicar un prompt nuevo)
  const [tbErr,setTbErr]=useState("");
  const tb=useDasaBatch();

  const cargar=function(){
    if(!window.db){setErr("Firebase no disponible.");setLoading(false);return;}
    setLoading(true);
    window.db.collection("analisis_llamadas").get()
      .then(function(snap){setDocs(snap.docs.map(function(d){return d.data();}));setLoading(false);})
      .catch(function(e){setErr("No se pudieron cargar los análisis: "+e.message);setLoading(false);});
  };
  useEffect(cargar,[]);
  useEffect(function(){
    if(!window.db)return;
    window.db.collection("usuarios").get().then(function(s){var m={};s.docs.forEach(function(d){var u=d.data();if(u.neotelId&&u.cliente)m[String(u.neotelId).trim()]=u.cliente;});setGestMap(m);}).catch(function(){});
  },[]);
  const prevRun=useRef(false);
  useEffect(function(){ if(prevRun.current && !tb.running) cargar(); prevRun.current=tb.running; },[tb.running]);

  const _cli=function(d){return gestMap[String(d.neotelId||"").trim()]||d.cliente||"—";};
  const analizarEquipo=function(){
    setTbErr("");
    if(!window.db){setTbErr("Firebase no disponible.");return;}
    if(window.DasaBatch.isRunning())return;
    window.DasaBatch.runEquipo(desde||hoy, hasta||desde||hoy, null, forzar);
  };

  var panelEquipo=<Card>
    <CardTitle>🤖 Analizar todo el equipo · Haiku</CardTitle>
    {tb.running
      ?<div>
        <div style={{fontSize:13,fontWeight:600,color:C.info,marginBottom:6}}>Gestor {tb.gIdx}/{tb.gTot}: {tb.gNombre} — llamada {tb.cHechas}/{tb.cTot} · {tb.nuevas} analizadas</div>
        <div style={{height:8,background:C.border,borderRadius:5,overflow:"hidden",marginBottom:8}}><div style={{height:"100%",width:Math.round(tb.gIdx/Math.max(1,tb.gTot)*100)+"%",background:C.info,borderRadius:5,transition:"width .3s"}}/></div>
        <button onClick={function(){window.DasaBatch.cancel();}} disabled={tb.cancelling} style={{padding:"5px 14px",border:"1px solid "+C.danger,borderRadius:6,background:"#fff",cursor:tb.cancelling?"default":"pointer",fontSize:12,color:C.danger,opacity:tb.cancelling?0.5:1}}>{tb.cancelling?"Deteniendo…":"Detener"}</button>
        <div style={{fontSize:11,color:C.green,marginTop:8,fontWeight:600}}>✓ Podés cambiar de sección y seguir usando la app: sigue corriendo en segundo plano (mirá el cartel abajo a la derecha). Es reanudable: si se corta, volvé a tocar el botón y no re-analiza lo hecho.</div>
      </div>
      :<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted}}>Desde</span>
        <input type="date" value={desde||hoy} onChange={function(e){setDesde(e.target.value);}} style={{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13}}/>
        <span style={{fontSize:12,color:C.muted}}>Hasta</span>
        <input type="date" value={hasta||desde||hoy} min={desde||undefined} onChange={function(e){setHasta(e.target.value);}} style={{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13}}/>
        <button onClick={analizarEquipo} style={{padding:"9px 18px",background:C.green,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🤖 Analizar</button>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:C.muted,cursor:"pointer"}} title="Vuelve a analizar llamadas ya analizadas — usalo si cambiaste el prompt de la cartera y querés que tome efecto">
          <input type="checkbox" checked={forzar} onChange={function(e){setForzar(e.target.checked);}} style={{accentColor:C.green}}/>
          Re-analizar (aplicar prompt nuevo)
        </label>
        <span style={{fontSize:11,color:C.muted,flex:1,minWidth:160}}>Analiza el rango elegido. Corre en segundo plano y cacheado{forzar?" — con re-análisis, vuelve a evaluar lo ya hecho (gasta OpenAI)":""}.</span>
      </div>}
    {(tbErr||tb.error)&&<div style={{marginTop:10,background:C.danger+"12",border:"1px solid "+C.danger+"44",borderRadius:8,padding:"8px 12px",fontSize:12,color:C.danger}}>{tbErr||tb.error}</div>}
  </Card>;

  if(loading) return <div><SecTitle icon="📊">Estadísticas IA</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando análisis…</div></Card></div>;
  if(err) return <div><SecTitle icon="📊">Estadísticas IA</SecTitle>{panelEquipo}<Card mb={0}><div style={{padding:20,color:C.danger,fontSize:13}}>{err}</div></Card></div>;

  var all=docs||[];
  var carteras=["Todos"].concat(Array.from(new Set(all.map(_cli).filter(function(c){return c&&c!=="—";}))).sort());
  var enRango=function(f){if(!f)return false;if(desde&&f<desde)return false;if(hasta&&f>hasta)return false;return true;};
  var baseDocs=all.filter(function(d){return (!(desde||hasta)||enRango(d.fecha)) && (cartera==="Todos"||_cli(d)===cartera);});
  var validos=baseDocs.filter(function(d){return d.es_valida!==false && typeof d.score==="number";});
  var descartadas=baseDocs.filter(function(d){return d.es_valida===false;}).length;

  var filtros=<Card>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{fontSize:12,color:C.muted,fontWeight:700}}>Ver:</span>
      <select value={cartera} onChange={function(e){setCartera(e.target.value);setSelRank(null);}} style={{padding:"6px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,background:C.white}}>
        {carteras.map(function(c){return <option key={c} value={c}>{c==="Todos"?"Todas las carteras":c}</option>;})}
      </select>
      <span style={{fontSize:12,color:C.muted}}>Desde</span>
      <input type="date" value={desde} onChange={function(e){setDesde(e.target.value);}} style={{padding:"6px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
      <span style={{fontSize:12,color:C.muted}}>Hasta</span>
      <input type="date" value={hasta} onChange={function(e){setHasta(e.target.value);}} style={{padding:"6px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/>
      {(desde||hasta||cartera!=="Todos"||soloRiesgo)&&<button onClick={function(){setDesde("");setHasta("");setCartera("Todos");setSoloRiesgo(false);}} style={{padding:"6px 12px",border:`1px solid ${C.border}`,borderRadius:8,background:C.white,cursor:"pointer",fontSize:12,color:C.muted}}>Limpiar</button>}
      <span style={{fontSize:11,color:C.muted}}>{validos.length} llamadas en la vista</span>
    </div>
  </Card>;

  if(!validos.length) return <div><SecTitle icon="📊">Estadísticas IA</SecTitle>{panelEquipo}{filtros}<Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>No hay llamadas analizadas para este filtro. Ampliá el rango o la cartera, o corré "🤖 Analizar" de arriba.</div></Card></div>;

  var n=validos.length;
  var prom=Math.round(validos.reduce(function(a,d){return a+d.score;},0)/n);
  var exc=validos.filter(function(d){return d.score>=90;}).length;
  var ace=validos.filter(function(d){return d.score>=70&&d.score<90;}).length;
  var rie=validos.filter(function(d){return d.score<70;}).length;
  var pg={}; validos.forEach(function(d){var nid=String(d.neotelId||"").trim();var nom=(d.gestor||"").trim();var k,nombre,cli;if(nid){k=nid;nombre=nom||("Neotel "+nid);cli=_cli(d);}else{k="__SINID__";nombre="SIN ID";cli="—";} /* análisis sin Nº Neotel → agrupados como "SIN ID" */ if(!pg[k])pg[k]={n:0,s:0,gestor:nombre,cli:cli,calls:[]};pg[k].n++;pg[k].s+=d.score;pg[k].calls.push(d);});
  var ranking=Object.keys(pg).map(function(k){var p=pg[k];return {key:k,gestor:p.gestor,cli:p.cli,n:p.n,prom:Math.round(p.s/p.n),calls:p.calls};}).sort(function(a,b){return b.prom-a.prom;});
  var _qr=qRank.trim().toLowerCase();
  var rankView=(soloRiesgo?ranking.filter(function(r){return r.prom<70;}):ranking).filter(function(r){return !_qr||String(r.gestor||"").toLowerCase().indexOf(_qr)>=0||String(r.cli||"").toLowerCase().indexOf(_qr)>=0;});
  var pd={}; validos.forEach(function(d){var f=d.fecha||"—";if(!pd[f])pd[f]={n:0,s:0};pd[f].n++;pd[f].s+=d.score;});
  var dias=Object.keys(pd).sort().map(function(f){return {fecha:f,n:pd[f].n,prom:Math.round(pd[f].s/pd[f].n)};});
  var _mesesStats=mesesConDatos(validos);
  var _mesStatsAct=(mesSelStats&&_mesesStats.indexOf(mesSelStats)>=0)?mesSelStats:(_mesesStats.length?_mesesStats[_mesesStats.length-1]:null);
  var _mesStatsData=_mesStatsAct?mesCompletoDias(validos,_mesStatsAct):{dias:[{dia:"—",score:0}],prom:0,conDatos:0,label:"—"};

  return <div>
    <SecTitle icon="📊">Estadísticas IA{cartera!=="Todos"?" · "+cartera:""}</SecTitle>
    {panelEquipo}
    {filtros}
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      <Stat label="Analizadas" value={n} color={C.info} icon="🤖"/>
      <Stat label="Score prom." value={prom} sub={scoreLabel(prom)} color={scoreColor(prom)} icon="📊"/>
      <Stat label="Excelentes ≥90" value={exc} color={C.light} icon="🌟"/>

        var pct=Math.round(b.v/n*100);

          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span>{b.l}</span><span style={{color:C.muted}}>{b.v} ({pct}%)</span></div>

        </div>;
      })}
    </Card>
    <Card><CardTitle>🏆 Ranking de gestores {soloRiesgo&&<span style={{fontSize:12,color:C.danger,fontWeight:600}}>· solo en riesgo</span>} <span style={{fontSize:11,color:C.muted,fontWeight:400}}>(tocá un gestor para ver sus llamadas)</span></CardTitle>
      <input value={qRank} onChange={function(e){setQRank(e.target.value);}} placeholder="🔎 Buscar gestor…" style={{width:"100%",boxSizing:"border-box",padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:20,fontSize:13,marginBottom:10}}/>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {rankView.map(function(r,i){var open=selRank===r.key;var col=scoreColor(r.prom);return <div key={r.key} style={{border:`1px solid ${open?col+"66":C.border}`,borderRadius:8,overflow:"hidden"}}>
          <div onClick={function(){setSelRank(open?null:r.key);}} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",background:open?col+"08":(i%2?C.bg:C.white),cursor:"pointer"}}>
            <span style={{fontSize:13,fontWeight:800,color:i===0&&!soloRiesgo?C.green:C.muted,width:28}}>#{i+1}</span>
            <span style={{flex:1,fontSize:13,fontWeight:600}}>{r.gestor} <span style={{fontSize:11,color:C.muted,fontWeight:400}}>· {r.cli}</span></span>
            <span style={{fontSize:11,color:C.muted}}>{r.n} llam.</span>
            <span style={{fontSize:15,fontWeight:800,color:col}}>{r.prom}</span>
            <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
          </div>
          {open&&<div style={{padding:"6px 12px 12px",borderTop:`1px solid ${C.border}`,background:C.bg}}>
            <div style={{fontSize:11,color:C.muted,margin:"6px 0"}}>Llamadas que arman el promedio (peor primero). Tocá una para ver el análisis completo — por qué ese puntaje y con qué reglas.</div>
            {r.calls.slice().sort(function(a,b){return a.score-b.score;}).map(function(c,ci){var cab=String(c.grabacion||c.idLlamada||ci);var oc=selCall===cab;return <div key={ci} style={{borderBottom:`1px solid ${C.border}`}}>
              <div onClick={function(){setSelCall(oc?null:cab);}} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",fontSize:12,cursor:"pointer"}}>
                <span style={{fontWeight:700,color:scoreColor(c.score),width:34}}>{c.score}</span>
                <span style={{color:C.text,minWidth:110}}>📞 {_telLlamada(c.grabacion,c.idLlamada)}</span>
                <span style={{color:C.muted}}>{c.fecha}</span>
                <span style={{flex:1,color:C.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(c.aspectos&&c.aspectos.slice(0,2).join(" · "))||c.etiqueta||""}</span>
                <span style={{fontSize:11,color:C.info,fontWeight:600,whiteSpace:"nowrap"}}>{oc?"▲ ocultar":"ver análisis ▾"}</span>
              </div>
              {oc&&<AnalisisDetalle c={c}/>}
            </div>;})}
          </div>}
        </div>;})}
        {rankView.length===0&&<div style={{fontSize:13,color:C.muted,textAlign:"center",padding:14}}>No hay gestores en riesgo en este filtro. 🎉</div>}
      </div>
    </Card>
    <Card mb={0}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:600,color:C.muted}}>📅 Score día a día — <strong style={{color:C.text}}>{_mesStatsData.label}</strong> · promedio del mes <strong style={{color:scoreColor(_mesStatsData.prom)}}>{_mesStatsData.prom}</strong> <span style={{fontWeight:400}}>({_mesStatsData.conDatos} días con análisis)</span></div>
        {_mesesStats.length>0&&<select value={_mesStatsAct||""} onChange={function(e){setMesSelStats(e.target.value);}} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,color:C.text,fontSize:13,cursor:"pointer"}}>
          {_mesesStats.slice().reverse().map(function(k){return <option key={k} value={k}>{mesLabel(k)}</option>;})}
        </select>}
      </div>
      <ScoreBarSVG data={_mesStatsData.dias}/>
    </Card>
  </div>;

// Catálogos REALES compartidos por Contenido/Cursos/Evaluaciones:
//  · carteras = clientes configurados en Agentes IA (+ General)
//  · modulos  = editables, guardados en Firestore configuracion/capacitacion
//  · gestores = usuarios reales (rol gestor)
function useCatalogos(){
  const [carteras,setCarteras]=useState([]);
  const [modulos,setModulos]=useState(modulosInit);
  const [gestores,setGestores]=useState([]);
  useEffect(function(){
    if(!window.db)return;
    window.db.collection("agentes_ia").get()
      .then(function(s){setCarteras(s.docs.map(function(d){return {id:d.id,nombre:d.data().nombre};}).filter(function(c){return c.nombre;}));}).catch(function(){});
    window.db.collection("usuarios").get()
      .then(function(s){setGestores(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(u){return (u.role||"gestor")==="gestor";}).map(function(u){return {id:u.id,name:u.name||u.user||"—",neotelId:u.neotelId||"",legajo:u.legajo||""};}));}).catch(function(){});
    window.db.collection("configuracion").doc("capacitacion").get()
      .then(function(doc){
        if(doc.exists&&Array.isArray(doc.data().modulos)&&doc.data().modulos.length){setModulos(doc.data().modulos);}
        else{ window.db.collection("configuracion").doc("capacitacion").set({modulos:modulosInit}).catch(function(){}); setModulos(modulosInit); }
      }).catch(function(){});
  },[]);
  const guardarModulos=function(nuevos){
    setModulos(nuevos);
    if(window.db) window.db.collection("configuracion").doc("capacitacion").set({modulos:nuevos}).catch(function(e){console.error("[DASA] módulos:",e);});
  };
  return {carteras:carteras,modulos:modulos,gestores:gestores,guardarModulos:guardarModulos};
}

// ── Fecha de última actualización de un contenido + "vencido" (>6 meses) ─────
function _fechaActEpoch(c){
  if(c&&c.actualizadoEn){var e=Date.parse(c.actualizadoEn.length<=10?(c.actualizadoEn+"T00:00:00"):c.actualizadoEn);if(e)return e;}
  if(c&&c.createdAt&&c.createdAt.seconds) return c.createdAt.seconds*1000;
  if(c&&c.fecha&&/^\d{2}\/\d{2}\/\d{4}$/.test(c.fecha)){var p=c.fecha.split("/");var e2=Date.parse(p[2]+"-"+p[1]+"-"+p[0]+"T00:00:00");if(e2)return e2;}
  return 0;
}
function _fechaActLabel(c){var e=_fechaActEpoch(c);if(!e)return (c&&c.fecha)||"—";var d=new Date(e);var z=function(n){return (n<10?"0":"")+n;};return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear();}
function _vencido(c){var e=_fechaActEpoch(c);if(!e)return false;return (Date.now()-e)>1000*60*60*24*183;}

// Fila de un material (título + tipo + fecha de actualización + aviso de vencido + abrir)
function ContenidoRow({c}){
  var venc=_vencido(c);
  var ic=(tipoIconos[c.tipo]||"📄");
  return <div style={{background:C.white,border:`1px solid ${venc?C.warn+"66":C.border}`,borderRadius:12,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>

      <span style={{fontSize:18}}>{ic}</span>
      <div style={{minWidth:0}}>
        <div style={{fontSize:14,fontWeight:600,color:C.text}}>{c.titulo||"(sin título)"}</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <span>{c.tipo||"material"}{c.tamanio?" · "+c.tamanio:""}</span>
          <span>Actualizado: {_fechaActLabel(c)}</span>
          {venc&&<span style={{fontSize:11,fontWeight:700,color:C.warn,background:C.warn+"18",border:`1px solid ${C.warn}44`,borderRadius:20,padding:"1px 8px"}}>⚠ Desactualizado</span>}
        </div>
      </div>
    </div>
    {c.url
      ?<a href={c.url} target="_blank" rel="noopener" style={{padding:"6px 14px",border:`1px solid ${C.green}`,borderRadius:8,background:`${C.green}10`,color:C.green,textDecoration:"none",fontSize:13,fontWeight:600}}>Abrir</a>
      :<span style={{fontSize:12,color:C.muted}}>sin archivo</span>}
  </div>;
}

    window.db.collection("contenido").get().then(function(s){setContenido(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){setContenido([]);});
    window.db.collection("evaluaciones").get().then(function(s){setEvals(s.docs.map(function(d){return d.data();}));}).catch(function(){});
    window.db.collection("resultados_evaluaciones").get().then(function(s){setResultados(s.docs.map(function(d){return d.data();}));}).catch(function(){});
    if(isSuper) window.db.collection("usuarios").get().then(function(s){setGestores(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(u){return (u.role||"gestor")==="gestor";}));}).catch(function(){});
  },[]);

  var generales=(modulos||[]).filter(function(m){return (m.cartera||"General")==="General";}).sort(function(a,b){return (a.orden||0)-(b.orden||0);});
  var evalsDe=function(mid){return evals.filter(function(e){return e.modulo===mid;});};
  var completoModulo=function(uid,mid){
    var eids=evalsDe(mid).map(function(e){return String(e.id);});
    if(!eids.length) return null;
    return resultados.some(function(r){return String(r.gestorId)===String(uid)&&r.estado==="aprobado"&&eids.indexOf(String(r.evalId))>=0;});
  };
  var conEval=generales.filter(function(m){return evalsDe(m.id).length>0;});

  if(contenido===null) return <div><SecTitle icon="🎓">Ruta inicial</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div></Card></div>;

  if(isSuper){
    var filas=gestores.map(function(g){
      var hechos=conEval.filter(function(m){return completoModulo(g.id,m.id)===true;}).length;
      return {g:g,hechos:hechos,tot:conEval.length,pct:conEval.length?Math.round(hechos/conEval.length*100):0};
    }).sort(function(a,b){return b.pct-a.pct;});
    return <div>
      <SecTitle icon="🎓">Ruta inicial — avance del equipo</SecTitle>
      <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.6}}>
        Módulos generales obligatorios para el alta. Un módulo cuenta como completado cuando el operador aprueba su evaluación.
        {conEval.length===0&&<div style={{marginTop:6,color:C.warn,fontWeight:600}}>⚠ Todavía no hay evaluaciones cargadas en los módulos generales, así que no se puede medir el avance. Cargalas en “Evaluaciones y progreso”.</div>}
      </div>
      <Card mb={0}>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {filas.length===0&&<div style={{textAlign:"center",padding:20,color:C.muted,fontSize:13}}>No hay gestores cargados.</div>}
          {filas.map(function(f){var col=f.pct>=100?C.green:f.pct>0?C.warn:C.danger;return <div key={f.g.id} style={{display:"flex",alignItems:"center",gap:14,padding:"11px 14px",background:C.white,border:`1px solid ${C.border}`,borderRadius:12}}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600,color:C.text,marginBottom:4}}>{f.g.name||f.g.user||"—"} <span style={{fontSize:11,color:C.muted}}>· {f.g.cliente||"sin cartera"}</span></div>
              <div style={{height:6,background:C.border,borderRadius:3,overflow:"hidden",maxWidth:300}}><div style={{height:"100%",width:f.pct+"%",background:col,borderRadius:3}}/></div>
            </div>
            <div style={{textAlign:"right",minWidth:90}}><div style={{fontSize:18,fontWeight:800,color:col}}>{f.hechos}/{f.tot}</div><div style={{fontSize:11,color:col,fontWeight:600}}>{f.pct}%{f.pct>=100?" ✓":""}</div></div>
          </div>;})}
        </div>
      </Card>
    </div>;
  }

  var completados=conEval.filter(function(m){return completoModulo(user.uid,m.id)===true;}).length;
  var pct=conEval.length?Math.round(completados/conEval.length*100):0;
  return <div>
    <SecTitle icon="🎓">Ruta inicial</SecTitle>
    <Card>
      <div style={{fontSize:13,fontWeight:700,color:C.text}}>Obligatoria para el alta{conEval.length?" · "+completados+" de "+conEval.length+" completados":""}</div>
      {conEval.length>0&&<div style={{height:8,background:C.border,borderRadius:5,overflow:"hidden",margin:"10px 0"}}><div style={{height:"100%",width:pct+"%",background:pct>=100?C.green:C.info,borderRadius:5,transition:"width .3s"}}/></div>}
      <div style={{fontSize:12,color:C.muted,marginTop:conEval.length?0:8}}>Son los módulos generales que todo ingreso tiene que completar. Rendí la evaluación de cada módulo en “Evaluaciones y progreso”.</div>
    </Card>
    {generales.map(function(m){
      var items=(contenido||[]).filter(function(c){return c.modulo===m.id;});
      var comp=completoModulo(user.uid,m.id);
      var badge=comp===null?{t:"Sin evaluación",c:C.muted}:comp?{t:"✓ Completado",c:C.green}:{t:"Pendiente",c:C.warn};
      return <Card key={m.id}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
          <div style={{fontSize:14,fontWeight:700,color:C.text}}>{m.nombre}</div>
          <span style={{fontSize:12,fontWeight:700,color:badge.c,background:badge.c+"15",border:`1px solid ${badge.c}44`,borderRadius:20,padding:"3px 12px"}}>{badge.t}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {items.length===0?<div style={{fontSize:12,color:C.muted}}>Sin material cargado en este módulo.</div>:items.map(function(c){return <ContenidoRow key={c.id} c={c}/>;})}
        </div>
      </Card>;
    })}
  </div>;
}

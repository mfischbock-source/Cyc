// ── REFUERZO (gestor): cursos que la supervisora le asignó ───────────────────
// ── REFUERZO (gestor): cursos que la supervisora le asignó, con examen incluido ──
function VCursosGestor({user,modo}){
  var esInd=modo==="induccion";
  var titulo=esInd?"Mi capacitación":"Refuerzo";
  const [cursos,setCursos]=useState(null);
  const [misRes,setMisRes]=useState([]);
  const [taking,setTaking]=useState(null);   // curso que se está rindiendo
  const [answers,setAnswers]=useState({});
  const [enviando,setEnviando]=useState(false);
  const [final,setFinal]=useState(null);

  const cargar=function(){
    if(!window.db){setCursos([]);return;}
    window.db.collection("cursos").get().then(function(s){setCursos(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){setCursos([]);});
    if(user&&user.uid) window.db.collection("resultados_evaluaciones").where("gestorId","==",user.uid).get().then(function(s){setMisRes(s.docs.map(function(d){return d.data();}));}).catch(function(){});
  };
  useEffect(cargar,[]);

  var uid=String(user&&user.uid||"");
  var mios=(cursos||[]).filter(function(c){if(c.activo===false)return false;if(esInd)return c.tipo==="induccion";return c.tipo!=="induccion" && (c.gestores||c.gestoresAsig||[]).map(String).indexOf(uid)>=0;});
  var aprobado=function(cid){return misRes.some(function(r){return String(r.evalId)===String(cid)&&r.estado==="aprobado";});};

  const enviar=async function(){
    if(!taking)return;
    var qs=(taking.examen&&taking.examen.preguntas)||[];
    var correctas=qs.reduce(function(a,q,qi){return a+(answers[qi]===q.correcta?1:0);},0);
    var nota=Math.round((correctas/qs.length)*100)/10;
    var notaMin=(taking.examen&&taking.examen.notaMinima)||6;
    var estado=nota>=notaMin?"aprobado":"reprobado";
    var intento=misRes.filter(function(r){return String(r.evalId)===String(taking.id);}).length+1;
    var doc={id:String(taking.id)+"__"+uid+"__"+intento,evalId:taking.id,evalTitulo:taking.nombre,tipo:"refuerzo",
      gestorId:uid,gestorNombre:user.name,gestorLegajo:user.legajo||"",fecha:new Date().toISOString().slice(0,10),
      nota:nota,correctas:correctas,total:qs.length,estado:estado,intento:intento};
    setEnviando(true);
    if(window.db){try{await window.db.collection("resultados_evaluaciones").doc(doc.id).set(doc);}catch(e){console.error("[DASA] resultado refuerzo:",e);}}
    setEnviando(false);
    setMisRes(function(p){return p.concat([doc]);});
    setFinal({estado:estado,nota:nota,notaMin:notaMin,correctas:correctas,total:qs.length,nombre:taking.nombre});
    setTaking(null);setAnswers({});
  };

  if(cursos===null) return <div><SecTitle icon="📌">{titulo}</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div></Card></div>;

  // Pantalla: rindiendo examen
  if(taking){
    var qs=(taking.examen&&taking.examen.preguntas)||[];
    var respondidas=qs.filter(function(_,qi){return answers[qi]!==undefined;}).length;
    return <div>
      <SecTitle icon="📝">{taking.nombre} — examen</SecTitle>
      <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px"}}>{qs.length} preguntas · aprobás con {(taking.examen&&taking.examen.notaMinima)||6} o más (sobre 10).</div>
      {qs.map(function(q,qi){return <Card key={qi}>
        <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:12}}>{qi+1}. {q.preg}</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {q.opciones.map(function(op,oi){var s=answers[qi]===oi;return <label key={oi} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`1.5px solid ${s?C.green:C.border}`,background:s?C.pale:C.white,cursor:"pointer"}}>
            <input type="radio" name={"rq"+qi} checked={s} onChange={function(){setAnswers(function(p){var n=Object.assign({},p);n[qi]=oi;return n;});}} style={{accentColor:C.green,width:16,height:16}}/>
            <span style={{fontSize:13,color:C.text}}>{op}</span>
          </label>;})}
        </div>
      </Card>;})}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",bottom:0,background:C.bg,padding:"12px 0"}}>
        <button onClick={function(){setTaking(null);setAnswers({});}} style={{padding:"9px 18px",background:C.white,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:13,color:C.muted}}>Cancelar</button>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:12,color:respondidas===qs.length?C.green:C.muted,fontWeight:600}}>{respondidas}/{qs.length} respondidas</span>
          <button onClick={enviar} disabled={respondidas<qs.length||enviando} style={{padding:"10px 24px",background:(respondidas<qs.length||enviando)?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:(respondidas<qs.length||enviando)?"not-allowed":"pointer",fontSize:14,fontWeight:700}}>{enviando?"Enviando…":"Enviar examen"}</button>
        </div>
      </div>
    </div>;
  }

  return <div>
    <SecTitle icon="📌">{titulo}</SecTitle>
    <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.6}}>{esInd?"Tu capacitación de inducción: mirá el material y rendí el examen de cada curso.":"Cursos de refuerzo que te asignó tu supervisora. Mirá el material y rendí el examen."}</div>
    {final&&<div style={{background:(final.estado==="aprobado"?C.green:C.danger)+"0d",border:`2px solid ${(final.estado==="aprobado"?C.green:C.danger)}55`,borderRadius:14,padding:"16px 20px",marginBottom:16,textAlign:"center"}}>
      <div style={{fontSize:32}}>{final.estado==="aprobado"?"✅":"❌"}</div>
      <div style={{fontSize:18,fontWeight:800,color:final.estado==="aprobado"?C.green:C.danger}}>{final.estado==="aprobado"?"Aprobado":"Reprobado"} — {final.nombre}</div>
      <div style={{fontSize:13,color:C.muted,marginTop:4}}>Nota {final.nota}/10 · {final.correctas}/{final.total} correctas · mínimo {final.notaMin}</div>
      <button onClick={function(){setFinal(null);}} style={{marginTop:10,padding:"7px 16px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>Entendido</button>
    </div>}
    {mios.length===0&&<Card mb={0}><div style={{padding:22,textAlign:"center",color:C.muted,fontSize:13}}>{esInd?"Todavía no hay cursos de inducción cargados. Tu supervisora los crea desde su panel.":"No tenés cursos de refuerzo asignados por ahora."}</div></Card>}
    {mios.map(function(c){
      var mats=c.materiales||[];
      var qs=(c.examen&&c.examen.preguntas)||[];
      var ap=aprobado(c.id);
      return <Card key={c.id}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:c.desc?4:10}}>
          <div style={{fontSize:15,fontWeight:800,color:C.text}}>🎓 {c.nombre}</div>
          {qs.length>0&&<span style={{fontSize:12,fontWeight:700,color:ap?C.green:C.warn,background:(ap?C.green:C.warn)+"15",border:`1px solid ${(ap?C.green:C.warn)}44`,borderRadius:20,padding:"3px 12px"}}>{ap?"✓ Completado":"Examen pendiente"}</span>}
        </div>
        {c.desc&&<div style={{fontSize:13,color:C.muted,marginBottom:12}}>{c.desc}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:qs.length?12:0}}>
          {mats.length===0?<div style={{fontSize:12,color:C.muted}}>Sin material cargado.</div>:mats.map(function(m,i){return <ContenidoRow key={i} c={m}/>;})}
        </div>
        {qs.length>0&&<button onClick={function(){setTaking(c);setAnswers({});setFinal(null);}} style={{padding:"9px 20px",background:ap?C.white:C.green,color:ap?C.green:C.white,border:`1px solid ${C.green}`,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>{ap?"Volver a rendir":"Rendir examen ("+qs.length+" preguntas)"}</button>}
      </Card>;
    })}
  </div>;
}

// Estado de vencimiento de un material según "revisar cada X días" (o 6 meses por defecto).
function _venceEstado(c){
  var e=_fechaActEpoch(c); if(!e) return null;
  var dias=(c&&c.revisarCadaDias&&parseInt(c.revisarCadaDias))||183;
  var deadline=e+dias*86400000, now=Date.now();
  if(now>=deadline) return {t:"Vencido",c:C.danger};
  if(now>=deadline-15*86400000) return {t:"Vence pronto",c:C.danger};
  return null;
}
// Tarjeta de material con estado + "marcar visto" (para la capacitación inicial).
function _fmtSeg(s){s=Math.round(s||0);if(s<=0)return "—";if(s<60)return s+"s";var m=Math.floor(s/60),r=s%60;return m+"m"+(r?" "+r+"s":"");}

// Tarjeta de material con estado, tiempo visto y "marcar visto".
function MaterialCard({c,visto,tiempo,onVisto,onAbrir}){
  var ic=(tipoIconos[c.tipo]||"📄");

    <span style={{fontSize:20}}>{ic}</span>
    <div style={{flex:1,minWidth:160}}>
      <div style={{fontSize:14,fontWeight:600,color:C.text}}>{c.titulo||"(sin título)"}</div>
      <div style={{fontSize:12,color:C.muted,marginTop:2}}>{c.tipo||"material"}{c.tamanio?" · "+c.tamanio:""} · actualizado {_fechaActLabel(c)}{tiempo>0?" · ⏱ "+_fmtSeg(tiempo)+" visto":""}</div>
    </div>
    <span style={{fontSize:12,fontWeight:700,color:estado.col,background:estado.col+"15",border:`1px solid ${estado.col}44`,borderRadius:20,padding:"3px 12px",whiteSpace:"nowrap"}}>{estado.t}</span>
    {c.url&&<button onClick={function(){onAbrir(c);}} style={{padding:"6px 12px",border:`1px solid ${C.border}`,borderRadius:8,background:C.white,color:C.info,cursor:"pointer",fontSize:12,fontWeight:600}}>Abrir</button>}
    <button onClick={function(){onVisto(c.id);}} style={{padding:"6px 12px",border:`1px solid ${visto?C.border:C.green}`,borderRadius:8,background:visto?C.white:`${C.green}12`,color:visto?C.muted:C.green,cursor:"pointer",fontSize:12,fontWeight:600}}>{visto?"Desmarcar":"Marcar visto"}</button>

}

// ── CAPACITACIÓN INICIAL (gestor nuevo) — con visor interno y medición de tiempo ──
function VInduccion({user}){
  const {modulos,carteras}=useCatalogos();
  const [contenido,setContenido]=useState(null);
  const [vistos,setVistos]=useState({});
  const [tiempos,setTiempos]=useState({});
  const [cli,setCli]=useState(user&&user.cliente?user.cliente:"Todos");
  const [viendo,setViendo]=useState(null);
  const segRef=useRef(0);
  useEffect(function(){
    if(!window.db){setContenido([]);return;}
    window.db.collection("contenido").get().then(function(s){setContenido(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){setContenido([]);});
    if(user&&user.uid) window.db.collection("progreso_capacitacion").doc(user.uid).get().then(function(d){if(d.exists){var v=d.data()||{};setVistos(v.vistos||{});setTiempos(v.tiempos||{});}}).catch(function(){});
  },[]);
  // Cronómetro del visor: cuenta solo mientras la pestaña está visible; al cerrar, guarda el tiempo.
  useEffect(function(){
    if(!viendo) return;
    segRef.current=0;
    var iv=setInterval(function(){ if(document.visibilityState==="visible") segRef.current+=1; },1000);
    var id=viendo.id;
    return function(){
      clearInterval(iv);
      var add=segRef.current;
      if(add>0){
        setTiempos(function(p){var n=Object.assign({},p);n[id]=(n[id]||0)+add;return n;});
        if(window.db&&user&&user.uid) window.db.collection("progreso_capacitacion").doc(user.uid).set({tiempos:{[id]:firebase.firestore.FieldValue.increment(add)},aperturas:{[id]:firebase.firestore.FieldValue.increment(1)}},{merge:true}).catch(function(e){console.error("[DASA] tiempo:",e);});
      }
    };
  },[viendo]);
  var bancos=Array.from(new Set([].concat((modulos||[]).map(function(m){return m.cartera;})).concat((carteras||[]).map(function(c){return c.nombre;})).filter(function(x){return x&&x!=="General";})));
  var marcarVisto=function(id){
    setVistos(function(p){
      var n=Object.assign({},p);
      if(n[id]) delete n[id]; else n[id]=new Date().toISOString().slice(0,10);
      if(window.db&&user&&user.uid) window.db.collection("progreso_capacitacion").doc(user.uid).set({vistos:n},{merge:true}).catch(function(e){console.error("[DASA] progreso:",e);});
      return n;
    });
  };

  if(contenido===null) return <div><SecTitle icon="🎓">Capacitación inicial</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div></Card></div>;

  var institucional=(contenido||[]).filter(function(c){return (c.cartera||"General")==="General";});
  var porCliente=(cli!=="Todos")?(contenido||[]).filter(function(c){return c.cartera===cli;}):[];
  var total=institucional.concat(porCliente).length, hechos=institucional.concat(porCliente).filter(function(c){return vistos[c.id];}).length;
  var pct=total?Math.round(hechos/total*100):0;
  var tipoVisor=function(c){var t=(c.tipo||"").toLowerCase();var e=(String(c.url||"").split(".").pop()||"").toLowerCase();if(t==="video"||["mp4","webm","mov"].indexOf(e)>=0)return "video";if(t==="audio"||["mp3","wav","m4a"].indexOf(e)>=0)return "audio";return "pdf";};

  return <div>
    <SecTitle icon="🎓">Capacitación inicial</SecTitle>
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:10}}>
        <div>
          <div style={{fontSize:15,fontWeight:800,color:C.text}}>Tu capacitación</div>
          <div style={{fontSize:13,color:C.muted}}>{hechos} de {total} completados</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:12,color:C.muted}}>Cliente:</span>
          <select value={cli} onChange={function(e){setCli(e.target.value);}} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,background:C.white}}>
            <option value="Todos">Todos los clientes</option>
            {bancos.map(function(b){return <option key={b} value={b}>{b}</option>;})}
          </select>
        </div>
      </div>
      <div style={{height:10,background:C.border,borderRadius:6,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:pct>=100?C.green:C.info,borderRadius:6,transition:"width .3s"}}/></div>
    </Card>

    <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.6,margin:"18px 0 8px"}}>Institucional</div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {institucional.length===0?<div style={{fontSize:13,color:C.muted}}>Sin material institucional cargado.</div>:institucional.map(function(c){return <MaterialCard key={c.id} c={c} visto={!!vistos[c.id]} tiempo={tiempos[c.id]||0} onVisto={marcarVisto} onAbrir={setViendo}/>;})}
    </div>

    <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:.6,margin:"20px 0 8px"}}>Por cliente{cli!=="Todos"?" · "+cli:""}</div>
    {cli==="Todos"
      ?<div style={{fontSize:13,color:C.muted,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px"}}>Elegí un cliente arriba a la derecha para ver el material específico de esa cartera (scripts, políticas).</div>
      :<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {porCliente.length===0?<div style={{fontSize:13,color:C.muted}}>Sin material específico de {cli} por ahora.</div>:porCliente.map(function(c){return <MaterialCard key={c.id} c={c} visto={!!vistos[c.id]} tiempo={tiempos[c.id]||0} onVisto={marcarVisto} onAbrir={setViendo}/>;})}
      </div>}

    {/* Visor interno — mide el tiempo real que se le dedica */}
    {viendo&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:9999,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px",color:"#fff"}}>
        <div style={{fontSize:15,fontWeight:700}}>{(tipoIconos[viendo.tipo]||"📄")} {viendo.titulo}</div>
        <button onClick={function(){setViendo(null);}} style={{padding:"7px 18px",background:C.green,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700}}>✕ Cerrar</button>
      </div>
      <div style={{flex:1,background:"#111",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
        {tipoVisor(viendo)==="video"?<video src={viendo.url} controls autoPlay style={{maxWidth:"100%",maxHeight:"100%"}}/>
          :tipoVisor(viendo)==="audio"?<audio src={viendo.url} controls autoPlay style={{width:"80%"}}/>
          :<iframe src={viendo.url} title="material" style={{width:"100%",height:"100%",border:"none",background:"#fff"}}/>}
      </div>
      <div style={{padding:"8px 18px",color:"rgba(255,255,255,0.7)",fontSize:12,textAlign:"center"}}>El tiempo que dedicás a este material queda registrado. Cuando termines, tocá “Marcar visto”.</div>
    </div>}
  </div>;
}

// ── SEGUIMIENTO DE CAPACITACIÓN (supervisora): quién vio qué y cuánto tiempo ────
function VSeguimientoCap(){
  const [users,setUsers]=useState(null);
  const [prog,setProg]=useState({});
  const [contenido,setContenido]=useState([]);
  const [sel,setSel]=useState(null);
  useEffect(function(){
    if(!window.db){setUsers([]);return;}
    window.db.collection("usuarios").get().then(function(s){setUsers(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(u){return (u.role||"gestor")!=="supervisor";}));}).catch(function(){setUsers([]);});
    window.db.collection("progreso_capacitacion").get().then(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data();});setProg(m);}).catch(function(){});
    window.db.collection("contenido").get().then(function(s){setContenido(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){});
  },[]);
  if(users===null) return <div><SecTitle icon="📈">Seguimiento de capacitación</SecTitle><Card mb={0}><div style={{textAlign:"center",padding:30,color:C.muted,fontSize:13}}>Cargando…</div></Card></div>;

  var institucional=contenido.filter(function(c){return (c.cartera||"General")==="General";});
  var matDe=function(u){var pc=(u.cliente&&u.cliente!=="General")?contenido.filter(function(c){return c.cartera===u.cliente;}):[];return institucional.concat(pc);};
  var filas=users.map(function(u){
    var p=prog[u.id]||{}, vistos=p.vistos||{}, tiempos=p.tiempos||{};
    var mats=matDe(u);
    var vis=mats.filter(function(c){return vistos[c.id];}).length;
    var tiempoTot=mats.reduce(function(a,c){return a+(tiempos[c.id]||0);},0);
    var sospechosos=mats.filter(function(c){return vistos[c.id]&&(tiempos[c.id]||0)<15;}).length; // marcado sin dedicarle tiempo
    return {u:u,mats:mats,vistos:vistos,tiempos:tiempos,vis:vis,tot:mats.length,pct:mats.length?Math.round(vis/mats.length*100):0,tiempoTot:tiempoTot,sosp:sospechosos};
  }).sort(function(a,b){if((a.u.role==="ingreso")!==(b.u.role==="ingreso"))return a.u.role==="ingreso"?-1:1;return b.pct-a.pct;});

  return <div>
    <SecTitle icon="📈">Seguimiento de capacitación</SecTitle>
    <div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.6}}>
      Progreso de cada empleado y <strong>tiempo real</strong> que le dedicó a cada material (el reloj cuenta solo mientras tienen el material abierto y la pestaña activa). El aviso ⚠ marca material dado por “visto” en menos de 15 segundos — probablemente no lo leyeron.
    </div>
    <Card mb={0}>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filas.length===0&&<div style={{textAlign:"center",padding:20,color:C.muted,fontSize:13}}>No hay empleados cargados.</div>}
        {filas.map(function(f){var open=sel===f.u.id;var col=f.pct>=100?C.green:f.pct>0?C.warn:C.danger;return <div key={f.u.id} style={{border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
          <div onClick={function(){setSel(open?null:f.u.id);}} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",cursor:"pointer",background:C.white}}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600,color:C.text}}>{f.u.name||f.u.user||"—"} <span style={{fontSize:11,color:C.muted}}>· {f.u.role==="ingreso"?"Gestor nuevo":"Gestor"}{f.u.cliente?" · "+f.u.cliente:""}</span></div>
              <div style={{height:6,background:C.border,borderRadius:3,overflow:"hidden",maxWidth:280,marginTop:5}}><div style={{height:"100%",width:f.pct+"%",background:col,borderRadius:3}}/></div>
            </div>
            <div style={{textAlign:"center",minWidth:70}}><div style={{fontSize:17,fontWeight:800,color:col}}>{f.vis}/{f.tot}</div><div style={{fontSize:11,color:col}}>{f.pct}%</div></div>
            <div style={{textAlign:"center",minWidth:80}}><div style={{fontSize:13,fontWeight:700,color:C.text}}>⏱ {_fmtSeg(f.tiempoTot)}</div><div style={{fontSize:11,color:C.muted}}>tiempo total</div></div>
            {f.sosp>0&&<span style={{fontSize:11,fontWeight:700,color:C.danger,background:`${C.danger}12`,border:`1px solid ${C.danger}44`,borderRadius:20,padding:"3px 10px"}}>⚠ {f.sosp} sin leer</span>}
            <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
          </div>
          {open&&<div style={{padding:"6px 16px 14px",borderTop:`1px solid ${C.border}`,background:C.bg}}>
            {f.mats.length===0?<div style={{fontSize:12,color:C.muted,padding:"10px 0"}}>Sin material asignado a su cartera.</div>:f.mats.map(function(c){
              var v=!!f.vistos[c.id], t=f.tiempos[c.id]||0, sosp=v&&t<15;
              return <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                <span style={{fontSize:15}}>{tipoIconos[c.tipo]||"📄"}</span>
                <span style={{flex:1,color:C.text}}>{c.titulo}<span style={{fontSize:11,color:C.muted}}>{c.cartera&&c.cartera!=="General"?" · "+c.cartera:" · Institucional"}</span></span>
                <span style={{fontSize:12,color:t>0?C.text:C.muted,minWidth:70,textAlign:"right"}}>⏱ {_fmtSeg(t)}</span>
                <span style={{fontSize:12,fontWeight:700,color:v?(sosp?C.danger:C.green):C.muted,minWidth:90,textAlign:"right"}}>{v?(sosp?"⚠ visto (poco)":"✓ visto"):"pendiente"}</span>
              </div>;
            })}
          </div>}
        </div>;})}
      </div>
    </Card>
  </div>;
}

function SVContenidoMat(){
  const {carteras,modulos,gestores,guardarModulos}=useCatalogos();
  const [subTab,setSubTab]=useState("inicial");
  const [contenido,setContenido]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [filtroCartera,setFiltroCartera]=useState("Todos");
  const [filtroModulo,setFiltroModulo]=useState("Todos");
  const [uploadModal,setUploadModal]=useState(false);
  const [moduloModal,setModuloModal]=useState(false);
  const [nuevoContenido,setNuevoContenido]=useState({titulo:"",tipo:"pdf",modulo:"",cartera:"General",subtipo:"inicial",revisarCadaDias:""});
  const [nuevoModulo,setNuevoModulo]=useState("");
  const [archivo,setArchivo]=useState(null);
  const [subiendo,setSubiendo]=useState(false);
  const [progreso,setProgreso]=useState(0);
  const [errorUp,setErrorUp]=useState("");
  const fileRef=useRef(null);

  // Cargar contenido real desde Firestore (si no hay Firebase, usa el demo)
  useEffect(()=>{
    if(!window.db){ setContenido(contenidoInit); setCargando(false); return; }
    window.db.collection("contenido").get()
      .then(snap=>{
        const items=snap.docs.map(d=>({id:d.id,...d.data()}));
        items.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
        setContenido(items); setCargando(false);
      })
      .catch(e=>{ console.error("[DASA] cargar contenido:",e); setContenido(contenidoInit); setCargando(false); });
  },[]);

  const shown=contenido.filter(c=>
    c.subtipo===subTab &&
    (filtroCartera==="Todos"||c.cartera===filtroCartera||filtroCartera==="General") &&
    (filtroModulo==="Todos"||c.modulo===parseInt(filtroModulo))
  );

  const fmtTam=(b)=>{ if(!b)return "—"; if(b>1048576)return (b/1048576).toFixed(1)+" MB"; return Math.max(1,Math.round(b/1024))+" KB"; };

  const subirContenido=async()=>{
    setErrorUp("");
    if(!nuevoContenido.titulo){ setErrorUp("Poné un título."); return; }
    if(!archivo){ setErrorUp("Seleccioná un archivo."); return; }
    if(!window.db){ setErrorUp("Firebase no disponible (no se puede guardar la ficha)."); return; }
    setSubiendo(true); setProgreso(0);
    try{
      // 1) Subir el archivo al server de DASA (upload.php)
      const fd=new FormData();
      fd.append("file",archivo);
      fd.append("subtipo",nuevoContenido.subtipo);
      fd.append("cartera",nuevoContenido.cartera||"General");
      const resp=await new Promise((res,rej)=>{
        const xhr=new XMLHttpRequest();
        xhr.open("POST", window.UPLOAD_PROXY||"/upload.php");
        xhr.setRequestHeader("X-DASA-Token", window.NEOTEL_TOKEN||"");
        xhr.upload.onprogress=e=>{ if(e.lengthComputable) setProgreso(Math.round(e.loaded/e.total*100)); };
        xhr.onload=()=>{ try{ const j=JSON.parse(xhr.responseText); (xhr.status>=200&&xhr.status<300&&j.ok)?res(j):rej(new Error(j.error||("HTTP "+xhr.status))); }catch(_){ rej(new Error("Respuesta inválida del server (HTTP "+xhr.status+")")); } };
        xhr.onerror=()=>rej(new Error("Error de red al subir el archivo"));
        xhr.send(fd);
      });
      // 2) Guardar la ficha (metadata) en Firestore
      const doc={
        titulo:nuevoContenido.titulo, tipo:nuevoContenido.tipo,
        modulo:parseInt(nuevoContenido.modulo)||1, cartera:nuevoContenido.cartera||"General",
        subtipo:nuevoContenido.subtipo, url:resp.url, storagePath:resp.path,
        filename:resp.filename, tamanio:fmtTam(resp.size),
        fecha:new Date().toLocaleDateString("es-AR"),
        actualizadoEn:new Date().toISOString().slice(0,10),
        revisarCadaDias:parseInt(nuevoContenido.revisarCadaDias)||0,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      const r=await window.db.collection("contenido").add(doc);
      setContenido(p=>[{id:r.id,...doc,createdAt:{seconds:Math.floor(Date.now()/1000)}},...p]);
      setUploadModal(false); setArchivo(null); setProgreso(0);
      setNuevoContenido({titulo:"",tipo:"pdf",modulo:"",cartera:"General",subtipo:subTab,revisarCadaDias:""});
    }catch(e){
      console.error("[DASA] subir contenido:",e);
      setErrorUp("Error al subir: "+((e&&e.message)||e));
    }
    setSubiendo(false);
  };

  const borrarContenido=async(item)=>{
    if(!window.confirm('¿Borrar el material "'+(item.titulo||"(sin título)")+'"?\nNo se puede deshacer.'))return;
    setContenido(p=>p.filter(c=>c.id!==item.id));
    try{
      if(window.db) await window.db.collection("contenido").doc(String(item.id)).delete();
      if(item.storagePath){
        const fd=new FormData(); fd.append("action","delete"); fd.append("path",item.storagePath);
        await fetch(window.UPLOAD_PROXY||"/upload.php",{method:"POST",headers:{"X-DASA-Token":window.NEOTEL_TOKEN||""},body:fd}).catch(()=>{});
      }
    }catch(e){ console.error("[DASA] borrar contenido:",e); }
  };
  const addModulo=()=>{
    if(!nuevoModulo.trim())return;
    const nid=(modulos.reduce((m,x)=>Math.max(m,x.id||0),0)||0)+1;
    guardarModulos([...modulos,{id:nid,nombre:nuevoModulo.trim(),cartera:"General",orden:modulos.length+1}]);
    setNuevoModulo("");
  };
  const delModulo=(id)=>{ guardarModulos(modulos.filter(m=>m.id!==id)); };

  return <div>
    <SecTitle icon="📖">Administrar contenido</SecTitle>
    <TabBar tabs={[{id:"inicial",label:"🎓 Inicial"},{id:"continua",label:"📚 Continua"}]} active={subTab} onChange={t=>{setSubTab(t);setFiltroCartera("Todos");setFiltroModulo("Todos");}}/>

    {/* FILTROS + ACCIONES */}
    <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
      <select value={filtroCartera} onChange={e=>setFiltroCartera(e.target.value)}
        style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
        <option value="Todos">Todas las carteras</option>
        <option value="General">General</option>
        {carteras.map(ct=><option key={ct.id}>{ct.nombre}</option>)}
      </select>
      <select value={filtroModulo} onChange={e=>setFiltroModulo(e.target.value)}
        style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}>
        <option value="Todos">Todos los módulos</option>
        {modulos.map(m=><option key={m.id} value={m.id}>{m.nombre}</option>)}
      </select>
      <div style={{flex:1}}/>
      <button onClick={()=>setModuloModal(true)}
        style={{padding:"7px 14px",border:`1px solid ${C.green}`,borderRadius:8,background:`${C.green}12`,color:C.green,cursor:"pointer",fontSize:13,fontWeight:600}}>
        ⚙️ Gestionar módulos
      </button>
      <button onClick={()=>{setNuevoContenido({titulo:"",tipo:"pdf",modulo:"",cartera:"General",subtipo:subTab,revisarCadaDias:""});setArchivo(null);setErrorUp("");setProgreso(0);setUploadModal(true);}}
        style={{padding:"7px 16px",background:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
        ⬆️ Subir contenido
      </button>
    </div>

    {/* GRID DE CONTENIDO */}
    {cargando
      ?<div style={{textAlign:"center",padding:"40px",color:C.muted,fontSize:14}}>Cargando contenido…</div>
      :shown.length===0
      ?<div style={{textAlign:"center",padding:"40px",color:C.muted,fontSize:14}}>No hay contenido para esta selección.</div>
      :<div style={{display:"flex",flexDirection:"column",gap:16}}>
        {(function(){
          var grupos={}; shown.forEach(function(c){var k=c.cartera||"General";(grupos[k]=grupos[k]||[]).push(c);});
          var keys=Object.keys(grupos).sort(function(a,b){if(a==="General")return -1;if(b==="General")return 1;return a.localeCompare(b);});
          return keys.map(function(cart){return <div key={cart}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${C.border}`}}>
              <span style={{fontSize:14,fontWeight:800,color:C.text}}>{cart==="General"?"🏛 General (institucional)":"🏦 "+cart}</span>
              <span style={{fontSize:11,color:C.muted}}>{grupos[cart].length} material(es)</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {grupos[cart].map(function(item){
                const mod=modulos.find(m=>m.id===item.modulo);
                return <div key={item.id} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:"13px 16px",display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:46,height:46,borderRadius:10,background:`${C.green}15`,border:`1px solid ${C.paleB}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
                    {tipoIconos[item.tipo]||"📋"}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:C.text,marginBottom:3}}>{item.titulo}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:11,color:C.muted}}>{mod?.nombre||"—"}</span>
                      <span style={{fontSize:11,color:C.muted}}>· {item.fecha} · {item.tamanio}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {item.url
                      ?<button onClick={()=>window.open(item.url,"_blank")} style={{padding:"5px 10px",border:`1px solid ${C.border}`,borderRadius:6,background:C.white,cursor:"pointer",fontSize:12,color:C.info}}>👁 Ver</button>
                      :<span title="Sin archivo cargado" style={{padding:"5px 10px",border:`1px solid ${C.border}`,borderRadius:6,background:C.bg,fontSize:12,color:C.muted}}>sin archivo</span>}
                    <button onClick={()=>borrarContenido(item)} style={{padding:"5px 10px",border:`1px solid ${C.danger}33`,borderRadius:6,background:`${C.danger}08`,cursor:"pointer",fontSize:12,color:C.danger}}>🗑</button>
                  </div>
                </div>;
              })}
            </div>
          </div>;});
        })()}
      </div>
    }

    {/* MODAL UPLOAD */}
    {uploadModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.white,borderRadius:16,padding:28,width:480,maxWidth:"92vw"}}>

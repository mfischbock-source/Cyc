// Componente input estable — definido fuera para no recrearse en cada render
function AdminInput(props){
  var label=props.label, field=props.field, ph=props.ph,
      type=props.type||"text", form=props.form, setForm=props.setForm;
  function handleChange(e){
    var val=e.target.value;
    setForm(function(prev){ var n=Object.assign({},prev); n[field]=val; return n; });
  }
  return React.createElement("div",{style:{marginBottom:10}},
    React.createElement("label",{style:{fontSize:12,color:C.muted,display:"block",marginBottom:4}},label),
    React.createElement("input",{type:type,value:form[field]||"",onChange:handleChange,placeholder:ph,
      style:{width:"100%",padding:"8px 10px",border:"1px solid "+C.border,borderRadius:8,fontSize:13}})
  );
}

// Contraseña inicial al azar (antes era una fija escrita acá, visible para cualquiera).
// Sin caracteres que se confundan (0/O, 1/l/I): se dicta o se copia.
function claveInicialAlAzar(){
  var abc="abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789", out="", b=new Uint8Array(1);
  var tope=256-(256%abc.length);
  while(out.length<12){ crypto.getRandomValues(b); if(b[0]<tope) out+=abc[b[0]%abc.length]; }
  return out;
}

// ── API NEOTEL ────────────────────────────────────────────────────────────
function SVApiNeotel(){
  const [checks,setChecks]=useState(null);   // {logins:{ok,msg}, prod:{ok,msg}}
  const [testing,setTesting]=useState(false);
  const hoy=new Date().toISOString().slice(0,10);
  const probar=async function(){
    setTesting(true);setChecks(null);
    var out={};
    async function run(key,body){
      try{
        var r=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify(body)});
        var d=await r.json();
        if(d&&d.error){out[key]={ok:false,msg:d.error};}
        else{
          // contar el primer array que devuelva Neotel (logins/equipo/calls/…)
          var n=null;
          if(d&&typeof d==="object"){for(var kk in d){if(Array.isArray(d[kk])){n=d[kk].length;break;}}}
          if(n===null&&d&&d.resumen&&typeof d.resumen.total==="number")n=d.resumen.total;
          out[key]={ok:true,msg:(n!==null?n+" registros":"respuesta OK")};
        }
      }catch(e){out[key]={ok:false,msg:(e&&e.message)||"error de red"};}
    }
    await run("logins",{action:"logins",fecha:hoy});
    await run("prod",{action:"team_productivity",fecha:hoy});
    setChecks(out);setTesting(false);
  };
  const allOk=checks&&Object.keys(checks).every(function(k){return checks[k].ok;});
  const anyErr=checks&&Object.keys(checks).some(function(k){return !checks[k].ok;});

  return <div>
    <SecTitle icon="📡">Conexión con Neotel</SecTitle>
    <div style={{fontSize:13,color:C.muted,marginBottom:18,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"12px 16px",lineHeight:1.7}}>
      La plataforma se conecta a Neotel <strong>en vivo</strong> por consulta SQL directa (solo lectura): cada vez que cargás llamadas, audios, productividad o logueos, se piden a Neotel <strong>en el momento</strong>. No hay una sincronización programada que pueda "quedar desconectada", ni credenciales para configurar acá — la conexión con Neotel vive en el servidor.
    </div>

    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
        <CardTitle>🔌 Estado de conexión (prueba en vivo)</CardTitle>
        <button onClick={probar} disabled={testing} style={{padding:"9px 18px",background:testing?C.muted:C.green,color:"#fff",border:"none",borderRadius:8,cursor:testing?"not-allowed":"pointer",fontSize:13,fontWeight:700}}>{testing?"Probando…":"Probar conexión ahora"}</button>
      </div>
      {!checks&&!testing&&<div style={{fontSize:13,color:C.muted}}>Tocá "Probar conexión ahora": consulta Neotel en vivo (logueos y productividad de hoy) y te muestra el resultado real.</div>}
      {testing&&<div style={{fontSize:13,color:C.info}}>⏳ Consultando Neotel…</div>}
      {checks&&<div>
        <div style={{marginBottom:12,fontSize:14,fontWeight:700,color:allOk?C.green:C.danger}}>{allOk?"✅ Neotel responde — conexión OK":"❌ Hay un problema para conectar con Neotel"}</div>
        {[{k:"logins",l:"Logueos de hoy (action: logins)"},{k:"prod",l:"Productividad del equipo hoy (action: team_productivity)"}].map(function(row){
          var c=checks[row.k];if(!c)return null;
          return <div key={row.k} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:c.ok?C.pale:"#fce8e8",border:`1px solid ${c.ok?C.paleB:C.danger+"33"}`,borderRadius:8,marginBottom:6}}>
            <span style={{fontSize:15,flexShrink:0}}>{c.ok?"✅":"❌"}</span>
            <span style={{flex:1,fontSize:13,color:C.text}}>{row.l}</span>
            <span style={{fontSize:12,color:c.ok?C.green:C.danger,fontWeight:600}}>{c.msg}</span>
          </div>;
        })}
        {anyErr&&<div style={{background:"#fff8e1",border:`1px solid ${C.warn}44`,borderRadius:8,padding:"10px 14px",fontSize:12,color:C.muted,marginTop:8,lineHeight:1.7}}>
          Si falla: 1) que el servidor tenga conexión con Neotel; 2) que el driver SQL del server esté OK (es config del servidor); 3) reintentá en unos minutos. La app no guarda credenciales de Neotel.
        </div>}
      </div>}
    </Card>

    <Card mb={0}>
      <CardTitle>ℹ️ Cómo funciona la integración</CardTitle>
      <div style={{fontSize:13,color:C.text,lineHeight:1.8}}>
        <div style={{marginBottom:8}}>• <strong>En vivo, no sincronizada:</strong> los datos se leen de Neotel en el momento en que los pedís (no hay copia local que se "desactualice").</div>
        <div style={{marginBottom:8}}>• <strong>Solo lectura:</strong> la plataforma NUNCA escribe en Neotel — un candado en el servidor bloquea todo lo que no sea una consulta de lectura.</div>
        <div style={{marginBottom:8}}>• <strong>Qué se consulta:</strong> llamadas y grabaciones (calidad/auditorías), productividad y logueos.</div>
        <div>• <strong>Dónde se configura:</strong> la conexión con Neotel (acceso SQL) vive en el servidor, no en esta pantalla.</div>
      </div>
    </Card>
  </div>;
}


</script>
<script type="text/babel">

// ── AUDIOS PARA AUDITORÍAS EXTERNAS ─────────────────────────────────────

// ── PESTAÑA "LLAMADAS" ──────────────────────────────────────────────────────
// TODAS las llamadas de Neotel (atendidas con grabación) cruzadas con lo ya
// analizado en Firestore. Se puede agrupar por cartera o por operador y filtrar
// por analizadas / pendientes. Sirve para ver qué falta analizar en cada operador.
function SVLlamadas({gestorFijo,user}={}){
  const hoy=new Date().toISOString().slice(0,10);
  // Llamadas principal: por defecto ayer+hoy (antes solo hoy). Operador embebido: última semana.
  const _iniDesde=gestorFijo?(function(){var d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})():(function(){var d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);})();
  // Persistimos el estado de esta vista por contexto (pestaña Llamadas = "main"; operador embebido = por id).
  var _pk="svll_"+(gestorFijo?gestorFijo.id:"main")+".";
  const [desde,setDesde]=usePersist(_pk+"desde",_iniDesde);
  const [hasta,setHasta]=usePersist(_pk+"hasta",hoy);
  const [gestores,setGestores]=useState([]);
  const [carteraSel,setCarteraSel]=usePersist(_pk+"carteraSel",gestorFijo?(gestorFijo.cliente||"Todas"):"Todas");
  const [operadorSel,setOperadorSel]=usePersist(_pk+"operadorSel",gestorFijo?(gestorFijo.name||"Todos"):"Todos");
  const [agrupar,setAgrupar]=usePersist(_pk+"agrupar",gestorFijo?"tipificacion":"cartera");   // cartera | operador | tipificacion
  const [orden,setOrden]=usePersist(_pk+"orden","reciente");   // reciente (default: más nuevas arriba) | relevante (rechazadas al fondo)
  const [reglasTip,setReglasTip]=useState({});   // override manual de qué tipificaciones se descartan
  const [modoTip,setModoTip]=useState("blacklist");  // "whitelist" = solo se analiza lo marcado (pago)
  useEffect(function(){ if(window.db)window.db.collection("configuracion").doc("tipificaciones").get().then(function(d){ if(d.exists){ if(d.data().reglas)setReglasTip(d.data().reglas); setModoTip(d.data().modo||"blacklist"); } }).catch(function(){}); },[]);
  const [verFiltro,setVerFiltro]=usePersist(_pk+"verFiltro","todas"); // todas | ok | pend
  const [q,setQ]=usePersist(_pk+"q","");                      // buscador por teléfono / operador
  const [filtroTips,setFiltroTips]=usePersist(_pk+"filtroTips",[]);    // filtro multi-tipificación (vacío = todas)
  const [tipOpen,setTipOpen]=useState(false);       // dropdown de tipificaciones abierto
  const [calls,setCalls]=usePersist(_pk+"calls",null);            // llamadas analizables traídas de Neotel
  const [analizadas,setAnalizadas]=usePersist(_pk+"analizadas",{});    // grabacion -> {score, es_valida, criterios, analisis, recomendacion, modelo, cliente}
  const [selDet,setSelDet]=useState(null);          // grabacion cuyo detalle de análisis (por qué del score) está abierto
  const [tipMap,setTipMap]=usePersist(_pk+"tipMap",{});            // IDLLAMADA -> {tipif, dni, descartar} (del CRM)
  const [cruceHecho,setCruceHecho]=usePersist(_pk+"cruceHecho",false); // ya se cruzó con el CRM → sin tipificación = descartar
  const [sinCRMset,setSinCRMset]=usePersist(_pk+"sinCRMset",{}); // carteras sin CRM (ej Hipotecario): NO descartar por falta de tipificación
  const [abiertos,setAbiertos]=usePersist(_pk+"abiertos",{});        // grupos (acordeón) desplegados
  const [loading,setLoading]=useState(false);
  const [prog,setProg]=useState(null);              // {hechas,total,nombre}
  const [err,setErr]=useState("");
  const [rubricas,setRubricas]=useState([]);        // prompts por cliente (Agentes IA)
  const [sysCfg,setSysCfg]=useState({transcriptor:"",modelo:""});
  const [analizando,setAnalizando]=useState({});    // grabacion -> estado del análisis en curso
  const [batchAn,setBatchAn]=useState(null);        // {hechas,total} durante "Analizar pendientes"
  const cancelAn=useRef(false);
  // Registro histórico de actividad (pedido Mariana pto 2): qué se analizó, cuándo y por quién → no duplicar.
  const [actividad,setActividad]=useState(null);    // null = todavía no cargado
  const [actOpen,setActOpen]=useState(false);
  const [actLoad,setActLoad]=useState(false);
  const [actCartera,setActCartera]=useState("Todas");   // filtro del registro
  const [actOperador,setActOperador]=useState("Todos");
  const [actRow,setActRow]=useState(null);          // grupo expandido (día||op||cartera) → ver cuáles se analizaron

  // Lista de operadores (usuarios con rol gestor + Nº Neotel).
  useEffect(function(){
    if(!window.db)return;
    window.db.collection("usuarios").get().then(function(snap){
      var arr=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());})
        .filter(function(u){return (u.role||"gestor")==="gestor";})
        .map(function(u){return {id:u.id,name:u.name||u.user||"—",neotelId:String(u.neotelId||"").trim(),cliente:u.cliente||"—"};});
      setGestores(arr);
    }).catch(function(e){console.error("[DASA] usuarios:",e);});
  },[]);

  // Rúbricas por cliente + config de sistema → poder analizar desde acá.
  useEffect(function(){
    if(!window.db)return;
    window.db.collection("agentes_ia").get().then(function(s){setRubricas(s.docs.map(function(d){return d.data();}));}).catch(function(){});
    window.db.collection("configuracion").doc("sistema").get().then(function(d){if(d.exists)setSysCfg(d.data());}).catch(function(){});
  },[]);
  const rubricaDe=function(cart){var c=String(cart||"").toLowerCase();var m=rubricas.find(function(x){return x.nombre&&c.indexOf(String(x.nombre).toLowerCase())>=0;});return (m&&m.prompt)||RUBRICA_DEFAULT;};
  // Analiza UNA llamada: transcribe → IA (rúbrica del cliente) → guarda en Firestore. Mismo flujo que en Audios.
  const analizarUna=async function(c){
    if(analizando[c.grabacion])return;
    setAnalizando(function(p){var n=Object.assign({},p);n[c.grabacion]="🎙 Transcribiendo…";return n;});
    try{
      var rt=await fetchTO(window.TRANSCRIBIR_PROXY||"/transcribir.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({file:c.grabacion,motor:(sysCfg.transcriptor||"openai")})},240000);
      var dt=await rt.json();
      if(!dt.ok)throw new Error(dt.error||"Error al transcribir");
      setAnalizando(function(p){var n=Object.assign({},p);n[c.grabacion]="🤖 Analizando…";return n;});
      var cartera=c.cliente||"";
      var cuerpo={transcripcion:dt.transcripcion,prompt:rubricaDe(cartera),cliente:cartera};
      if(sysCfg.modelo)cuerpo.modelo=sysCfg.modelo;
      var ra=await fetchTO(window.ANALIZAR_PROXY||"/analizar.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify(cuerpo)},180000);
      var da=await ra.json();
      if(!da.ok)throw new Error(da.error||"Error al analizar");
      // Caso completo: guardamos TODA la info de la llamada (DNI, tipificación, teléfono, duración) junto al análisis.
      var resultado=Object.assign({},da.analisis,{transcripcion:dt.transcripcion,idLlamada:c.idLlamada||c.grabacion,grabacion:c.grabacion,fecha:c.fecha,hora:c.hora||"",neotelId:c.neotelId,gestor:c.operador,cliente:cartera,dni:c.dni||"",tipif:c.tipif||"",telefono:_telLlamada(c.grabacion,c.grabacion),durSeg:c.durSeg||0,dur:c.dur||"",modelo:da.modelo||"",origen:"manual",analizadoPor:(user&&(user.name||user.user))||"",analizadoEn:new Date().toISOString()});
      if(window.db){try{await window.db.collection("analisis_llamadas").doc(c.grabacion).set(Object.assign({},resultado,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));}catch(e){}}
      setAnalizadas(function(p){var n=Object.assign({},p);n[c.grabacion]={score:resultado.score,es_valida:resultado.es_valida,criterios:resultado.criterios||[],analisis:resultado.analisis||"",recomendacion:resultado.recomendacion||"",modelo:resultado.modelo||"",cliente:resultado.cliente||"",transcripcion:resultado.transcripcion||""};return n;});
    }catch(e){
      var _raw=(e&&e.message)||"error", _msg, _tout=4500;
      if(e&&e.name==="AbortError"){_msg="⏱ Tardó demasiado y se salteó. Reintentá esta llamada.";_tout=6000;}
      else if(/no encontrado|no existe|not found|sin audio/i.test(_raw)){
        var _f=c.fecha?new Date(c.fecha+"T00:00:00"):null, _dias=_f?((Date.now()-_f.getTime())/86400000):99;
        _msg=(_dias>=0&&_dias<2)?"⏳ El audio todavía no llegó al NAS (se respalda durante la noche). Probá mañana.":"🔇 No hay audio de esta llamada en el NAS.";
        _tout=7000;
      }else _msg="⚠️ "+_raw;
      setAnalizando(function(p){var n=Object.assign({},p);n[c.grabacion]=_msg;return n;});
      setTimeout(function(){setAnalizando(function(p){var n=Object.assign({},p);delete n[c.grabacion];return n;});},_tout);
      return;
    }
    setAnalizando(function(p){var n=Object.assign({},p);delete n[c.grabacion];return n;});
  };
  // Analiza en lote las pendientes de la vista (secuencial, cancelable; las ya hechas se saltean).
  const analizarPendientes=async function(pendientes){
    cancelAn.current=false;
    var pend=pendientes.filter(function(c){return !analizadas[c.grabacion]&&!analizando[c.grabacion];});
    if(!pend.length)return;
    setBatchAn({hechas:0,total:pend.length});
    for(var i=0;i<pend.length;i++){
      if(cancelAn.current)break;
      await analizarUna(pend[i]);
      setBatchAn({hechas:i+1,total:pend.length});
    }
    setBatchAn(null);
    cargarActividad(true);   // refrescar el registro tras un lote
  };
  // Registro de actividad: lee analisis_llamadas y agrupa por día de carga + operador (qué se analizó, cuándo, por quién, manual/auto).
  const cargarActividad=async function(forzar){
    if(!window.db){setActividad([]);return;}
    if(actLoad)return; if(actividad!==null&&!forzar)return;
    setActLoad(true);
    try{
      // Solo los últimos ~90 días (la actividad reciente), no los 10k+ de toda la base.
      var _lim=new Date();_lim.setDate(_lim.getDate()-90);var _limS=_lim.toISOString().slice(0,10);
      var snap=await window.db.collection("analisis_llamadas").where("fecha",">=",_limS).get();
      var by={};
      snap.docs.forEach(function(d){
        var x=d.data();
        var cr=(x.createdAt&&x.createdAt.toDate)?x.createdAt.toDate():(x.analizadoEn?new Date(x.analizadoEn):null);
        var dia=cr?cr.toISOString().slice(0,10):(x.fecha||"—");
        var op=x.gestor||"—", cart=x.cliente||"—";
        var k=dia+"||"+op+"||"+cart;
        if(!by[k])by[k]={dia:dia,operador:op,cartera:cart,analizadas:0,descartadas:0,suma:0,n:0,manual:0,auto:0,por:{},items:[]};
        var r=by[k], org=String(x.origen||""), desc=(org==="auto-descarte"||x.es_valida===false);
        if(desc){r.descartadas++;}
        else{r.analizadas++;if(typeof x.score==="number"){r.suma+=x.score;r.n++;}}
        if(org.indexOf("auto")===0)r.auto++; else r.manual++;
        if(x.analizadoPor)r.por[x.analizadoPor]=(r.por[x.analizadoPor]||0)+1;
        r.items.push({grabacion:x.grabacion||"",telefono:x.telefono||_telLlamada(x.grabacion,"—"),dni:x.dni||"",tipif:x.tipif||"",score:(typeof x.score==="number"?x.score:null),desc:desc,fecha:x.fecha||dia,hora:x.hora||""});
      });
      var arr=Object.keys(by).map(function(k){var r=by[k];r.prom=r.n?Math.round(r.suma/r.n):null;r.quien=Object.keys(r.por).join(", ");return r;});
      arr.sort(function(a,b){return b.dia.localeCompare(a.dia)||a.operador.localeCompare(b.operador);});
      setActividad(arr);
    }catch(e){setActividad([]);}
    setActLoad(false);
  };

  const carteras=["Todas"].concat(Array.from(new Set(gestores.map(function(g){return g.cliente;}))).filter(function(c){return c&&c!=="—";}).sort());
  const gestFiltro=gestores.filter(function(g){return g.neotelId&&(carteraSel==="Todas"||g.cliente===carteraSel);});
  const operadores=["Todos"].concat(gestFiltro.map(function(g){return g.name;}).sort());
  const sinNeotel=gestores.filter(function(g){return !g.neotelId&&(carteraSel==="Todas"||g.cliente===carteraSel);}).length;

  const diasRango=function(){
    var d1=desde,d2=(hasta<desde?desde:hasta),out=[],n=0;
    var cur=new Date(d1+"T00:00:00"),end=new Date(d2+"T00:00:00");
    while(cur<=end&&n<62){out.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);n++;}
    return out;
  };

  const cargar=async function(){
    setLoading(true);setErr("");setCalls(null);setProg(null);setCruceHecho(false);
    // 1) Traer TODO lo ya analizado (Firestore) para cruzar por grabación.
    var mapa={};
    try{
      if(window.db){
        // Traer SOLO los análisis del rango consultado (no los 10k+ de toda la base) → mucho más rápido y barato en Firestore.
        var _d1=desde, _d2=(hasta<desde?desde:hasta);
        var _q=window.db.collection("analisis_llamadas");
        if(_d1&&_d2) _q=_q.where("fecha",">=",_d1).where("fecha","<=",_d2);
        var snap=await _q.get();
        snap.docs.forEach(function(d){var x=d.data();if(x.grabacion)mapa[x.grabacion]={score:x.score,es_valida:x.es_valida,criterios:x.criterios||[],analisis:x.analisis||"",recomendacion:x.recomendacion||"",modelo:x.modelo||"",cliente:x.cliente||"",transcripcion:x.transcripcion||""};});
      }
    }catch(e){}
    setAnalizadas(mapa);
    // 2) Llamadas de Neotel: una consulta por operador × día, EN PARALELO (pool de 8)
    //    para que no tarde tanto. Va mostrando resultados parciales a medida que llegan.
    var objetivo=gestorFijo?[{id:gestorFijo.id,name:gestorFijo.name,neotelId:String(gestorFijo.neotelId||"").trim(),cliente:gestorFijo.cliente}]:gestFiltro.filter(function(g){return operadorSel==="Todos"||g.name===operadorSel;});
    objetivo=objetivo.filter(function(g){return g.neotelId;});
    if(!objetivo.length){setErr("Este operador no tiene Nº Neotel cargado (Administración de gestores).");setLoading(false);return;}
    var dias=diasRango();
    var tareas=[];
    objetivo.forEach(function(g){dias.forEach(function(dd){tareas.push({g:g,dd:dd});});});
    var todas=[], hechas=0, idx=0, abortado=false;
    var K=Math.min(8,tareas.length);
    setProg({hechas:0,total:tareas.length});
    var mapCall=function(g,dd,c){var s=c.durSeg!=null?c.durSeg:(c.duracionSeg||0);return {grabacion:c.grabacion,idLlamada:String(c.grabacion||"").split("-")[1]||"",neotelId:g.neotelId,operador:g.name,cliente:g.cliente,crm:c.crm||0,fecha:dd,hora:c.hora||(c.inicio?c.inicio.slice(11,16):"--"),durSeg:s,dur:c.dur||(Math.floor(s/60)+":"+((s%60)<10?"0":"")+(s%60))};};
    // Trae un operador-día: memoria → Firestore (días cerrados) → Neotel. Hoy siempre fresco.
    var traerDia=async function(g,dd){
      var key=g.neotelId+"_"+dd, esHoy=(dd===hoy);
      // Cache viejo (guardado antes de agregar el CRM) → sin crm no se puede cruzar: se ignora y se re-trae de Neotel.
      var _tieneCrm=function(a){return !a.length||a[0].crm!==undefined;};
      if(!esHoy&&_llamadasCache[key]&&_tieneCrm(_llamadasCache[key]))return _llamadasCache[key].map(function(c){return mapCall(g,dd,c);});
      if(!esHoy&&window.db){
        try{var doc=await window.db.collection("neotel_calls_cache").doc(key).get();if(doc.exists){var raw=doc.data().calls||[];if(_tieneCrm(raw)){_llamadasCache[key]=raw;return raw.map(function(c){return mapCall(g,dd,c);});}}}catch(e){}
      }
      var res=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"calls",usuario:g.neotelId,fecha:dd})});
      var data=await res.json();
      if(data.error)throw new Error(data.error);
      var raw=(data.calls||[]).filter(function(x){return x.estado==="ANSWER"&&x.grabacion&&x.grabacion!="NULL"&&x.grabacion!=""&&(x.duracionSeg||0)>=DUR_MINIMA;})
        .map(function(x){var s=x.duracionSeg||0;return {grabacion:x.grabacion,hora:x.inicio?x.inicio.slice(11,16):"--",durSeg:s,dur:Math.floor(s/60)+":"+((s%60)<10?"0":"")+(s%60),crm:x.crm||0};});
      if(!esHoy){_llamadasCache[key]=raw;if(window.db){try{window.db.collection("neotel_calls_cache").doc(key).set({neotelId:g.neotelId,fecha:dd,calls:raw,cachedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});}catch(e){}}}
      return raw.map(function(c){return mapCall(g,dd,c);});
    };
    var worker=async function(){
      while(idx<tareas.length&&!abortado){
        var t=tareas[idx++];
        try{var arr=await traerDia(t.g,t.dd);todas.push.apply(todas,arr);}
        catch(e){if(!abortado){abortado=true;setErr("Neotel: "+e.message+" — no se pudo conectar. Revisá la conexión con Neotel.");}return;}
        hechas++;setProg({hechas:hechas,total:tareas.length});if(hechas%8===0)setCalls(todas.slice());
      }
    };
    await Promise.all(Array.from({length:K},function(){return worker();}));
    if(abortado){setProg(null);setLoading(false);return;}
    // 3) Tipificaciones del CRM (por el CRM de cada llamada) → cruce por IDLLAMADA. Marca cuáles descartar.
    //    El nº de CRM (= base ECRM) viene en cada llamada → funciona para CUALQUIER cartera, sin whitelist.
    var crmsInv=Array.from(new Set(todas.map(function(c){return c.crm||0;}).filter(function(x){return x>0;})));
    var tmap={}, cruceErr=[], sinCRM={};
    await Promise.all(crmsInv.map(async function(crm){
      try{
        var r=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"tipificaciones",crm:crm,desde:desde,hasta:(hasta<desde?desde:hasta)})});
        var d=await r.json();
        if(d&&d.sinCRM){sinCRM[crm]=true;return;}
        if(d&&d.error){cruceErr.push("CRM "+crm+": "+d.error);return;}
        if(d&&d.tipificaciones){Object.keys(d.tipificaciones).forEach(function(k){tmap[k]=d.tipificaciones[k];});}
        else{cruceErr.push("CRM "+crm+": respuesta inesperada");}
      }catch(e){cruceErr.push("CRM "+crm+": "+e.message);}
    }));
    setTipMap(tmap);setSinCRMset(sinCRM);
    // Solo damos el cruce por hecho (y descartamos las "sin tipificación") si NO hubo errores del CRM.
    setCruceHecho(cruceErr.length===0);
    if(cruceErr.length){setErr("No se pudo traer la tipificación del CRM ("+cruceErr.join(" · ")+"). Por seguridad NO se descartó ninguna llamada; revisá la conexión y volvé a cargar.");}
    setCalls(todas);setProg(null);setLoading(false);
  };
  // Modo embebido (dentro de Calidad de gestión): al entrar a un operador, carga sus llamadas solo.
  useEffect(function(){ if(gestorFijo&&gestorFijo.neotelId){ setCarteraSel(gestorFijo.cliente||"Todas"); setOperadorSel(gestorFijo.name||"Todos"); cargar(); } },[gestorFijo&&gestorFijo.id]);
  // Al entrar desde "Tipificaciones → 🎧 Ver llamadas": pre-filtrar por esa tipificación y cargar solo esas.
  useEffect(function(){ if(gestorFijo)return; if(window._verTipif){ var t=window._verTipif; window._verTipif=null; setAgrupar("tipificacion"); setFiltroTips([t]); setVerFiltro("todas"); cargar(); } },[]);
  // Auto-cargar al ENTRAR a la pestaña Llamadas: trae solo el rango por defecto (ayer + hoy).
  // Una sola vez, cuando ya cargaron los gestores y todavía no hay llamadas en memoria.
  var _autoLoadLl=useRef(false);
  useEffect(function(){
    if(gestorFijo)return;                 // el operador embebido ya auto-carga aparte
    if(_autoLoadLl.current)return;
    if(calls!==null)return;               // ya había datos (persistidos entre pestañas)
    if(!gestores.length)return;           // esperar a que carguen los gestores
    _autoLoadLl.current=true; cargar();
  },[gestores.length]);

  // Derivados: marcar analizada/pendiente y agrupar.
  const lista=(calls||[]).map(function(c){
    var an=analizadas[c.grabacion];
    var idll=c.idLlamada||String(c.grabacion||"").split("-")[1]||"";
    var tp=tipMap[idll];
    var _valida=!!an&&an.es_valida!==false;              // tiene análisis REAL (no un descarte del cron)
    var _descIA=!!an&&an.es_valida===false;              // el cron la marcó descartada (es_valida:false) → NO cuenta como analizada
    var _descVivo=tp?aplicaDescarte(tp.tipif,tp.descartar,reglasTip,modoTip):(modoTip==="whitelist"?cruceHecho:(cruceHecho&&(c.crm>0)&&!sinCRMset[c.crm]));
    return Object.assign({},c,{analizada:_valida,score:_valida?an.score:null,idLlamada:idll,tipif:tp?tp.tipif:"",dni:tp?tp.dni:"",descartar:_descIA||_descVivo});
  });
  const totAn=lista.filter(function(c){return c.analizada;}).length;
  const totDesc=lista.filter(function(c){return c.descartar;}).length;
  const totPend=lista.filter(function(c){return !c.analizada&&!c.descartar;}).length;
  const _q=q.trim().toLowerCase();
  const _grupoDe=function(c){return agrupar==="cartera"?(c.cliente||"—"):agrupar==="operador"?(c.operador||"—"):(c.tipif||"(sin tipificación)");};
  const listaF=lista.filter(function(c){
    if(filtroTips.length>0&&filtroTips.indexOf(c.tipif||"(sin tipificación)")<0)return false;
    if(verFiltro==="ok"&&!c.analizada)return false;
    if(verFiltro==="pend"&&(c.analizada||c.descartar))return false;   // pendientes = sin analizar y NO descartadas
    if(_q){var tel=String(_telLlamada(c.grabacion,c.grabacion)||"").toLowerCase();var dni=String(c.dni||"").toLowerCase();var _qd=_q.replace(/\D/g,"");var telN=_qd.length>=6&&_normTel(tel).indexOf(_normTel(_qd))>=0;if(!telN&&tel.indexOf(_q)<0&&dni.indexOf(_q)<0&&String(c.operador||"").toLowerCase().indexOf(_q)<0)return false;}
    return true;
  });
  const grupos={};
  listaF.forEach(function(c){var k=_grupoDe(c);(grupos[k]=grupos[k]||[]).push(c);});
  // Orden por importancia cuando se agrupa por tipificación: pagos/promesas arriba,
  // contacto positivo/negativo, luego las no-gestión, y "(sin tipificación)" al fondo.
  const grupCount=function(k){var arr=lista.filter(function(c){return _grupoDe(c)===k;});return {an:arr.filter(function(c){return c.analizada;}).length,pend:arr.filter(function(c){return !c.analizada&&!c.descartar;}).length,desc:arr.filter(function(c){return c.descartar;}).length};};
  const _prioTip=function(k){
    if(k==="(sin tipificación)")return 999;
    var t=(k||"").toLowerCase(); var base=grupCount(k).pend>0?0:100; var p=50;
    if(/sin voluntad|no pag|rechaz|desconoce|niega/.test(t))p=20;                        // negativas ANTES de "pago"
    else if(/prome|pdf|pag[oó]|plan de pago|quita|cancela|acuerdo|cuota/.test(t))p=0;
    else if(/inter[eé]s|negociaci|notific|manifiesta|acepta/.test(t))p=10;
    else if(/tercero/.test(t))p=25;
    return base+p;
  };
  // Prioridad de UNA llamada (para ordenar las filas dentro de cada grupo): pago/promesa arriba.
  const _prioLl=function(c){
    if(!c.tipif)return 60;             // sin tipificación → al fondo
    if(c.descartar)return 50;          // no-gestión → abajo
    var t=(c.tipif||"").toLowerCase();
    if(/sin voluntad|no pag|rechaz|desconoce|niega/.test(t))return 20;                   // negativas ANTES de "pago"
    if(/prome|pdf|pag[oó]|plan de pago|quita|cancela|acuerdo|cuota/.test(t))return 0;
    if(/inter[eé]s|negociaci|notific|manifiesta|acepta/.test(t))return 10;
    if(/tercero/.test(t))return 25;
    return 30;
  };
  // Orden de las filas dentro de cada grupo: "reciente" (default, más nuevas arriba) o "relevante" (pago/promesa arriba, rechazadas al fondo).
  const _cmpReciente=function(a,b){return String((b.fecha||"")+(b.hora||"")).localeCompare(String((a.fecha||"")+(a.hora||"")));};
  const _ordFilas=function(a,b){ if(orden==="relevante"){var pa=_prioLl(a),pb=_prioLl(b);if(pa!==pb)return pa-pb;} return _cmpReciente(a,b); };
  const keys=Object.keys(grupos).sort(function(a,b){
    if(agrupar!=="tipificacion")return a.localeCompare(b);
    var pa=_prioTip(a),pb=_prioTip(b); return pa!==pb?pa-pb:a.localeCompare(b);
  });
  // Tipificaciones disponibles (para el filtro puntual), ordenadas por importancia.
  const _tipsCount={}; lista.forEach(function(c){var t=c.tipif||"(sin tipificación)";_tipsCount[t]=(_tipsCount[t]||0)+1;});
  const tipsDisp=Object.keys(_tipsCount).sort(function(a,b){var pa=_prioTip(a),pb=_prioTip(b);return pa!==pb?pa-pb:a.localeCompare(b);});

  const tab=function(activo){return {padding:"7px 15px",borderRadius:20,border:`2px solid ${activo?C.green:C.border}`,background:activo?C.green:C.white,color:activo?C.white:C.text,cursor:"pointer",fontSize:13,fontWeight:activo?700:400};};

  return <div>
    {!gestorFijo&&<SecTitle icon="📋">Llamadas</SecTitle>}
    {!gestorFijo&&<div style={{fontSize:13,color:C.muted,marginBottom:16,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.7}}>
      Todas las llamadas atendidas con grabación (de Neotel), cruzadas con lo ya analizado por la IA. Agrupalas por cartera o por operador y filtrá por analizadas / pendientes para ver qué falta. <strong>Tip:</strong> para que cargue rápido, filtrá por cartera y usá un rango de pocos días.
    </div>}

    {/* REGISTRO DE ACTIVIDAD (Mariana pto 2): qué se analizó y cuándo, para no duplicar. Desplegable → no acumula datos. */}
    {!gestorFijo&&<div style={{marginBottom:16,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
      <div onClick={function(){var v=!actOpen;setActOpen(v);if(v)cargarActividad(false);}} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",cursor:"pointer",background:actOpen?C.pale:C.white}}>
        <span style={{fontSize:12,color:C.muted,width:12}}>{actOpen?"▾":"▸"}</span>
        <span style={{fontSize:14,fontWeight:800,color:C.text}}>📋 Registro de actividad</span>
        <span style={{fontSize:11,color:C.muted}}>qué se analizó, cuándo y por quién — para no duplicar</span>
        {actOpen&&<button onClick={function(e){e.stopPropagation();cargarActividad(true);}} title="Actualizar" style={{marginLeft:"auto",padding:"4px 10px",border:`1px solid ${C.border}`,borderRadius:8,background:C.white,color:C.muted,cursor:"pointer",fontSize:11,fontWeight:600}}>↻ Actualizar</button>}
      </div>
      {actOpen&&(function(){
        var carts=["Todas"].concat(Array.from(new Set((actividad||[]).map(function(r){return r.cartera;}))).filter(function(c){return c&&c!=="—";}).sort());
        var ops=["Todos"].concat(Array.from(new Set((actividad||[]).filter(function(r){return actCartera==="Todas"||r.cartera===actCartera;}).map(function(r){return r.operador;}))).filter(function(o){return o&&o!=="—";}).sort());
        var filt=(actividad||[]).filter(function(r){return (actCartera==="Todas"||r.cartera===actCartera)&&(actOperador==="Todos"||r.operador===actOperador);});
        var selSty={padding:"6px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:12.5,background:C.white,color:C.text,maxWidth:200};
        var totAnaliz=filt.reduce(function(s,r){return s+r.analizadas;},0);
        return <div style={{borderTop:`1px solid ${C.border}`,padding:"10px 12px"}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:12,color:C.muted}}>Cartera:</span>
            <select value={actCartera} onChange={function(e){setActCartera(e.target.value);setActOperador("Todos");setActRow(null);}} style={selSty}>{carts.map(function(c){return <option key={c}>{c}</option>;})}</select>
            <span style={{fontSize:12,color:C.muted}}>Operador:</span>
            <select value={actOperador} onChange={function(e){setActOperador(e.target.value);setActRow(null);}} style={selSty}>{ops.map(function(o){return <option key={o}>{o}</option>;})}</select>
            <span style={{marginLeft:"auto",fontSize:11,color:C.faint}}>{totAnaliz} analizadas · {filt.length} grupo(s) · tocá una fila para ver cuáles</span>
          </div>
          {actLoad?<div style={{fontSize:13,color:C.muted,padding:"6px"}}>Cargando actividad…</div>
          :!filt.length?<div style={{fontSize:13,color:C.muted,padding:"6px"}}>No hay análisis para este filtro.</div>
          :<div style={{maxHeight:360,overflowY:"auto"}}>
            <div style={{display:"flex",fontSize:10,color:C.faint,fontWeight:700,padding:"2px 8px",textTransform:"uppercase",letterSpacing:.4}}>
              <span style={{width:14}}></span><span style={{width:82}}>Cargado</span><span style={{flex:1}}>Operador · Cartera</span><span style={{width:52,textAlign:"right"}}>Analiz.</span><span style={{width:46,textAlign:"right"}}>Prom.</span><span style={{width:48,textAlign:"right"}}>Desc.</span><span style={{width:64,textAlign:"right"}}>Origen</span>
            </div>
            {filt.map(function(r,i){
              var rk=r.dia+"||"+r.operador+"||"+r.cartera; var op=actRow===rk;
              return <div key={rk}>
                <div onClick={function(){setActRow(op?null:rk);}} style={{display:"flex",alignItems:"center",fontSize:12,color:C.text,padding:"6px 8px",background:op?C.pale:(i%2?C.bg:C.white),borderRadius:6,cursor:"pointer"}}>
                  <span style={{width:14,color:C.muted,fontSize:11}}>{op?"▾":"▸"}</span>
                  <span style={{width:82,color:C.muted}}>{r.dia}</span>
                  <span style={{flex:1,fontWeight:600}}>{r.operador} <span style={{fontSize:11,color:C.muted,fontWeight:400}}>· {r.cartera}</span>{r.quien&&<span style={{fontSize:10,color:C.faint,fontWeight:400}}> · {r.quien}</span>}</span>
                  <span style={{width:52,textAlign:"right",fontWeight:700,color:C.green}}>{r.analizadas}</span>
                  <span style={{width:46,textAlign:"right",fontWeight:700,color:r.prom!=null?scoreColor(r.prom):C.muted}}>{r.prom!=null?r.prom:"—"}</span>
                  <span style={{width:48,textAlign:"right",color:C.muted}}>{r.descartadas||""}</span>
                  <span style={{width:64,textAlign:"right",fontSize:11,color:C.muted}}>{r.auto?("🤖"+(r.manual?"+✋":"")):"✋"}</span>
                </div>
                {op&&<div style={{padding:"4px 8px 10px 22px",display:"flex",flexDirection:"column",gap:3}}>
                  {r.items.slice().sort(function(a,b){return (b.fecha+b.hora).localeCompare(a.fecha+a.hora);}).map(function(it,j){return <div key={j} style={{display:"flex",alignItems:"center",gap:10,fontSize:11.5,color:C.muted,padding:"4px 8px",background:C.white,border:`1px solid ${C.border}`,borderRadius:6,flexWrap:"wrap"}}>
                    <span style={{width:96}}>{it.fecha}{it.hora?" · "+it.hora:""}</span>
                    <span style={{minWidth:90}}>📞 {it.telefono}</span>
                    {it.dni&&<span>DNI {it.dni}</span>}
                    {it.tipif&&<span style={{flex:1,color:C.info}}>{it.tipif}</span>}
                    {!it.tipif&&<span style={{flex:1}}></span>}
                    {it.desc?<span style={{color:C.faint}}>🚫 no-gestión</span>:<span style={{fontWeight:700,color:it.score!=null?scoreColor(it.score):C.muted}}>{it.score!=null?it.score+" · "+scoreLabel(it.score):"—"}</span>}
                  </div>;})}
                </div>}
              </div>;
            })}
          </div>}
        </div>;
      })()}
    </div>}

    {/* FILTROS */}

      {!gestorFijo&&<div>
        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5,fontWeight:500}}>Operador</label>
        <select value={operadorSel} onChange={e=>setOperadorSel(e.target.value)} style={{padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,background:C.white,maxWidth:220}}>
          {operadores.map(o=><option key={o}>{o}</option>)}

    {!gestorFijo&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>

    {err&&<div style={{background:"#fce8e8",border:`1px solid ${C.danger}44`,color:C.danger,borderRadius:8,padding:"10px 14px",fontSize:13,marginBottom:12}}>⚠️ {err}</div>}
    {loading&&prog&&<div style={{fontSize:13,color:C.muted,marginBottom:12}}>Consultando Neotel… {prog.hechas}/{prog.total} · llamadas encontradas: <strong>{(calls||[]).length}</strong></div>}
    {sinNeotel>0&&<div style={{fontSize:12,color:C.warn,marginBottom:12}}>ℹ️ {sinNeotel} operador(es) de este filtro no tienen Nº Neotel cargado y no se consultan (cargalo en Administración de gestores).</div>}

    {calls!==null&&<div>
      {/* KPIs */}

          </button>

                <input type="checkbox" checked={on} onChange={function(){setFiltroTips(function(p){return on?p.filter(function(x){return x!==t;}):p.concat([t]);});}} style={{accentColor:C.green}}/>
                <span style={{flex:1}}>{t}</span><span style={{color:C.muted,fontSize:11}}>{_tipsCount[t]}</span>
              </label>;})}
            </div>
          </>}
        </div>
      </div>

      {/* ANALIZAR PENDIENTES (lote) */}

    </div>}
  </div>;

  // Agrupar los audios por cliente/cartera (así cada banco ve a sus operadores juntos).
  var _grupAud={}; filtrado.forEach(function(a){var k=(a.cliente&&a.cliente!=="—")?a.cliente:"Sin cliente asignado";(_grupAud[k]=_grupAud[k]||[]).push(a);});
  var _clientesAud=Object.keys(_grupAud).sort(function(a,b){if(a==="Sin cliente asignado")return 1;if(b==="Sin cliente asignado")return -1;return a.localeCompare(b);});
  var _nomNeotel={}; (gestoresLista||[]).forEach(function(g){var nid=String(g.neotelId||"").trim();if(nid)_nomNeotel[nid]=g.name||g.user||g.nombre;});
  var _durMS=function(s){s=parseInt(s||0,10);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);};
  // Selección con tilde (pedido Mariana): si hay tildadas se exportan SOLO esas; si no hay ninguna, todo el filtro.
  var _kSel=function(a){return a.grabacion||a.id;};
  var _seleccionadas=filtrado.filter(function(a){return !!selAud[_kSel(a)];});
  var _aExportar=_seleccionadas.length?_seleccionadas:filtrado;
  var _visibles=[]; _clientesAud.forEach(function(cli){var f=_grupAud[cli]||[];_visibles=_visibles.concat((selGestor!=="Todos"||_q)?f:f.slice(0,topN));});
  var _toggleSel=function(a){var k=_kSel(a);setSelAud(function(prev){var n=Object.assign({},prev);if(n[k])delete n[k];else n[k]=true;return n;});};
  var _tildarVisibles=function(){setSelAud(function(prev){var n=Object.assign({},prev);_visibles.forEach(function(a){n[_kSel(a)]=true;});return n;});};
  var _limpiarSel=function(){setSelAud({});};

  // Busca una LISTA de IDs de llamada en TODA la base (válidas y descartadas). Firestore "in" toma de a 10.
  // Carga números desde un Excel (.xlsx/.xls/.csv) o un TXT → llena el buscador. Reusa SheetJS (window.XLSX) ya cargado.
  const cargarNumsArchivo=function(file){
    if(!file){return;}
    var nombre=(file.name||"").toLowerCase();
    var esExcel=/\.(xlsx|xls)$/.test(nombre);
    var norm=function(tokens){ var out=[],vistos={};
      tokens.forEach(function(t){ var d=String(t==null?"":t).replace(/\D/g,""); if(d.length>=4&&d.length<=13&&!vistos[d]){vistos[d]=1;out.push(d);} });
      return out; };
    var terminar=function(nums){
      if(!nums.length){ setCargaMsg("⚠️ No se encontraron números válidos (4 a 13 dígitos) en el archivo."); return; }
      var extra=nums.length>300?(" · se usan los primeros 300"):"";
      setQIds(nums.slice(0,300).join("\n"));
      setCargaMsg("✓ "+nums.length+" número"+(nums.length===1?"":"s")+" cargado"+(nums.length===1?"":"s")+" desde "+(file.name||"archivo")+extra+". Tocá Buscar.");
    };
    var reader=new FileReader();
    reader.onerror=function(){ setCargaMsg("⚠️ No se pudo leer el archivo."); };
    if(esExcel){
      if(!window.XLSX){ setCargaMsg("⚠️ No se pudo cargar el lector de Excel (revisá la conexión)."); return; }
      reader.onload=function(ev){ try{
        var wb=window.XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        var tokens=[];
        wb.SheetNames.forEach(function(sn){
          var arr=window.XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",blankrows:false});
          arr.forEach(function(fila){ (fila||[]).forEach(function(celda){ tokens.push(celda); }); });
        });
        terminar(norm(tokens));
      }catch(e){ setCargaMsg("⚠️ No se pudo leer el Excel: "+((e&&e.message)||e)); } };
      reader.readAsArrayBuffer(file);
    }else{
      reader.onload=function(ev){ terminar(norm(String(ev.target.result||"").split(/[\s,;]+/))); };
      reader.readAsText(file);
    }
  };
  const buscarPorIds=async function(){
    var nums=(qIds||"").split(/[\s,;]+/).map(function(x){return x.trim();}).filter(Boolean);
    nums=Array.from(new Set(nums)).slice(0,300);
    if(!nums.length){setIdBusq({error:"Escribí o pegá al menos un número (ID de llamada, ID de contacto o teléfono)."});return;}
    if(!qDesde||!qHasta){setIdBusq({error:"Elegí el rango de fechas (Desde / Hasta)."});return;}
    setIdBusq({loading:true,total:nums.length});
    try{
      // Busca DIRECTO en Neotel (no en lo analizado): por ID de llamada, ID de contacto o teléfono,
      // en el rango de fechas. Aparece la llamada aunque nunca se haya analizado.
      // TODO en UNA sola consulta (búsqueda masiva rápida): el server enruta cada número por su largo.
      var r=await fetch(window.NEOTEL_PROXY||"/neotel_sql.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({action:"buscar_numero",numeros:nums,desde:qDesde,hasta:qHasta})});
      var d=await r.json();
      if(d&&d.error){ setIdBusq({error:"Neotel: "+d.error}); return; }
      var found=(d&&Array.isArray(d.resultados))?d.resultados:[];
      var notFound=(d&&Array.isArray(d.noEncontradas))?d.noEncontradas:[];
      var notas=(d&&d.notas)?d.notas:{};
      setIdBusq({found:found,notFound:notFound,notas:notas,total:nums.length});
      // marcar las que YA están analizadas (para mostrar el score y no re-analizarlas)
      setAnalizandoN({});
      var ya={};
      if(found.length&&window.db){
        var grabs=found.map(function(x){return x.grabacion;}).filter(Boolean);
        for(var b2=0;b2<grabs.length;b2+=10){
          var lote2=grabs.slice(b2,b2+10);
          try{ var snp=await window.db.collection("analisis_llamadas").where(firebase.firestore.FieldPath.documentId(),"in",lote2).get();
            snp.docs.forEach(function(dd){var xx=dd.data();ya[dd.id]=Object.assign({},xx,{motivo:(xx.motivo_invalida||xx.motivo||""),existente:true});}); }catch(e){}
        }
      }
      setAnalizadoN(ya);
    }catch(e){ setIdBusq({error:"Error buscando en Neotel: "+((e&&e.message)||e)}); }
  };

  // Analiza UNA llamada de los resultados de Neotel: transcribe → IA (rúbrica de la cartera) → guarda en Firestore.
  const analizarLlamadaN=async function(c,force){
    if(!c||!c.grabacion) return;
    if(analizandoN[c.grabacion]) return;
    if(!force&&analizadoN[c.grabacion]&&analizadoN[c.grabacion].existente) return;
    setAnalizandoN(function(p){var n=Object.assign({},p);n[c.grabacion]="🎙 Transcribiendo…";return n;});
    try{
      var rt=await fetchTO(window.TRANSCRIBIR_PROXY||"/transcribir.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify({file:c.grabacion,motor:(sysCfgE.transcriptor||"openai")})},240000);
      var dt=await rt.json(); if(!dt.ok)throw new Error(dt.error||"Error al transcribir");
      setAnalizandoN(function(p){var n=Object.assign({},p);n[c.grabacion]="🤖 Analizando…";return n;});
      var cartera=gestMap[String(c.usuario||"").trim()]||"";
      var cuerpo={transcripcion:dt.transcripcion,prompt:_rubricaDeE(cartera),cliente:cartera};
      if(sysCfgE.modelo)cuerpo.modelo=sysCfgE.modelo;
      var ra=await fetchTO(window.ANALIZAR_PROXY||"/analizar.php",{method:"POST",headers:{"Content-Type":"application/json","X-DASA-Token":(window.NEOTEL_TOKEN||"")},body:JSON.stringify(cuerpo)},180000);
      var da=await ra.json(); if(!da.ok)throw new Error(da.error||"Error al analizar");
      var fecha=String(c.inicio||"").slice(0,10);
      var resultado=Object.assign({},da.analisis,{transcripcion:dt.transcripcion,idLlamada:c.idLlamada||c.grabacion,grabacion:c.grabacion,fecha:fecha,neotelId:String(c.usuario||""),gestor:(_nomNeotel[String(c.usuario||"").trim()]||("Neotel "+(c.usuario||""))),cliente:cartera,telefono:_telLlamada(c.grabacion,c.idLlamada||""),durSeg:c.durSeg||0,crm:c.crm||0,modelo:da.modelo||"",origen:"manual",analizadoPor:(user&&(user.name||user.user))||"",analizadoEn:new Date().toISOString()});
      if(window.db){try{await window.db.collection("analisis_llamadas").doc(c.grabacion).set(Object.assign({},resultado,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));}catch(e){setErrDesc("No se pudo guardar el análisis: "+((e&&e.message)||e));}}
      setAnalizadoN(function(p){var n=Object.assign({},p);n[c.grabacion]=Object.assign({},resultado,{motivo:(resultado.motivo_invalida||resultado.motivo||""),existente:true});return n;});
    }catch(e){
      var _raw=(e&&e.message)||"error",_msg=(e&&e.name==="AbortError")?"⏱ Tardó demasiado, reintentá.":((/no encontrado|sin audio|not found/i.test(_raw))?"🔇 Sin audio en el NAS":("⚠️ "+_raw));
      setAnalizandoN(function(p){var n=Object.assign({},p);n[c.grabacion]=_msg;return n;});
      setTimeout(function(){setAnalizandoN(function(p){var n=Object.assign({},p);delete n[c.grabacion];return n;});},6000);
      return;
    }
    setAnalizandoN(function(p){var n=Object.assign({},p);delete n[c.grabacion];return n;});
  };
  // Analiza TODAS las de la lista que todavía no están analizadas (secuencial, cancelable).
  const analizarTodasFaltanN=async function(lista,force){
    cancelAnN.current=false;
    var pend=(lista||[]).filter(function(c){return c.grabacion&&(force||!(analizadoN[c.grabacion]&&analizadoN[c.grabacion].existente))&&!analizandoN[c.grabacion];});
    if(!pend.length)return;
    setBatchN({hechas:0,total:pend.length});
    for(var i=0;i<pend.length;i++){ if(cancelAnN.current)break; await analizarLlamadaN(pend[i],true); setBatchN({hechas:i+1,total:pend.length}); }
    setBatchN(null);
  };

  return <div>
    <SecTitle icon="🎧">Audios para Auditorías Externas</SecTitle>
    <BuscarAudioDato/>
    {/* Buscar por LISTA de IDs de llamada — trae TODAS (incluidas las descartadas) */}
    <div style={{border:`1px solid ${C.border}`,borderRadius:12,marginBottom:16,overflow:"hidden"}}>
      <div onClick={function(){setIdOpen(!idOpen);}} style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",cursor:"pointer",background:C.bg,flexWrap:"wrap"}}>
        <span style={{fontSize:14,fontWeight:700,color:C.text}}>🔎 Buscar llamada por número</span>
        <span style={{fontSize:12,color:C.muted}}>ID de llamada (9 díg.), DNI (7-8) o teléfono (10-13) — busca DIRECTO en Neotel, esté analizada o no</span>
        <span style={{marginLeft:"auto",fontSize:12,color:C.muted}}>{idOpen?"▲":"▼"}</span>
      </div>
      {idOpen&&<div style={{padding:"14px 16px"}}>
        <div style={{display:"flex",gap:12,marginBottom:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div><label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>Desde</label>
            <input type="date" value={qDesde} max={qHasta||undefined} onChange={function(e){setQDesde(e.target.value);}} style={{padding:"6px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/></div>
          <div><label style={{fontSize:11,color:C.muted,display:"block",marginBottom:3}}>Hasta</label>
            <input type="date" value={qHasta} min={qDesde||undefined} onChange={function(e){setQHasta(e.target.value);}} style={{padding:"6px 10px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13}}/></div>
          <span style={{fontSize:11,color:C.muted}}>Buscá dentro del mes de las llamadas (máx 45 días).</span>
        </div>
        <textarea value={qIds} onChange={function(e){setQIds(e.target.value);}} rows={4} placeholder={"Escribí un número: ID de llamada (9 díg.), DNI (7-8) o teléfono.\nPodés pegar varios, uno por línea."}
          style={{width:"100%",boxSizing:"border-box",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:10,fontSize:13,fontFamily:"monospace",resize:"vertical"}}/>
        <div style={{display:"flex",gap:10,alignItems:"center",marginTop:8}}>
          <button onClick={buscarPorIds} disabled={idBusq&&idBusq.loading}
            style={{padding:"8px 18px",background:(idBusq&&idBusq.loading)?C.muted:C.green,color:C.white,border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>
            {(idBusq&&idBusq.loading)?"Buscando…":"Buscar"}
          </button>
          <input ref={fileRefN} type="file" accept=".txt,.csv,.xlsx,.xls" style={{display:"none"}}
            onChange={function(e){var f=e.target.files&&e.target.files[0];if(f)cargarNumsArchivo(f);if(fileRefN.current)fileRefN.current.value="";}}/>
          <button onClick={function(){setCargaMsg("");if(fileRefN.current)fileRefN.current.click();}} title="Cargar los números desde un Excel (.xlsx/.xls/.csv) o un TXT — una columna o uno por línea"
            style={{padding:"8px 14px",background:C.white,color:C.green,border:`1px solid ${C.green}`,borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700}}>📄 Cargar de Excel/TXT</button>
          {qIds.trim()&&<button onClick={function(){setQIds("");setIdBusq(null);setCargaMsg("");}}
            style={{padding:"8px 12px",background:C.white,color:C.muted,border:`1px solid ${C.border}`,borderRadius:8,cursor:"pointer",fontSize:12}}>Limpiar</button>}
        </div>
        {cargaMsg&&<div style={{marginTop:8,fontSize:12,color:cargaMsg.charAt(0)==="✓"?C.green:C.warn}}>{cargaMsg}</div>}
        {idBusq&&idBusq.error&&<div style={{marginTop:10,color:C.danger,fontSize:13}}>⚠️ {idBusq.error}</div>}
        {idBusq&&idBusq.found&&<div style={{marginTop:12}}>
          <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:8}}>Encontradas {idBusq.found.length} de {idBusq.total}</div>
          {(function(){
            var faltan=idBusq.found.filter(function(x){return x.grabacion&&!(analizadoN[x.grabacion]&&analizadoN[x.grabacion].existente);});
            return <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
              {faltan.length>0&&!batchN&&<button onClick={function(){analizarTodasFaltanN(idBusq.found);}}
                style={{fontSize:12,fontWeight:700,color:C.white,background:C.green,border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer"}}>🤖 Analizar las {faltan.length} que faltan</button>}
              {batchN&&<span style={{fontSize:12,color:C.info,fontWeight:700}}>Analizando… {batchN.hechas}/{batchN.total}</span>}
              {batchN&&<button onClick={function(){cancelAnN.current=true;}}
                style={{fontSize:11,color:C.danger,background:C.white,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>Cancelar</button>}
              {faltan.length===0&&!batchN&&idBusq.found.length>0&&<span style={{fontSize:12,color:C.green}}>Todas analizadas ✓</span>}
              {!batchN&&idBusq.found.length>0&&<button onClick={function(){if(window.confirm("Re-analizar las "+idBusq.found.length+" de nuevo? Transcribe y analiza otra vez, sobrescribe el análisis anterior (útil si quedaron mal descartadas).")) analizarTodasFaltanN(idBusq.found,true);}}
                style={{fontSize:11,color:C.info,background:C.white,border:`1px solid ${C.border}`,borderRadius:8,padding:"5px 10px",cursor:"pointer"}}>↻ Re-analizar todas</button>}
            </div>;
          })()}
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {idBusq.found.map(function(x,i){
              var url=x.grabacion?("/audio.php?file="+encodeURIComponent(x.grabacion)+"&token="):null;
              var op=_nomNeotel[String(x.usuario||"").trim()]||("Neotel "+(x.usuario||"?"));
              var cli=gestMap[String(x.usuario||"").trim()]||"";
              var an=analizadoN[x.grabacion], st=analizandoN[x.grabacion];
              var k=x.grabacion||x.idLlamada||("x"+i);
              var abierto=!!expN[k];
              var _det=(an&&an.existente)?Object.assign({},an,{grabacion:an.grabacion||x.grabacion,cliente:an.cliente||cli,gestor:an.gestor||op,telefono:an.telefono||_telLlamada(x.grabacion,x.idLlamada||"—")}):null;
              return <div key={(x.idLlamada||"x")+"_"+i} style={{border:`1px solid ${C.border}`,borderRadius:8,background:C.white,overflow:"hidden"}}>
                <div onClick={function(){if(!x.grabacion)return;setExpN(function(p){var n=Object.assign({},p);n[k]=!n[k];return n;});}} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",flexWrap:"wrap",cursor:x.grabacion?"pointer":"default"}}>
                  <span style={{fontSize:12,fontWeight:700,color:C.text}}>Llam {x.idLlamada||"—"}</span>
                  <span style={{fontSize:11,color:C.muted}}>Cont {x.idContacto||"—"}</span>
                  <span style={{fontSize:12,color:C.muted}}>{x.inicio||""}</span>
                  <span style={{fontSize:12,color:C.muted}}>{op}</span>
                  {cli&&<span style={{fontSize:11,color:C.muted,background:C.bg,borderRadius:10,padding:"1px 8px"}}>{cli}</span>}
                  <span style={{fontSize:11,color:x.estado==="ANSWER"?C.green:C.muted}}>{x.estado==="ANSWER"?("atendida "+_durMS(x.durSeg)):x.estado}</span>
                  <span style={{marginLeft:"auto",display:"inline-flex",gap:10,alignItems:"center"}}>{(function(){
                    if(st) return <span style={{fontSize:11,color:C.info}}>{st}</span>;
                    if(an&&an.existente) return <span style={{display:"inline-flex",gap:6,alignItems:"center"}}>
                      <span style={{fontSize:11,fontWeight:700,color:an.es_valida===false?C.muted:C.green,background:an.es_valida===false?C.bg:C.pale,border:`1px solid ${an.es_valida===false?C.border:C.paleB}`,borderRadius:10,padding:"2px 9px"}} title={an.motivo||""}>{an.es_valida===false?("no apta"+(an.motivo?" · "+an.motivo:"")):("✓ score "+(an.score!=null?an.score:"—"))}</span>
                      <button onClick={function(e){e.stopPropagation();analizarLlamadaN(x,true);}} title="Forzar un análisis nuevo" style={{fontSize:10,color:C.info,background:"transparent",border:"none",cursor:"pointer",textDecoration:"underline"}}>↻ re-analizar</button>
                    </span>;
                    return <button onClick={function(e){e.stopPropagation();analizarLlamadaN(x);}} style={{fontSize:11,fontWeight:700,color:C.white,background:C.info,border:"none",borderRadius:8,padding:"3px 12px",cursor:"pointer"}}>Analizar</button>;
                  })()}
                  {url&&<a href={url} download onClick={function(e){e.stopPropagation();}} title="Descargar el audio" style={{fontSize:12,color:C.green,textDecoration:"none",fontWeight:700}}>⬇</a>}
                  {x.grabacion&&<span style={{fontSize:11,color:C.muted}} title={abierto?"Cerrar":"Ver detalle y escuchar"}>{abierto?"▲":"▼"}</span>}
                  </span>
                </div>
                {abierto&&x.grabacion&&<div style={{borderTop:`1px solid ${C.border}`,padding:"10px 12px",background:C.bg}}>
                  {_det
                    ? <AnalisisDetalle c={_det}/>
                    : <div>
                        <div style={{background:"#1e3320",borderRadius:8,padding:"9px 12px"}}>
                          <div style={{fontSize:10,color:"rgba(255,255,255,0.55)",marginBottom:6}}>🎧 Audio de la llamada</div>
                          <audio controls preload="none" src={url} onError={function(){setAudioErrN(function(p){var n=Object.assign({},p);n[x.grabacion]=true;return n;});}} style={{width:"100%"}}/>
                          {audioErrN[x.grabacion]&&<div style={{fontSize:11,color:C.warn,marginTop:6}}>🔇 El audio no está en el NAS (llamada muy corta o no se copió la grabación).</div>}
                        </div>
                        <div style={{fontSize:12,color:C.muted,marginTop:8}}>Todavía sin analizar. Tocá <strong style={{color:C.info}}>Analizar</strong> para ver el score, el detalle por criterio, la recomendación y la transcripción.</div>
                      </div>}
                </div>}
              </div>;
            })}
          </div>
          {idBusq.notFound.length>0&&<div style={{marginTop:10,fontSize:12,color:C.warn}}>
            No encontradas ({idBusq.notFound.length}): {idBusq.notFound.join(", ")}
            {idBusq.notas&&Object.keys(idBusq.notas).length>0&&<div style={{marginTop:4,fontSize:11,color:C.muted}}>{Object.keys(idBusq.notas).map(function(k){return k+": "+idBusq.notas[k];}).join(" · ")}</div>}
          </div>}
        </div>}
      </div>}
    </div>
    <div style={{fontSize:13,color:C.muted,marginBottom:20,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"10px 14px",lineHeight:1.7}}>
      Los audios aparecen agrupados por cliente/cartera y, dentro de cada uno, ordenados por score (los mejores primero) para elegir muestras de auditoría externa. Filtrá por cliente, mes o gestor. El cliente sale del banco asignado al operador en Administración de gestores.
    </div>

    {/* REGISTRO DE DESCARGAS + EXPORT */}
    <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:16,background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px"}}>
      <span style={{fontSize:13,color:C.text}}>
        📥 <strong>Registro de descargas.</strong>{" "}
        {_ultimaDesc
          ? <span>Última: <strong>{_fmtFecha(_ultimaDesc.ultimaFecha)}</strong> · {_ultimaDesc.cliente||_ultimaDesc.gestor||"—"} · por {_ultimaDesc.ultimaPor||"—"}</span>
          : <span style={{color:C.muted}}>Todavía no se registró ninguna descarga.</span>}
      </span>
      {errDesc&&<span style={{fontSize:12,color:C.danger,background:"#fce8e8",border:`1px solid ${C.danger}44`,borderRadius:8,padding:"3px 10px"}} title={errDesc}>⚠️ {errDesc}</span>}

              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,flexShrink:0}}>

                  {a.dur&&<span style={{fontSize:11,color:C.muted}}>⏱ {a.dur}</span>}

                  {descargas[a.grabacion]&&<span style={{fontSize:10,fontWeight:700,color:C.green,background:C.pale,border:`1px solid ${C.paleB}`,borderRadius:10,padding:"1px 7px"}} title={"Descargado "+_fmtFecha(descargas[a.grabacion].ultimaFecha)+" por "+(descargas[a.grabacion].ultimaPor||"—")+(descargas[a.grabacion].veces>1?(" · "+descargas[a.grabacion].veces+" veces"):"")}>✔ Descargado</span>}
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {a.aspectos.slice(0,4).map((asp,j)=>(
                    <span key={j} style={{fontSize:11,color:asp.startsWith("✓")?C.green:asp.startsWith("✗")?C.danger:C.warn}}>{asp}</span>

              {/* Actions */}
              <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                {a.audioUrl&&<a href={a.audioUrl} download onClick={e=>{e.stopPropagation();registrarDescarga(a);}}
                  style={{padding:"6px 10px",border:`1px solid ${descargas[a.grabacion]?C.green:C.border}`,borderRadius:8,background:descargas[a.grabacion]?C.pale:C.white,cursor:"pointer",fontSize:12,color:descargas[a.grabacion]?C.green:C.muted,textDecoration:"none",fontWeight:descargas[a.grabacion]?700:400}}
                  title={descargas[a.grabacion]?("Ya descargado "+_fmtFecha(descargas[a.grabacion].ultimaFecha)+" por "+(descargas[a.grabacion].ultimaPor||"—")+". Podés bajarlo de nuevo."):"Descargar para auditoría"}>
                  {descargas[a.grabacion]?"⬇ Descargar de nuevo":"⬇ Descargar"}
                </a>}
                <span style={{fontSize:11,color:C.muted}}>{open?"▲":"▼"}</span>
              </div>
            </div>

            {/* EXPANDED */}
            {open&&<div style={{padding:"0 14px 14px 44px",borderTop:`1px solid ${col}22`}}>
              {/* Player real (audio.php · solo lectura del NAS) */}
              <div style={{background:"#1e3320",borderRadius:10,padding:"10px 14px",margin:"10px 0"}}>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",marginBottom:7}}>{a.gestor} · {a.cliente} · {a.fecha}</div>
                {a.audioUrl
                  ?<audio controls preload="none" src={a.audioUrl} style={{width:"100%"}}/>
                  :<div style={{fontSize:12,color:"rgba(255,255,255,0.5)"}}>Sin grabación asociada.</div>}
              </div>
              {/* Aspectos */}
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {a.aspectos.map((asp,j)=>(
                  <span key={j} style={{fontSize:12,background:asp.startsWith("✓")?`${C.light}18`:asp.startsWith("✗")?`${C.danger}18`:`${C.warn}18`,color:asp.startsWith("✓")?C.green:asp.startsWith("✗")?C.danger:C.warn,border:`1px solid ${asp.startsWith("✓")?C.paleB:asp.startsWith("✗")?C.danger+"44":C.warn+"44"}`,borderRadius:20,padding:"3px 10px"}}>{asp}</span>
                ))}

              {/* Criterios detallados */}
              {a.criterios&&a.criterios.length>0&&<div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
                {a.criterios.map((c,j)=>(
                  <div key={j} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:12,borderBottom:`1px solid ${C.border}`,paddingBottom:4}}>
                    <span style={{flex:1,color:C.text}}>{c.nombre} <span style={{color:C.muted}}>({c.peso}%)</span>{c.comentario&&<span style={{display:"block",color:C.muted,fontSize:11,marginTop:1}}>{c.comentario}</span>}</span>
                    <span style={{fontWeight:700,color:scoreColor(c.puntaje),flexShrink:0}}>{c.puntaje}</span>

              {/* Análisis */}
              <div style={{background:C.bg,borderRadius:8,padding:"11px 14px",fontSize:13,color:C.text,lineHeight:1.7}}>

                {a.analisis}

            </div>
          </div>;
        })}

    }

}
